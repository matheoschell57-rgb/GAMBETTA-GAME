<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gambetta Game</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e0217a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gambetta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:inherit}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#bfeaff;--bg2:#6fcdf3;--card:#ffffff;--text:#1b2a3a;--muted:#4b6378;
  --ink:#1b2a3a;--yellow:#ffcf33;--coral:#ff6b5b;--green:#2fb36d;--red:#e63b3b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e2a40;--bg2:#15486b;--card:#1f3d56;--text:#f3f8fc;--muted:#a9c1d4}
}
:root[data-theme="dark"]{--bg:#0e2a40;--bg2:#15486b;--card:#1f3d56;--text:#f3f8fc;--muted:#a9c1d4}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;height:100%;max-width:640px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex;animation:fadeIn .35s ease}
.av{display:block;width:100%;height:auto}
button{font:inherit}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}

/* ---------- Titre ---------- */
#title{align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:20px 16px 110px}
.title-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo-badge{background:var(--pink,#e0217a);border:5px solid #1b2a3a;border-radius:50%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:16%}
.logo-badge img{width:100%;height:auto;display:block}
.logo{width:min(40vw,170px);filter:drop-shadow(0 6px 0 rgba(27,42,58,.35));animation:bob 3s ease-in-out infinite}
.gametitle{font-family:'Lilita One','Fredoka',Impact,sans-serif;font-weight:400;margin:0;line-height:.88;
  font-size:clamp(48px,15vw,84px);transform:rotate(-3deg);letter-spacing:1px}
.gametitle span{display:block;color:#fff;
  text-shadow:3px 3px 0 #1b2a3a,-3px -3px 0 #1b2a3a,3px -3px 0 #1b2a3a,-3px 3px 0 #1b2a3a,0 3px 0 #1b2a3a,3px 0 0 #1b2a3a,-3px 0 0 #1b2a3a,0 -3px 0 #1b2a3a,0 9px 0 #1b2a3a}
.gametitle .g2{color:var(--yellow);font-size:1.15em}
.newlogo{width:min(80vw,360px,46vh)}
.newlogo img{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 0 rgba(27,42,58,.25)) drop-shadow(0 0 0 #fff)}
.title-chars{display:flex;gap:6px;justify-content:center}
.title-chars div{width:min(15vw,70px);animation:bob 2.4s ease-in-out infinite}
.title-chars div:nth-child(2){animation-delay:.3s}.title-chars div:nth-child(3){animation-delay:.6s}.title-chars div:nth-child(4){animation-delay:.9s}.title-chars div:nth-child(5){animation-delay:1.2s}
.tap{font-weight:700;font-size:19px;animation:blink 1.3s ease-in-out infinite}
.waves{position:absolute;left:0;right:0;bottom:0;height:100px;background:#3cb4e6;z-index:1}
.waves::before{content:"";position:absolute;left:0;right:0;top:-22px;height:24px;
  background:radial-gradient(circle at 20px 26px,#3cb4e6 20px,transparent 21px) repeat-x;background-size:40px 24px;animation:waves 2.5s linear infinite}
.waves::after{content:"";position:absolute;left:0;right:0;top:22px;height:10px;
  background:radial-gradient(circle at 15px 12px,rgba(255,255,255,.5) 6px,transparent 7px) repeat-x;background-size:60px 12px;animation:waves 4s linear infinite reverse}
.bubbles i{position:absolute;bottom:-20px;width:16px;height:16px;border-radius:50%;border:3px solid rgba(255,255,255,.8);animation:rise 7s linear infinite;z-index:1}
.bubbles i:nth-child(1){left:8%;animation-delay:0s}.bubbles i:nth-child(2){left:22%;animation-delay:2.2s;width:10px;height:10px}
.bubbles i:nth-child(3){left:41%;animation-delay:4.1s}.bubbles i:nth-child(4){left:63%;animation-delay:1.1s;width:22px;height:22px}
.bubbles i:nth-child(5){left:80%;animation-delay:3.3s}.bubbles i:nth-child(6){left:92%;animation-delay:5.2s;width:10px;height:10px}

/* ---------- Barre de navigation (en bas, comme une appli) ---------- */
:root{--navh:62px}
#bnav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding:0 4px env(safe-area-inset-bottom,0px);display:flex;background:var(--card);border-top:3px solid var(--ink);z-index:15;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
#bnav[hidden]{display:none}
#bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:10.5px;cursor:pointer;position:relative;isolation:isolate;padding:4px 0}
#bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#bnav i{font-style:normal;font-size:22px;line-height:1;opacity:.7;filter:grayscale(.4);transition:transform .15s}
#bnav button.on{color:var(--text)}#bnav button.on i{opacity:1;filter:none;transform:scale(1.12)}
#bnav button.on::before{content:"";position:absolute;top:6px;left:50%;width:46px;height:30px;margin-left:-23px;border-radius:12px;background:var(--yellow);border:2px solid var(--ink);z-index:-1}
.nbadge{position:absolute;top:3px;left:calc(50% + 9px);background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:999px;font-size:10px;padding:0 5px;line-height:15px;min-width:19px;text-align:center}
.nbadge[hidden]{display:none}
#select.screen,#collection.screen,#ranks.screen,#trade.screen,#defi.screen{bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px))}
#colBack,#rkBack,#trBack{display:none}
.sel-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px;text-align:left}
.sel-head h2{grid-column:1;grid-row:1;text-align:left;font-size:clamp(20px,6vw,27px)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-head p{grid-column:1/-1;grid-row:2;text-align:left}.sel-head .dchip{grid-column:1/-1;grid-row:3;justify-self:start}
.selbtns{grid-column:2;grid-row:1;position:static;flex-wrap:nowrap;gap:5px;z-index:2}
.selbtns #openCol,.selbtns #openRanks,.selbtns #openTrade{display:none}
.selbtns .colbtn{margin:0;padding:4px 7px;font-size:16px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.dchip{margin-top:7px;display:inline-flex;align-items:center;gap:6px;max-width:100%;font:inherit;font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:999px;border:3px solid var(--ink);background:#ffe9a8;color:#1b2a3a;box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dchip:empty{display:none}
/* ---------- Défis ---------- */
#defi{padding:12px 12px 0;gap:10px}
.dsec{font-family:'Lilita One',sans-serif;font-size:21px;margin:14px 2px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dsec .btn{font-family:inherit;font-size:14px;padding:7px 12px}
.dgame{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.dgame .av{flex:none;width:54px;height:54px;border-radius:14px;border:3px solid var(--ink);overflow:hidden}
.dgame .av svg{width:100%;height:100%;display:block}
.dgame b{display:block;font-size:17px}.dgame small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.drew{background:#fff6d6;color:#1b2a3a;border:2px dashed var(--ink);border-radius:12px;padding:7px 9px;font-size:12.5px;font-weight:700;line-height:1.4;margin-bottom:8px}
.dlist .rkrow{margin-bottom:4px}
.dvs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center;margin:6px 0 2px}
.dvs .p{background:rgba(127,160,190,.14);border:2px solid var(--ink);border-radius:12px;padding:6px 4px;min-width:0}
.dvs .p b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dvs .p span{display:block;font-weight:700;font-size:15px}.dvs .p small{color:var(--muted);font-weight:600;font-size:11.5px}
.dvs .p.win{background:#fff1b8;color:#1b2a3a;border-color:#e0ae12}.dvs .p.win small{color:#4b6378}
.dvs .vs{font-family:'Lilita One',sans-serif;font-size:20px}
.dres{text-align:center;font-weight:700;margin-top:8px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ggrid button{display:flex;flex-direction:column;align-items:center;gap:3px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--text);font:inherit;font-weight:700;font-size:11.5px;padding:6px 4px;cursor:pointer;line-height:1.15}
.ggrid button .av{width:46px;height:46px;border-radius:10px;border:2px solid var(--ink);overflow:hidden}.ggrid button .av svg{width:100%;height:100%;display:block}
.ggrid button.sel{background:var(--yellow);color:#1b2a3a;outline:3px solid var(--ink)}
.dctx{margin-top:10px;background:#fff6d6;color:#1b2a3a;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-weight:700;font-size:14px;line-height:1.35}

/* ---------- Quêtes, profil, séries, tournois ---------- */
.colbtn.me{background:#fff;color:#1b2a3a}
.qrow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:2px dashed rgba(127,160,190,.35)}
.qrow:last-of-type{border-bottom:0}
.qrow .qi{font-size:22px;width:28px;text-align:center}.qrow .qt{flex:1;min-width:0;font-weight:700;font-size:14px}
.qrow .qb{height:7px;background:rgba(127,160,190,.25);border-radius:5px;margin-top:4px;overflow:hidden}.qrow .qb i{display:block;height:100%;background:#2fb36d}
.qrow .qn{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}.qrow.ok .qt{text-decoration:line-through;opacity:.65}
.pfhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pfhead .fav{width:96px;flex:none}.pfhead .fav .tcard{width:100%}
.pfhead .nofav{width:96px;aspect-ratio:63/88;border:3px dashed var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;flex:none;background:rgba(127,160,190,.15)}
.pfhead h3{margin:0 0 4px!important;text-align:left!important}.pfhead small{display:block;color:var(--muted);font-weight:700;line-height:1.4}
.pfstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pfstats div{background:rgba(127,160,190,.14);border:2px solid var(--ink);border-radius:12px;padding:6px 4px;text-align:center}
.pfstats b{display:block;font-size:19px;font-family:'Lilita One',sans-serif;font-weight:400}.pfstats span{font-size:11px;font-weight:700;color:var(--muted);line-height:1.15;display:block}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bdg div{border:2px solid var(--ink);border-radius:12px;padding:7px 4px;text-align:center;background:#fff6d6;color:#1b2a3a}
.bdg div i{font-style:normal;font-size:26px;display:block;line-height:1.1}.bdg div b{display:block;font-size:11.5px;line-height:1.15;margin-top:3px}.bdg div small{display:block;font-size:10px;color:#4b6378;line-height:1.15;margin-top:2px}
.bdg div.off{background:rgba(127,160,190,.12);color:var(--muted);filter:grayscale(1);opacity:.55}.bdg div.off small{color:var(--muted)}
.bdg div.fail{background:#ffe1dc}
[data-pid]{cursor:pointer}[data-pid]:hover{text-decoration:underline}
.sercard{grid-column:1/-1;background:var(--card);color:var(--text);border:3px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--ink)}
.sercard.done{background:#e4fbe9;color:#1b2a3a}
.sercard .sh{display:flex;align-items:center;gap:8px;font-weight:700}.sercard .sh b{flex:1;font-size:16px}.sercard .sh span{font-size:13px}
.sercard .sb{height:8px;background:rgba(127,160,190,.25);border-radius:6px;margin:7px 0 9px;overflow:hidden}.sercard .sb i{display:block;height:100%;background:#2fb36d}
.sercard .sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px 7px}
.sercard .sc .tcard.locked .lq{font-size:22px}.sercard .sc .tcard.locked .lh{font-size:10px}
.sercard .srole{font-size:10.5px;font-weight:700;text-align:center;line-height:1.15;margin-top:9px;color:var(--muted)}.sercard.done .srole{color:#2a7a4a}
.sercard .sr{font-size:12.5px;font-weight:700;margin-top:8px;color:var(--muted)}.sercard.done .sr{color:#2a7a4a}
.tbr{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.tbr .rd{font-weight:700;font-size:12.5px;color:var(--muted);margin-top:4px}
.tbr .m{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-weight:700;font-size:13px}
.tbr .m span{background:rgba(127,160,190,.14);border:2px solid var(--ink);border-radius:10px;padding:4px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbr .m span.w{background:#fff1b8;color:#1b2a3a;border-color:#e0ae12}.tbr .m span.l{opacity:.5;text-decoration:line-through}.tbr .m span.me{outline:3px solid #2fb36d}
.tbr .m em{font-style:normal;font-size:12px;color:var(--muted)}
.tab.at{font-size:13px;padding:8px 10px;flex:none}#admin .tabs{overflow-x:auto;scrollbar-width:none;padding-bottom:4px}#admin .tabs::-webkit-scrollbar{display:none}.tbr .m.bye{grid-template-columns:1fr}
.atour .apill{margin:2px}.atour .arow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:45;width:max-content;max-width:min(92%,380px);background:var(--card);color:var(--text);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:700;max-width:92%;animation:toastin .4s ease}
.toast i{font-style:normal;font-size:28px}.toast small{display:block;font-weight:600;color:var(--muted);font-size:12px}
@keyframes toastin{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

.tcard.mem.bon{--rc:#16b8b0;--rc2:#c9fbf4}
.xwrap.used .tcard{filter:grayscale(.85);opacity:.6}.usedtag{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-12deg);background:#1b2a3a;color:#fff;font-weight:700;font-size:12px;padding:3px 9px;border-radius:8px;border:2px solid #fff;z-index:3;white-space:nowrap}
.tcard.locked.bonl{background:repeating-linear-gradient(45deg,#155e66 0 8px,#124f57 8px 16px)}.tcard.locked.bonl .lq{font-size:30cqw}.tcard.locked.bonl .lh{color:#c9fbf4}
.asktxt{background:#fff6d6;color:#1b2a3a;border:2px dashed var(--ink);border-radius:14px;padding:10px 12px;font-weight:600;line-height:1.5;font-size:14.5px;margin-bottom:10px;user-select:text;-webkit-user-select:text}
.tabs .tab[data-t]{font-size:13px;padding:9px 1px;white-space:nowrap}#booster.on~#bnav{display:none}
.mystflip{perspective:900px;width:min(64vw,250px);margin:0 auto}.mystflip .mf-in{position:relative;transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.mystflip.on .mf-in{transform:rotateY(180deg)}.mystflip .mf-a,.mystflip .mf-b{backface-visibility:hidden;-webkit-backface-visibility:hidden}.mystflip .mf-b{position:absolute;inset:0;transform:rotateY(180deg)}
.mystflip .tcard.big{width:100%!important;animation:none}
/* ---------- Sélection ---------- */
#select{padding:12px 14px 6px;gap:8px}
.sel-head{text-align:center}
.sel-head h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:27px;margin:0}
.sel-head p{margin:2px 0 0;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;overflow-y:auto;padding:6px 4px 18px;min-height:0}
.char{position:relative;background:var(--card);color:var(--text);border:4px solid var(--ink);border-radius:22px;
  box-shadow:0 6px 0 var(--ink);padding:8px 8px 12px;text-align:center;cursor:pointer;transition:transform .1s}
.char:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.duo{display:flex;align-items:flex-end;justify-content:center}.duo .av{width:52%;margin:0 -2%}
.char .avwrap{border-radius:16px;border:3px solid var(--ink);overflow:hidden;padding-top:6px}
.char .nm{font-family:'Lilita One',sans-serif;font-size:24px;margin-top:6px}
.char .gm{font-size:14px;font-weight:600;color:var(--muted)}
.char .badge{position:absolute;top:-10px;right:-8px;font-size:26px;filter:drop-shadow(0 2px 0 var(--ink))}
.char.soon{cursor:default;opacity:.75;display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed;box-shadow:none}
.char.soon .q{font-family:'Lilita One',sans-serif;font-size:64px;line-height:1}

/* ---------- Intro ---------- */
#intro{align-items:center;justify-content:center;padding:20px 18px 26px;gap:12px;cursor:pointer}
.bubble{position:relative;background:#fff;color:#1b2a3a;border:4px solid var(--ink);border-radius:24px;padding:16px 20px;
  font-size:clamp(18px,5vw,23px);font-weight:600;line-height:1.3;box-shadow:0 6px 0 var(--ink);max-width:520px;width:100%;min-height:5.2em}
.bubble::after{content:"";position:absolute;bottom:-22px;left:50%;margin-left:-14px;border:14px solid transparent;border-top:18px solid var(--ink)}
.bubble::before{content:"";position:absolute;bottom:-13px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:12px solid #fff;z-index:1}
.intro-av{width:min(58vw,270px);margin-top:10px}
.intro-av .av{max-height:40vh}
#introAv{animation:pop .5s ease}
.intro-name{font-family:'Lilita One',sans-serif;font-size:34px}
.go{visibility:hidden}
.go.show{visibility:visible;animation:pop .3s ease}

/* ---------- Jeu ---------- */
.hud{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);border-bottom:4px solid var(--ink)}
.hud .x{flex:none;width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:var(--coral);color:#fff;font-weight:700;font-size:20px;cursor:pointer}
.hud .ht{flex:1;min-width:0;font-family:'Lilita One',sans-serif;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .hi{flex:none;font-weight:700;font-size:16px;background:var(--yellow);color:#1b2a3a;border:3px solid var(--ink);border-radius:12px;padding:5px 10px;white-space:nowrap}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#stage canvas{display:block}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,25,40,.6);z-index:5;padding:20px}
.overlay.show{display:flex}
.endcard{background:var(--card);color:var(--text);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:22px;text-align:center;max-width:360px;width:100%;animation:pop .4s ease}
.endcard .emo{font-size:58px;line-height:1}
.endcard h3{font-family:'Lilita One',sans-serif;font-weight:400;font-size:34px;margin:6px 0}
.endcard p{font-size:17px;font-weight:500;line-height:1.4;margin:0 0 18px}
.endbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font-weight:700;font-size:18px;padding:12px 20px;border-radius:16px;border:4px solid var(--ink);background:var(--yellow);color:#1b2a3a;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.alt{background:#fff}

/* ---------- Jeux à cartes ---------- */
.cardgame{height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 16px 18px;gap:12px;color:#1b2a3a;
  background:linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px) 0 0/34px 34px,linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px) 0 0/34px 34px,linear-gradient(#9fe0fb,#4dbbe9)}
.cardgame.bar{background:linear-gradient(90deg,rgba(120,60,20,.12) 50%,transparent 50%) 0 0/60px 100%,linear-gradient(#ffe3a8,#f0a457)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots span{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dots span.ok{background:var(--green)}.dots span.ko{background:var(--coral)}
.cardwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.pcard{position:relative;height:min(100%,430px);aspect-ratio:3/4;max-width:88vw;background:#fff;border:5px solid var(--ink);border-radius:26px;
  box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;transition:transform .18s ease;cursor:grab}
.pcard.enter{animation:enter .35s ease}
.pcard.barcard{background:linear-gradient(#fff8e8,#ffe9bf)}
.avbox{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;padding-top:30px}
.avbox .av{height:100%;width:auto;max-width:94%}
.avbox.reveal .av{animation:reveal .45s ease}
.avbox.drunkwob .av{animation:wob 1.3s ease-in-out infinite;transform-origin:50% 100%}
.nameplate{width:100%;background:var(--yellow);border-top:5px solid var(--ink);font-family:'Lilita One',sans-serif;font-size:30px;text-align:center;padding:8px}
.verdict{position:absolute;top:10px;left:8px;right:8px;text-align:center;font-family:'Lilita One',sans-serif;font-size:24px;opacity:0;
  background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px}
.verdict.show{animation:pop .35s ease forwards}
.verdict.good{background:#c9f5d6}.verdict.bad{background:#ffd1d1}
.counter{position:relative;width:100%;height:20%;min-height:56px;background:linear-gradient(#c07a43,#8a4f25);border-top:5px solid var(--ink)}
.counter::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#d99a62;border-bottom:3px solid var(--ink)}
.glass{position:absolute;left:50%;top:-40px;font-size:50px;transform:translate(-50%,0);opacity:0}
.glass.serve{animation:serve .45s ease forwards}
.hint{font-weight:600;font-size:15px;text-align:center;max-width:420px}
.choices{display:flex;gap:12px;width:100%;max-width:420px}
.choice{flex:1;font-weight:700;font-size:17px;line-height:1.2;padding:12px 8px;border-radius:18px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;color:#1b2a3a}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.choice.left{background:#ffd1d1}.choice.right{background:#c9f5d6}
.choice.water{background:#c6ecff}.choice.beer{background:#ffe08a}
.choice .e{font-size:28px}
.timer{width:100%;max-width:420px;height:18px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.timer .fill{height:100%;width:100%;background:var(--green)}
.memo-title{font-family:'Lilita One',sans-serif;font-size:26px;text-align:center}
.memo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:460px;overflow-y:auto;min-height:0}
.mini{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 2px 4px;text-align:center}
.mini-nm{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-grid + .btn{margin-top:auto}

.findme{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,25,40,.55);padding:20px;z-index:3}
.fm-card{background:#fff;color:#1b2a3a;border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:16px 18px 20px;text-align:center;max-width:320px;width:100%;animation:pop .4s ease}
.fm-card .av{width:150px;margin:0 auto}
.fm-card h3{font-family:'Lilita One',sans-serif;font-weight:400;font-size:28px;margin:6px 0 4px}
.fm-card p{margin:0 0 14px;font-weight:500;line-height:1.35}
.okbtn{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:2;white-space:nowrap}
.okbtn:active{transform:translateX(-50%) translateY(3px)}

/* ---------- Collection de cartes ---------- */
.colbtn{margin-top:8px;font-weight:700;font-size:16px;padding:8px 16px;border-radius:14px;border:3px solid var(--ink);background:var(--yellow);color:#1b2a3a;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.colbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#collection{padding:12px 12px 0;gap:10px}
.col-head{display:flex;align-items:center;gap:10px}
.col-head h2{flex:1;font-family:'Lilita One',sans-serif;font-weight:400;font-size:26px;margin:0}
.col-head .x{flex:none;width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:var(--coral);color:#fff;font-weight:700;font-size:20px;cursor:pointer}
.col-count{font-weight:700;background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:4px 10px;white-space:nowrap}
.tabs{display:flex;gap:8px}
.tab{flex:1;font-weight:700;font-size:15px;padding:9px 6px;border-radius:14px;border:3px solid var(--ink);background:var(--card);color:var(--text);cursor:pointer}
.tab.on{background:var(--yellow);color:#1b2a3a;box-shadow:0 4px 0 var(--ink)}
.rarlegend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.rarlegend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);vertical-align:-2px;margin-right:4px}
.cscroll{flex:1;min-height:0;overflow-y:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;padding:6px 4px 24px;align-items:start}
.recy{grid-column:1/-1;background:#e4fbe9;color:#1b2a3a;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;font-weight:600;line-height:1.3}
.recy .rhead{display:flex;align-items:center;gap:10px;font-size:14px}.recy .ri{font-size:28px;line-height:1}.recy small{display:block;color:#4b6378;font-size:12px}
.recy .rbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.recy .rb{border:3px solid var(--ink);border-radius:12px;padding:6px 4px;font:inherit;cursor:pointer;color:#fff;box-shadow:0 3px 0 var(--ink);line-height:1.15}
.recy .rb b{display:block;font-size:14px}.recy .rb span{font-size:11.5px;font-weight:700}
.recy .rb.r-R{background:#3c8ee6}.recy .rb.r-E{background:#8a4fe0}.recy .rb.r-L{background:#e0ae12}
.recy .rb:disabled{opacity:.38;cursor:default;box-shadow:none}.recy .rb:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.rconf{background:var(--card);color:var(--text);border:4px solid var(--ink);border-radius:24px;padding:18px;max-width:360px;text-align:center}
.rconf h3{font-family:'Lilita One',sans-serif;font-weight:400;font-size:24px;margin:0 0 6px}.rconf p{margin:6px 0;line-height:1.35}
.ruse{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0 4px}.ruse .tcard{width:52px}
.cmsg{grid-column:1/-1;text-align:center;background:var(--card);border:3px dashed var(--ink);border-radius:18px;padding:14px;font-weight:600;line-height:1.4}
/* La carte */
.tcard{--rc:#9aa7b4;--rc2:#e6ebf0;position:relative;aspect-ratio:63/88;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(160deg,var(--rc2),var(--rc));
  box-shadow:0 4px 0 var(--ink);padding:6px;display:flex;flex-direction:column;gap:4px;color:#1b2a3a;cursor:pointer;overflow:hidden;font-size:10px;container-type:inline-size;text-align:left}
.tcard.r-R{--rc:#3c8ee6;--rc2:#bfe0ff}
.tcard.r-E{--rc:#8a4fe0;--rc2:#e3d2ff}
.tcard.r-L{--rc:#e0a400;--rc2:#fff1b0}
.tc-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:7.5cqw}
.tc-num{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 5px}
.tc-rar{color:#1b2a3a;letter-spacing:-1px;font-size:8cqw}
.tc-art{position:relative;flex:1;min-height:0;border-radius:8px;border:2px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.tc-art .av{width:auto;height:92%;max-width:96%}
.tc-art .duo .av{width:50%;height:auto}
.tc-emo{position:absolute;top:4%;right:5%;font-size:17cqw;filter:drop-shadow(0 2px 0 rgba(27,42,58,.4))}
.tc-name{font-family:'Lilita One',sans-serif;font-size:10.5cqw;line-height:1.05;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px 5px}
.tc-who{font-weight:700;font-size:7.5cqw;opacity:.85;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-txt{display:none;font-size:6.6cqw;font-weight:500;line-height:1.3;background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:8px;padding:4px 6px}
.tc-foot{display:none;justify-content:space-between;font-size:5.6cqw;font-weight:700;opacity:.75;padding:0 2px}
.tcard.big{width:min(78vw,330px);font-size:14px;cursor:default;box-shadow:0 8px 0 var(--ink);transition:transform .08s;transform-style:preserve-3d}
.tcard.big .tc-txt,.tcard.big .tc-foot{display:block}.tcard.big .tc-foot{display:flex}
.tcard.big .tc-art{flex:none;height:46%}
.tcard.r-L::after,.tcard.r-E::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.55;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.9) 35%,rgba(255,120,220,.6) 42%,rgba(120,220,255,.6) 50%,rgba(255,255,140,.6) 58%,transparent 70%);background-size:250% 250%;
  background-position:var(--hx,0%) var(--hy,0%);animation:holo 4s ease-in-out infinite}
.tcard.r-E::after{opacity:.3}
.tcard.big::after{animation:none}
@keyframes holo{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.tcard.mg{background:linear-gradient(160deg,color-mix(in srgb,var(--bc) 35%,#fff),var(--bc))}

.tcard.mem{background:linear-gradient(160deg,var(--rc2),var(--rc))}
.tcard.mem .tc-art{background:#d9d2c6}
.tcard.mem .tc-art img{width:100%;height:100%;object-fit:cover;display:block}
/* Toutes les cartes membres en grand ont la même taille ; l'image est recadrée au format 4:5 */
.tcard.big.mem{aspect-ratio:0.53;height:auto;width:min(78vw,330px,calc((100vh - 230px)*0.53))}
.tcard.big.mem:not(.full) .tc-art{flex:none;height:auto;aspect-ratio:4/5}
.tcard.big.mem:not(.full) .tc-txt{flex:1;min-height:0;overflow:hidden}
.tcard.big.mem .tc-who{display:none}
.tcard.big.mem .tc-txt{font-size:5cqw;line-height:1.3}
.tcard.big.mem .tc-name{font-size:10cqw}
.tcard.big.mem .tc-txt.long{font-size:4.5cqw;line-height:1.28}
.tcard.big.mem .tc-txt.xlong{font-size:4.1cqw;line-height:1.24}
.tcard.big.mem .tc-txt.xxlong{font-size:3.7cqw;line-height:1.22}
.tcard.mem .tc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard.big.mem .tc-name{white-space:normal}
.tcard.mem:not(.big):not(.full) .tc-name.lng{white-space:normal;font-size:8.6cqw;line-height:1.05}
.tcard.full{padding:0;justify-content:space-between}
/* Images montrées en entier (avec un fond flou pour remplir) */
.tcard .fitbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(10px) brightness(.85) saturate(1.1);transform:scale(1.2)}
.tcard.mem .tc-art img.fitimg{position:relative;object-fit:contain}
.tcard.full.fit .fullimg{object-fit:contain}

.tcard.full .fullimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tcard.full .tc-top{position:relative;z-index:1;padding:6px}
.tcard.full .tc-rar{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 5px}
.tcard.full .tc-name{position:relative;z-index:1;margin:6px;text-align:center;white-space:normal}
.tcard.mem .tc-name{font-size:12cqw}
.tcard.locked.r-E .lh,.tcard.locked.r-L .lh,.tcard.locked.r-R .lh{color:#ffd86b}
.tcard.locked{background:repeating-linear-gradient(45deg,#2b3a55 0 8px,#24324a 8px 16px);color:#fff;align-items:center;justify-content:center;text-align:center}
.tcard.locked::after{display:none}
.tcard.locked .lq{font-family:'Lilita One',sans-serif;font-size:34cqw;line-height:1;opacity:.85}
.tcard.locked .lh{font-size:7cqw;font-weight:700;opacity:.8;padding:0 4px}
.tcard .newtag{position:absolute;top:-2px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;font-weight:700;font-size:7cqw;border:2px solid var(--ink);border-radius:0 0 8px 8px;padding:0 6px;z-index:2}
.cmodal{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(10,25,40,.72);padding:20px}
.cmodal.show{display:flex;animation:fadeIn .25s ease}
.cmodal .tcard.big{animation:cardin .5s ease}
.cmodal .hint{background:var(--card);color:var(--text);border:3px solid var(--ink);border-radius:16px;padding:12px 16px;font-weight:600;text-align:center;max-width:330px;line-height:1.4}
@keyframes cardin{0%{transform:rotateY(180deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.newcard{margin:-6px 0 14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.newcard .tcard{width:120px;animation:cardin .6s ease}
.cloudnote{font-size:12px;font-weight:600;color:var(--muted);text-align:center}

/* ---------- Boosters ---------- */
.boostbtn{width:100%;font-weight:700;font-size:16px;padding:10px;border-radius:14px;border:3px solid var(--ink);background:linear-gradient(90deg,#4a2a7a,#1b9fb2);color:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.boostbtn:disabled{opacity:.5;cursor:default}
.boostbtn:not(:disabled){animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
#booster{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#booster.on{display:flex;animation:bgin .5s ease both}
@keyframes bgin{from{background:rgba(12,8,32,0);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}to{background:rgba(12,8,32,.5);backdrop-filter:blur(9px) saturate(1.1);-webkit-backdrop-filter:blur(9px) saturate(1.1)}}
#booster .bx{position:absolute;top:12px;right:12px;z-index:30;width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:var(--coral);color:#fff;font-weight:700;font-size:20px;cursor:pointer}
.bstars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff7,transparent),radial-gradient(2px 2px at 85% 65%,#fff5,transparent),radial-gradient(1.5px 1.5px at 10% 70%,#fff6,transparent);animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.4}}
.bhint{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:16px;right:16px;text-align:center;color:#fff;font-weight:700;font-size:16px;text-shadow:0 2px 0 #000a;z-index:5}
.bcount{position:absolute;top:16px;left:16px;color:#fff;font-weight:700;background:#0006;border:2px solid #fff5;border-radius:12px;padding:6px 10px;z-index:5}
.pack{position:relative;width:min(66vw,290px,35vh);aspect-ratio:0.56;container-type:size;z-index:3;animation:packin .7s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 18px 30px #000a)}
@keyframes packin{from{transform:translateY(60vh) rotate(-12deg) scale(.6)}to{transform:none}}
.pack.idle{animation:packfloat 3s ease-in-out infinite}
@keyframes packfloat{50%{transform:translateY(-8px) rotate(1deg)}}
.pack.shake{animation:packshake .35s linear}
@keyframes packshake{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.pk-body,.pk-top{position:absolute;left:0;right:0;background-image:var(--wrap);background-size:auto 100cqh;background-repeat:no-repeat}
.pk-top{top:0;height:14%;background-position:50% 0;z-index:2;
  clip-path:polygon(0 18%,4% 0,8% 18%,12% 0,16% 18%,20% 0,24% 18%,28% 0,32% 18%,36% 0,40% 18%,44% 0,48% 18%,52% 0,56% 18%,60% 0,64% 18%,68% 0,72% 18%,76% 0,80% 18%,84% 0,88% 18%,92% 0,96% 18%,100% 0,100% 100%,0 100%)}
.pk-top::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff40,#0000 40%,#0003)}
.pk-body{top:14%;bottom:0;background-position:50% -14cqh;
  clip-path:polygon(0 0,100% 0,100% 97%,96% 100%,92% 97%,88% 100%,84% 97%,80% 100%,76% 97%,72% 100%,68% 97%,64% 100%,60% 97%,56% 100%,52% 97%,48% 100%,44% 97%,40% 100%,36% 97%,32% 100%,28% 97%,24% 100%,20% 97%,16% 100%,12% 97%,8% 100%,4% 97%,0 100%)}
.pk-shine{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background:linear-gradient(110deg,transparent 30%,#ffffff55 42%,#c4f2ff44 48%,transparent 60%);background-size:300% 100%;animation:shine 3.2s ease-in-out infinite;
  clip-path:inset(0 0 0 0 round 6px)}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-60% 0}}
.pk-line{position:absolute;left:3%;right:3%;top:14%;height:0;border-top:3px dashed #fffc;z-index:3;filter:drop-shadow(0 1px 0 #0008)}
.pk-cut{position:absolute;left:0;top:calc(14% - 3px);height:6px;width:0;z-index:5;background:linear-gradient(90deg,#fff,#ffe36b);border-radius:3px;box-shadow:0 0 12px #ffe36b,0 0 4px #fff}
.pk-scissors{position:absolute;top:calc(14% - 22px);left:-6px;font-size:30px;z-index:6;transform:scaleX(-1);transition:opacity .2s;filter:drop-shadow(0 2px 2px #000a)}
.pk-label{position:absolute;left:50%;top:5%;transform:translateX(-50%);z-index:3;font-weight:700;font-size:11px;color:#fff;letter-spacing:.5px;text-shadow:0 1px 2px #000;white-space:nowrap;pointer-events:none}
.pk-top.off{transition:transform .7s cubic-bezier(.3,.7,.4,1),opacity .7s;transform:translate(70%,-130%) rotate(28deg);opacity:0}
.pack.opened .pk-label,.pack.opened .pk-line,.pack.opened .pk-scissors{display:none}
.pack.out{transition:transform .7s cubic-bezier(.6,0,.8,.4),opacity .6s .2s;transform:translateY(80vh);opacity:0}
.cstack{position:relative;z-index:2;width:min(78vw,330px,calc((100vh - 230px)*0.53));display:grid;align-items:center;justify-items:center}
.fcard{position:relative;grid-area:1/1;width:100%;perspective:1100px;transition:transform .6s cubic-bezier(.2,1.3,.4,1),opacity .4s}
.fcard .fin{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.fcard.flip .fin{transform:rotateY(180deg)}
.fface,.fback{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fback{position:absolute;inset:0}
.fface{position:relative;transform:rotateY(180deg)}
.fface .tcard{width:100%;cursor:default}
.fface .tcard.big{animation:none}
.fback{border-radius:14px;border:3px solid var(--ink);overflow:hidden;background:radial-gradient(circle at 50% 45%,#3a2a6e,#140e30);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px #000a}
.fback img{width:62%;filter:drop-shadow(0 2px 6px #0008)}
.fback::after{content:"";position:absolute;inset:8px;border:2px solid #ffffff40;border-radius:9px}
.fcard.wait{visibility:hidden}
.fcard.away{transform:translate(-140vw,-10vh) rotate(-25deg);opacity:0}
.fcard.rise{animation:cardrise .8s cubic-bezier(.2,1.2,.4,1) both}
@keyframes cardrise{from{transform:translateY(55%) scale(.8);opacity:0}to{transform:none;opacity:1}}
.fglow{position:absolute;inset:-30%;z-index:-1;border-radius:50%;opacity:0;pointer-events:none;transition:opacity .4s}
.fcard.flip.gE .fglow{opacity:1;background:radial-gradient(circle,#b77cff 0,#8a4fe055 40%,transparent 68%);animation:glow 1.6s ease-in-out infinite}
.fcard.flip.gL .fglow{opacity:1;background:conic-gradient(from 0deg,#ffd24a00,#ffd24acc,#ffd24a00 25%,#fff3a0cc 50%,#ffd24a00 75%,#ffd24acc);animation:spin 3s linear infinite;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes glow{50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}

<!-- ===== Raccourci sur l'écran d'accueil (site GitHub uniquement) ===== -->
<script>
(function(){
  if(!/github\.io$/.test(location.hostname))return;
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  const LS={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};
  const ua=navigator.userAgent||'';
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document);
  const inApp=/FBAN|FBAV|Instagram|Line\/|WhatsApp|Snapchat|TikTok|; wv\)/i.test(ua);
  let deferred=null;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});
  addEventListener('appinstalled',()=>LS.set('gg-install','done'));
  if(standalone)LS.set('gg-install','done');
  function card(html){const d=document.createElement('div');d.className='ggpop';d.innerHTML=`<div class="ggcard">${html}</div>`;document.getElementById('app').appendChild(d);return d;}
  function steps(){
    if(inApp)return `<p>Tu as ouvert le jeu depuis une appli (WhatsApp, Instagram…).<br>Touche <b>⋮</b> ou <b>…</b> puis <b>« Ouvrir dans le navigateur »</b> (Safari ou Chrome), et reviens ici.</p>`;
    if(ios)return `<p style="text-align:left">1. Touche le bouton <b>Partager</b> <span style="display:inline-block;border:2px solid currentColor;border-radius:5px;padding:0 5px">⬆</span> en bas de Safari<br>2. Choisis <b>« Sur l'écran d'accueil »</b><br>3. Touche <b>Ajouter</b></p>`;
    return `<p style="text-align:left">1. Touche le menu <b>⋮</b> en haut à droite de Chrome<br>2. Choisis <b>« Ajouter à l'écran d'accueil »</b> ou <b>« Installer l'application »</b><br>3. Confirme</p>`;}
  window.GGinstall=function(force){
    if(standalone){if(force)alert('Le Gambetta Game est déjà sur ton écran d\'accueil 👍');return;}
    const d=card(`<div style="width:84px;margin:0 auto 6px"><img src="icon-192.png" alt="" style="width:100%;border-radius:20px;border:3px solid #1b2a3a"></div>
      <h3>Ajouter le jeu<br>à ton écran d'accueil ?</h3><p>Tu le retrouveras comme une appli, sans chercher le lien.</p><div id="giHelp"></div>
      <button class="btn" id="giYes">📲 Oui, l'ajouter</button><button class="btn alt" id="giNo">Plus tard</button>`);
    d.querySelector('#giNo').onclick=()=>{LS.set('gg-install','later:'+Date.now());d.remove();};
    d.querySelector('#giYes').onclick=async()=>{
      if(deferred){deferred.prompt();const r=await deferred.userChoice.catch(()=>({}));deferred=null;
        if(r&&r.outcome==='accepted'){LS.set('gg-install','done');d.remove();return;}}
      const b=d.querySelector('#giYes');b.remove();d.querySelector('#giNo').textContent='C\'est fait / Fermer';
      d.querySelector('#giHelp').innerHTML='<h3 style="font-size:20px;margin-top:10px">Comment faire :</h3>'+steps();
      d.querySelector('#giNo').onclick=()=>{LS.set('gg-install','done');d.remove();};};
  };
  // Proposé tout seul à la première visite (puis une fois par semaine si « Plus tard »), quand aucune autre fenêtre n'est ouverte
  const st=LS.get('gg-install');if(standalone||st==='done')return;
  if(st&&st.startsWith('later:')&&Date.now()-(+st.slice(6))<7*864e5)return;
  let tries=0;const t=setInterval(()=>{tries++;if(tries>120){clearInterval(t);return;}
    const sel=document.getElementById('select');if(!sel||!sel.classList.contains('active'))return;
    if(document.querySelector('.ggpop,.giftpop,.trsheet'))return;clearInterval(t);setTimeout(()=>{if(!document.querySelector('.ggpop,.giftpop'))GGinstall(false);},1200);},1000);
})();
</script>

  try{if(fs.enablePersistence)fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(_){}
  const LS={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};
  const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const rnd=n=>Array.from(crypto.getRandomValues(new Uint32Array(n)),x=>AL[x%AL.length]).join('');
  const normCode=c=>{c=(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.startsWith('GMB'))c=c.slice(3);return c?'GMB-'+c:'';};
  const GG=window.GG={code:null,pid:null,name:null,admin:false};
  const NAMES={};
  const domReady=()=>new Promise(r=>document.readyState!=='loading'?r():document.addEventListener('DOMContentLoaded',r));
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function pop(html){const d=document.createElement('div');d.className='ggpop';d.innerHTML=`<div class="ggcard">${html}</div>`;(document.getElementById('app')||document.body).appendChild(d);return d;}

  const waitAuth=new Promise(res=>{const un=auth.onAuthStateChanged(u=>{if(u){un();res(u);}else auth.signInAnonymously().catch(()=>{un();res(null);});});});

  async function loadPlayer(code){const s=await fs.doc('players/'+code).get();return s.exists?s.data():null;}

  // Première visite : choisir un pseudo, ou reprendre une partie avec un code
  async function askPlayer(){await domReady();
    return new Promise(resolve=>{
      const d=pop(`<div class="emo">🏊</div><h3>Bienvenue !</h3><p>Choisis ton pseudo pour les classements.</p>
        <input class="ainput" id="ggName" maxlength="20" placeholder="Ton prénom ou pseudo" autocomplete="off">
        <div class="ggerr" id="ggErr"></div>
        <button class="btn" id="ggGo">C'est parti !</button>
        <button class="gglink" id="ggHave">J'ai déjà un code de sauvegarde</button>`);
      const err=m=>{d.querySelector('#ggErr').textContent=m;};
      d.querySelector('#ggGo').onclick=async()=>{const name=d.querySelector('#ggName').value.trim().slice(0,20);if(!name)return err('Écris ton pseudo 🙂');
        const b=d.querySelector('#ggGo');b.disabled=true;b.textContent='…';
        try{const code='GMB-'+rnd(6),data={pid:rnd(14),code,name,col:null,created:Date.now(),at:Date.now()};
          await fs.doc('players/'+code).set(data);d.remove();showCode(code,name,true);resolve({code,data});}
        catch(e){b.disabled=false;b.textContent="C'est parti !";err('Pas de connexion… réessaie.');}};
      d.querySelector('#ggHave').onclick=()=>{d.remove();askCode(resolve,true);};
    });}
  function askCode(resolve,first){
    const d=pop(`<div class="emo">🔑</div><h3>Mon code</h3><p>Tape le code de sauvegarde que le jeu t'a donné.</p>
      <input class="ainput" id="ggCode" maxlength="12" placeholder="GMB-XXXXXX" autocomplete="off" autocapitalize="characters">
      <div class="ggerr" id="ggErr"></div>
      <button class="btn" id="ggOk">Récupérer ma partie</button>
      <button class="gglink" id="ggBack">${first?'Je n\'ai pas de code':'Annuler'}</button>`);
    const err=m=>{d.querySelector('#ggErr').textContent=m;};
    d.querySelector('#ggOk').onclick=async()=>{const code=normCode(d.querySelector('#ggCode').value);if(code.length<10)return err('Le code ressemble à GMB-XXXXXX');
      try{const data=await loadPlayer(code);if(!data)return err('Code inconnu 🤔 Vérifie les lettres.');
        d.remove();if(first)resolve({code,data});else{LS.set('gg-code',code);location.reload();}}
      catch(e){err('Pas de connexion… réessaie.');}};
    d.querySelector('#ggBack').onclick=()=>{d.remove();if(first)askPlayer().then(resolve);};
  }
  function showCode(code,name,isNew){
    const d=pop(`<div class="emo">${isNew?'🎉':'🔑'}</div><h3>${isNew?'Garde ce code !':'Ma sauvegarde'}</h3>
      <p>${isNew?'C\'est ton code de sauvegarde. Il te permet de retrouver ta partie sur un autre téléphone.':`Joueur : <b>${esc(name)}</b><br>Ton code de sauvegarde :`}</p>
      <div class="ggcode">${code}</div>
      <button class="btn" id="ggCopy">📋 Copier le code</button>
      ${isNew?'':`<button class="btn alt" id="ggOther">Utiliser un autre code</button>`}
      <button class="btn alt" id="ggClose">${isNew?'C\'est noté !':'Fermer'}</button>
      ${isNew||!window.GGinstall?'':`<button class="btn alt" id="ggInst">📲 Ajouter à l'écran d'accueil</button>`}
      ${isNew?'':`<button class="gglink" id="ggAdmin">${GG.admin?'Admin connecté ✅ · Se déconnecter':'Connexion admin'}</button>`}`);
    d.querySelector('#ggCopy').onclick=e=>{try{navigator.clipboard.writeText(code);e.target.textContent='Copié ✅';}catch(_){}};
    d.querySelector('#ggClose').onclick=()=>d.remove();
    const gi=d.querySelector('#ggInst');if(gi)gi.onclick=()=>{d.remove();GGinstall(true);};
    const o=d.querySelector('#ggOther');if(o)o.onclick=()=>{d.remove();askCode(null,false);};
    const a=d.querySelector('#ggAdmin');if(a)a.onclick=async()=>{
      if(GG.admin){await auth.signOut();location.reload();return;}
      const p=new firebase.auth.GoogleAuthProvider();
      try{await auth.signInWithPopup(p);location.reload();}
      catch(e){if(e&&e.code==='auth/popup-blocked')auth.signInWithRedirect(p);else a.textContent='Connexion impossible : '+(e&&e.code||'erreur');}};
  }

  const READY=(async()=>{try{
    const u=await waitAuth;if(!u)return false;
    GG.admin=!!(u.email&&u.email.toLowerCase()===ADMIN_EMAIL&&u.emailVerified);
    // Remise à zéro décidée par l'admin : on nettoie aussi la copie gardée sur ce téléphone
    try{const ss=await fs.doc('gifts/season').get();const se=ss.exists?ss.data():null;const mine=LS.get('gg-season');
      if(se&&String(se.n)!==mine){LS.set('gg-season',String(se.n));
        if(LS.get('gambetta-col')){
          if(se.mode==='all'){['gambetta-col','gambetta-wins','gg-code'].forEach(k=>{try{localStorage.removeItem(k);}catch(_){}});}
          else{try{const c=JSON.parse(LS.get('gambetta-col'));c.best={};c.wins_n={};LS.set('gambetta-col',JSON.stringify(c));}catch(_){}}
          location.reload();return false;}}}catch(_){}
    let code=LS.get('gg-code'),data=null;
    if(code){try{data=await loadPlayer(code);}catch(_){return false;}}
    if(!data){const r=await askPlayer();code=r.code;data=r.data;}
    LS.set('gg-code',code);GG.code=code;GG.pid=data.pid;GG.name=data.name;NAMES[data.pid]=data.name;
    await fs.doc('owners/'+data.pid).set({uid:auth.currentUser.uid,code});
    return true;}catch(e){console.warn('Firebase',e);return false;}})();

  // Même interface que la sauvegarde Claude, pour que le jeu n'ait rien à changer
  const wrapSnap=s=>({exists:s.exists,data:()=>s.data()});
  const DB={
    doc(path){
      if(/^data\/users\/[^/]+\/collection$/.test(path))return{
        get:async()=>{const s=await fs.doc('players/'+GG.code).get();const d=s.exists?s.data():{};return{exists:!!d.col,data:()=>d.col};},
        set:o=>fs.doc('players/'+GG.code).set({pid:GG.pid,code:GG.code,name:GG.name,col:o,at:Date.now()})};
      const r=fs.doc(path);
      return{get:async()=>wrapSnap(await r.get()),set:o=>r.set(path.startsWith('board/')?Object.assign({},o,{name:GG.name}):o)};},
    collection(name){return{onSnapshot(cb,err){return fs.collection(name).onSnapshot(q=>{const docs=q.docs.map(d=>{const v=d.data();if(name==='board'&&v&&v.name)NAMES[d.id]=v.name;return{id:d.id,data:()=>v};});cb({docs});},err||(()=>{}));}};}
  };
  const USER={id:async()=>GG.pid,isOwner:async()=>GG.admin,profiles:async ids=>{const o={};ids.forEach(i=>o[i]={name:NAMES[i]||''});return o;}};
  window.claude={use:async n=>{const ok=await READY;if(!ok)return null;return n==='db'?DB:n==='user'?USER:null;}};

  // Échanges de cartes entre joueurs
  GG.trades={
    listen(cb){let inc=[],out=[];const fire=()=>cb(inc,out);const map=q=>q.docs.map(d=>Object.assign({id:d.id},d.data()));
      fs.collection('trades').where('to','==',GG.pid).onSnapshot(q=>{inc=map(q);fire();},()=>{});
      fs.collection('trades').where('from','==',GG.pid).onSnapshot(q=>{out=map(q);fire();},()=>{});},
    create(o){return fs.collection('trades').add(Object.assign({from:GG.pid,fromName:GG.name,st:'wait',done:false,at:Date.now()},o));},
    set(id,patch){return fs.doc('trades/'+id).update(patch);}
  };
  GG.duels={
    listen(cb){let inc=[],out=[];const fire=()=>cb(inc.concat(out));const map=q=>q.docs.map(d=>Object.assign({id:d.id},d.data()));
      fs.collection('duels').where('to','==',GG.pid).onSnapshot(q=>{inc=map(q);fire();},()=>{});
      fs.collection('duels').where('from','==',GG.pid).onSnapshot(q=>{out=map(q);fire();},()=>{});},
    create(o){return fs.collection('duels').add(Object.assign({from:GG.pid,fromName:GG.name,st:'wait',a:{n:0,v:null},b:{n:0,v:null},at:Date.now()},o));},
    set(id,patch){return fs.doc('duels/'+id).update(patch);}
  };
  GG.actions={
    listen(cb){let inc=[],out=[];const fire=()=>cb(inc,out);const map=q=>q.docs.map(d=>Object.assign({id:d.id},d.data()));
      fs.collection('actions').where('to','==',GG.pid).onSnapshot(q=>{inc=map(q);fire();},()=>{});
      fs.collection('actions').where('from','==',GG.pid).onSnapshot(q=>{out=map(q);fire();},()=>{});},
    create(o){return fs.collection('actions').add(o);},
    set(id,patch){return fs.doc('actions/'+id).update(patch);},
    request(o){return fs.collection('requests').add(o);},
    listenReq(cb){fs.collection('requests').onSnapshot(q=>cb(q.docs.map(d=>Object.assign({id:d.id},d.data()))),()=>{});},
    setReq(id,patch){return fs.doc('requests/'+id).update(patch);}
  };
  GG.bounty={
    listen(cb){fs.collection('bounties').onSnapshot(q=>cb(q.docs.map(d=>Object.assign({id:d.id},d.data()))),()=>{});},
    create(o){return fs.collection('bounties').add(o);},
    claim(id){return fs.doc('bounties/'+id).update({st:'won',winner:GG.pid,winnerName:GG.name||'Joueur'});}
  };
  // Bataille du Bassin en direct : l'invitation, puis chaque joueur écrit ses cartes posées dans battles/{id}/p/{a|b}
  GG.battles={
    listen(cb){let inc=[],out=[];const fire=()=>cb(inc.concat(out));const map=q=>q.docs.map(d=>Object.assign({id:d.id},d.data()));
      fs.collection('battles').where('to','==',GG.pid).onSnapshot(q=>{inc=map(q);fire();},()=>{});
      fs.collection('battles').where('from','==',GG.pid).onSnapshot(q=>{out=map(q);fire();},()=>{});},
    create(o){return fs.collection('battles').add(Object.assign({from:GG.pid,fromName:GG.name,st:'wait',at:Date.now()},o));},
    set(id,patch){return fs.doc('battles/'+id).update(patch);},
    /* Le direct passe par la Realtime Database (pas de limite de lectures/écritures).
       Si elle ne répond pas (pas configurée, refus, réseau), on bascule tout seul sur Firestore pour cette partie.
       Chaque téléphone écoute les deux : la partie ne peut pas se bloquer. */
    push(id,side,o){const r=RT();const fsw=()=>fs.doc('battles/'+id+'/p/'+side).set(o);
      if(!r||rtFail[id])return fsw();
      const w=r.ref('battles/'+id+'/'+side).set(Object.assign({uid:auth.currentUser.uid},o));
      return Promise.race([w,new Promise((_,no)=>setTimeout(()=>no(new Error('rt-timeout')),6000))]).catch(e=>{console.warn('Direct : bascule sur Firestore',e&&e.message);rtFail[id]=1;return fsw();});},
    watchP(id,side,cb){let last=-1;const give=d=>{if(!d)return;const t=d.t||0;if(t<last)return;last=t;cb(d);};
      const u1=fs.doc('battles/'+id+'/p/'+side).onSnapshot(s=>give(s.exists?s.data():null),()=>{});
      const r=RT();let u2=null;if(r){rtOn(1);const ref=r.ref('battles/'+id+'/'+side),f=s=>give(s.val());ref.on('value',f,()=>{});u2=()=>{ref.off('value',f);rtOn(-1);};}
      return()=>{try{u1();}catch(_){}try{u2&&u2();}catch(_){}};},
    // fin de partie : on efface sa propre trace dans la Realtime Database une minute plus tard
    done(id,side){const r=RT();if(!r)return;rtOn(1);setTimeout(()=>{r.ref('battles/'+id+'/'+side).remove().catch(()=>{}).then(()=>rtOn(-1));},60000);}
  };
  let rtDb=null,rtN=0,rtOffT=0;const rtFail={};
  function RT(){if(rtDb!==null)return rtDb;try{rtDb=RTDB_URL&&firebase.database?firebase.database():false;}catch(e){rtDb=false;}return rtDb;}
  // on ne reste connecté à la Realtime Database que pendant les parties en direct
  function rtOn(d){const r=RT();if(!r)return;rtN=Math.max(0,rtN+d);clearTimeout(rtOffT);if(rtN>0){try{r.goOnline();}catch(_){}}else rtOffT=setTimeout(()=>{if(!rtN)try{r.goOffline();}catch(_){}},15000);}
  // Gambetta Party : tout passe par la Realtime Database (party/{code})
  let rtOff=0;
  GG.party={
    ok:()=>!!(RT()&&GG.pid),
    now:()=>Date.now()+rtOff,
    ref:p=>RT().ref('party/'+p),
    async create(o){const r=RT();if(!r)throw new Error('rt');rtOn(1);try{r.ref('.info/serverTimeOffset').once('value').then(s=>{rtOff=s.val()||0;}).catch(()=>{});}catch(_){}
      for(let i=0;i<12;i++){const code=String(1000+Math.floor(Math.random()*9000));const ex=(await r.ref('party/'+code).once('value')).val();
        if(!ex||(ex.at||0)<Date.now()-864e5){await r.ref('party/'+code).set(Object.assign({at:Date.now()},o));rtOn(-1);return code;}}rtOn(-1);throw new Error('full');},
    async get(code){const r=RT();if(!r)return null;rtOn(1);try{return (await r.ref('party/'+code).once('value')).val();}finally{rtOn(-1);}},
    watch(code,cb){const r=RT();if(!r)return()=>{};rtOn(1);try{r.ref('.info/serverTimeOffset').once('value').then(s=>{rtOff=s.val()||0;}).catch(()=>{});}catch(_){}
      const ref=r.ref('party/'+code),f=s=>cb(s.val());ref.on('value',f,()=>{});return()=>{ref.off('value',f);rtOn(-1);};},
    update(code,o){return RT().ref('party/'+code).update(o);},
    set(code,path,v){return RT().ref('party/'+code+'/'+path).set(v);},
    remove(code,path){return RT().ref('party/'+code+(path?'/'+path:'')).remove();},
    lobbies(cb){const r=RT();if(!r)return()=>{};rtOn(1);const q=r.ref('party').orderByChild('st').equalTo('lobby'),f=s=>cb(s.val()||{});q.on('value',f,()=>{});return()=>{q.off('value',f);rtOn(-1);};},
    presence(code,pid){const r=RT();if(!r)return()=>{};const ref=r.ref('party/'+code+'/players/'+pid+'/on');ref.set(true).catch(()=>{});try{ref.onDisconnect().set(false);}catch(_){}
      return()=>{try{ref.onDisconnect().cancel();}catch(_){}};}
  };
  GG.events={
    listen(cb){fs.collection('events').onSnapshot(q=>cb(q.docs.map(d=>Object.assign({id:d.id},d.data()))),()=>{});},
    create(o){return fs.collection('events').add(Object.assign({at:Date.now()},o));},
    set(id,patch){return fs.doc('events/'+id).update(patch);},
    mark(id,field,val){return fs.doc('events/'+id).update({[field+'.'+GG.pid]:val});}
  };
  GG.tourn={
    listen(cb){fs.collection('tournaments').onSnapshot(q=>cb(q.docs.map(d=>Object.assign({id:d.id},d.data()))),()=>{});},
    create(o){return fs.collection('tournaments').add(Object.assign({at:Date.now()},o));},
    set(id,patch){return fs.doc('tournaments/'+id).update(patch);},
    join(id,on){return fs.doc('tournaments/'+id).update({['players.'+GG.pid]:on?GG.name:firebase.firestore.FieldValue.delete()});},
    addDuel(o){return fs.collection('duels').add(o);},
    duels(tid,cb){fs.collection('duels').where('t','==',tid).onSnapshot(q=>cb(q.docs.map(d=>Object.assign({id:d.id},d.data()))),()=>{});},
    setDuel(id,patch){return fs.doc('duels/'+id).update(patch);}
  };
  // Outils admin : codes de tout le monde et sauvegarde complète
  GG.codes=async()=>{if(!GG.admin)return{};const q=await fs.collection('owners').get();const o={};q.docs.forEach(d=>o[d.id]=d.data().code);return o;};
  GG.backup=async()=>{if(!GG.admin)return;const out={date:new Date().toISOString()};
    for(const c of ['players','board','gifts','owners','trades','duels','tournaments','events','actions','requests','bounties','battles']){const q=await fs.collection(c).get();out[c]={};q.docs.forEach(d=>out[c][d.id]=d.data());}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
    a.download='gambetta-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();};

  // Nettoyage (admin) : efface seulement ce qui est terminé et ne peut plus rien rapporter à personne
  GG.cleanup=async()=>{if(!GG.admin)return null;const now=Date.now(),D=864e5,n={};
    const del=async(col,keep)=>{const q=await fs.collection(col).get();let b=fs.batch(),k=0;for(const d of q.docs){if(keep(d.data()||{}))continue;b.delete(d.ref);if(++k%400===0){await b.commit();b=fs.batch();}}await b.commit();n[col]=k;};
    const old=(x,days)=>(x.at||0)<now-days*D;
    // invitations de bataille en direct : valables 2 minutes
    await del('battles',x=>!old(x,1));
    // primes : valables 4 heures
    await del('bounties',x=>!old(x,2));
    // échanges refusés, annulés, ou acceptés ET récupérés des deux côtés
    await del('trades',x=>!(old(x,7)&&(x.st==='no'||x.st==='cancel'||(x.st==='yes'&&x.done))));
    // cartes bonus déjà appliquées (et, pour le voleur, carte déjà récupérée)
    await del('actions',x=>!(old(x,7)&&x.st!=='wait'&&(x.type!=='voleur'||x.got)));
    // duels : jamais ceux des tournois ; refusés/annulés/expirés, ou terminés ET récompense prise par les deux joueurs
    const dEnd=x=>x.exp||((x.st==='wait'?x.at:(x.acc||x.at))||0)+24*3600e3;
    await del('duels',x=>{if(x.t)return true;if(x.st==='no'||x.st==='cancel'||x.st==='wait')return !(dEnd(x)<now-2*D);
      return !(x.a&&x.a.cl&&x.b&&x.b.cl);});
    try{const r=RT();if(r){rtOn(1);const v=(await r.ref('party').once('value')).val()||{};let k=0;for(const c in v){if(((v[c]||{}).at||0)<now-D){await r.ref('party/'+c).remove();k++;}}n.party=k;rtOn(-1);}}catch(e){console.warn('Nettoyage party',e);}
    try{const r=RT();if(r){rtOn(1);const v=(await r.ref('battles').once('value')).val()||{};let k=0;
      for(const id in v){const sides=v[id]||{},at=Math.max(0,...Object.values(sides).map(x=>(x&&x.at)||0));if(at<now-D){await r.ref('battles/'+id).remove();k++;}}n.rt=k;rtOn(-1);}}catch(e){console.warn('Nettoyage direct',e);}
    return n;};
  // une fois par jour, en arrière-plan, quand l'admin ouvre le jeu
  READY.then(ok=>{if(!ok||!GG.admin)return;const d=new Date().toISOString().slice(0,10);if(LS.get('gg-clean')===d)return;
    setTimeout(()=>GG.cleanup().then(()=>LS.set('gg-clean',d)).catch(e=>console.warn('Nettoyage',e)),30000);});

  // Remise à zéro (admin) : 3 confirmations avant d'effacer
  async function wipe(col){const q=await fs.collection(col).get();let batch=fs.batch(),n=0;
    for(const d of q.docs){if(col==='gifts'&&d.id==='season')continue;batch.delete(d.ref);if(++n%400===0){await batch.commit();batch=fs.batch();}}await batch.commit();}
  GG.resetFlow=()=>{if(!GG.admin)return;let mode=null;
    const d=pop(`<div class="emo">⚠️</div><h3>Réinitialiser</h3><p>Que veux-tu effacer ?</p>
      <button class="btn alt" data-m="ranks">🏆 Les classements seulement<br><small style="font-weight:500">Les joueurs gardent leurs cartes</small></button>
      <button class="btn alt" data-m="all" style="margin-top:8px">🗑️ Tout effacer<br><small style="font-weight:500">Joueurs, cartes, classements, cadeaux</small></button>
      <button class="gglink" id="ggNo">Annuler</button>`);
    d.querySelector('#ggNo').onclick=()=>d.remove();
    d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;step1();});
    const what=()=>mode==='all'?'TOUTES les données (joueurs, codes, cartes, classements, cadeaux)':'tous les classements';
    function step1(){d.querySelector('.ggcard').innerHTML=`<div class="emo">🤔</div><h3>Tu es sûr ?</h3>
      <p>Tu vas effacer <b>${what()}</b>. Ce sera définitif.</p><p>Conseil : télécharge d'abord une sauvegarde.</p>
      <button class="btn alt" id="ggBk">💾 Télécharger une sauvegarde</button>
      <button class="btn" id="ggNext" style="margin-top:8px">Oui, continuer</button><button class="gglink" id="ggNo">Annuler</button>`;
      d.querySelector('#ggNo').onclick=()=>d.remove();
      d.querySelector('#ggBk').onclick=async e=>{e.target.textContent='Préparation…';try{await GG.backup();e.target.textContent='Sauvegarde téléchargée ✅';}catch(_){e.target.textContent='Échec, réessaie';}};
      d.querySelector('#ggNext').onclick=step2;}
    function step2(){d.querySelector('.ggcard').innerHTML=`<div class="emo">✍️</div><h3>Confirmation</h3>
      <p>Pour confirmer, tape <b>EFFACER</b> en majuscules.</p><input class="ainput" id="ggTyped" autocomplete="off" autocapitalize="characters">
      <button class="btn" id="ggNext" disabled>Continuer</button><button class="gglink" id="ggNo">Annuler</button>`;
      const i=d.querySelector('#ggTyped'),n=d.querySelector('#ggNext');i.oninput=()=>{n.disabled=i.value.trim()!=='EFFACER';};
      d.querySelector('#ggNo').onclick=()=>d.remove();n.onclick=step3;}
    function step3(){let s=5;d.querySelector('.ggcard').innerHTML=`<div class="emo">🛑</div><h3>Dernière chance</h3>
      <p>Effacer <b>${what()}</b> ?<br>Impossible de revenir en arrière.</p>
      <button class="btn" id="ggGo" disabled style="background:var(--red);color:#fff">Effacer définitivement (5)</button><button class="gglink" id="ggNo">Non, annuler</button>`;
      const g=d.querySelector('#ggGo');d.querySelector('#ggNo').onclick=()=>{clearInterval(tm);d.remove();};
      const tm=setInterval(()=>{s--;if(s>0)g.textContent=`Effacer définitivement (${s})`;else{clearInterval(tm);g.textContent='Effacer définitivement';g.disabled=false;}},1000);
      g.onclick=async()=>{g.disabled=true;g.textContent='Effacement…';
        try{await wipe('board');if(mode==='all'){await wipe('players');await wipe('owners');await wipe('gifts');await wipe('trades');await wipe('duels');await wipe('tournaments');await wipe('events');await wipe('actions');await wipe('requests');await wipe('bounties');await wipe('battles');}
          const ss=await fs.doc('gifts/season').get();const n=((ss.exists&&ss.data().n)||0)+1;
          await fs.doc('gifts/season').set({n,mode,at:Date.now()});
          ['gambetta-col','gambetta-wins','gg-code'].forEach(k=>{if(mode==='all')try{localStorage.removeItem(k);}catch(_){}});LS.set('gg-season',String(n));
          if(mode!=='all'){try{const c=JSON.parse(LS.get('gambetta-col'));c.best={};c.wins_n={};LS.set('gambetta-col',JSON.stringify(c));}catch(_){}}
          d.querySelector('.ggcard').innerHTML=`<div class="emo">✅</div><h3>C'est fait</h3><p>${mode==='all'?'Tout a été effacé. Chaque joueur repartira de zéro à sa prochaine visite.':'Les classements sont remis à zéro.'}</p><button class="btn" id="ggOk">OK</button>`;
          d.querySelector('#ggOk').onclick=()=>location.reload();}
        catch(e){g.disabled=false;g.textContent='Échec, réessaie';}};}
  };

  // Bouton « Ma sauvegarde » sur l'écran des persos
  domReady().then(async()=>{const box=document.querySelector('.selbtns');if(!box)return;
    const b=document.createElement('button');b.className='colbtn save';b.textContent='🔑';b.title='Ma sauvegarde';b.setAttribute('aria-label','Ma sauvegarde');b.hidden=true;box.appendChild(b);
    b.onclick=()=>showCode(GG.code,GG.name,false);if(await READY)b.hidden=false;});
})();
</script>

function drawHall(ctx,x,y,w,h){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  const cH=h*0.34,wallY=y+cH,trimY=y+h*0.72,winY=y+h*0.52;
  ctx.fillStyle='#efe9df';ctx.fillRect(x,y,w,cH);
  for(let r=0;r<2;r++)for(let c=-1;c<6;c++){const px=x+c*w/5+(r?w/10:0),py=y+cH*(0.15+r*0.45);ctx.fillStyle='#fff';ctx.strokeStyle='rgba(27,42,58,.22)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+w*0.16,py-cH*0.06);ctx.lineTo(px+w*0.16,py+cH*0.16);ctx.lineTo(px,py+cH*0.22);ctx.closePath();ctx.fill();ctx.stroke();}
  ctx.strokeStyle='#8a5a35';ctx.lineWidth=Math.max(4,h*0.03);for(let k=-2;k<8;k++){ctx.beginPath();ctx.moveTo(x+k*w/5,y);ctx.lineTo(x+k*w/5+w*0.25,y+cH);ctx.stroke();}
  ctx.fillStyle='#7a4e2e';ctx.fillRect(x,y+cH-4,w,6);
  ctx.fillStyle='#f6f7f8';ctx.fillRect(x,wallY,w,h-cH);
  const ts=Math.max(8,w/32);ctx.strokeStyle='rgba(120,140,160,.18)';ctx.lineWidth=1;
  for(let xx=x;xx<x+w;xx+=ts){ctx.beginPath();ctx.moveTo(xx,wallY);ctx.lineTo(xx,winY);ctx.stroke();}
  for(let yy=wallY;yy<winY;yy+=ts){ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke();}
  const by=wallY+(winY-wallY)*0.3;for(let xx=x,n=0;xx<x+w;xx+=ts,n++){if(n%3===1)continue;ctx.fillStyle=['#7f9fc4','#c9d2dc','#5f86b6','#e3e8ee'][(n*7)%4];ctx.fillRect(xx,by+(n%2?ts*0.8:0),ts,ts*0.8);}
  ctx.fillStyle='#d5ecd0';ctx.fillRect(x,winY,w,trimY-winY);ctx.fillStyle='#9fd08f';
  for(let xx=x;xx<x+w;xx+=w/7){ctx.beginPath();ctx.ellipse(xx+w/14,trimY,w/15,(trimY-winY)*0.55,0,Math.PI,0);ctx.fill();}
  ctx.strokeStyle='#8a5a35';ctx.lineWidth=3;for(let xx=x;xx<=x+w+1;xx+=w/7){ctx.beginPath();ctx.moveTo(xx,winY);ctx.lineTo(xx,trimY);ctx.stroke();}
  const th=Math.max(5,h*0.05);ctx.fillStyle='#8a5a35';ctx.fillRect(x,trimY,w,th);ctx.fillStyle='#f2f0eb';ctx.fillRect(x,trimY+th,w,h);
  ctx.restore();
}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function bubbleText(ctx,x,y,txt,size){
  size=size||13;ctx.font=`700 ${size}px Fredoka, sans-serif`;
  const w=ctx.measureText(txt).width+16,h=size+12;
  x=Math.max(w/2+4,Math.min(ctx.canvas.width/(ctx.getTransform().a||1)-w/2-4,x));

}
function floatText(ctx,f){
  ctx.save();ctx.globalAlpha=Math.max(0,1-f.t/1.2);ctx.font='22px "Lilita One", Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';

function makeCanvas(stage){
  const c=document.createElement('canvas');stage.appendChild(c);
  const ctx=c.getContext('2d');const o={c,ctx,W:300,H:300};
  o.fit=()=>{const r=stage.getBoundingClientRect();const d=Math.min(window.devicePixelRatio||1,2);
    o.W=Math.max(1,r.width);o.H=Math.max(1,r.height);c.width=Math.round(o.W*d);c.height=Math.round(o.H*d);
    c.style.width=o.W+'px';c.style.height=o.H+'px';ctx.setTransform(d,0,0,d,0,0);};
  o.fit();window.addEventListener('resize',o.fit);
  o.destroy=()=>window.removeEventListener('resize',o.fit);
  o.pt=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  return o;
}

const NAMES=['Christine','Ethan','Lucie','Agnès','Jean-François','Christophe','David','Françoise','Aude','Nathan','Manue','Angélique','Richard','Stéphane','Margaux','Pascal','Laurent','Karine','Fabrice','Dario','Brigitte','Alain','Audrey','Mickey','Bouchon','Manon','Hélène','Zoé','Camille','Marcel','Laetitia','Mathéo'];
