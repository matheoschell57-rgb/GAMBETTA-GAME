        if(o.vy>0&&o.y>H+40){os.splice(k,1);if(o.bomb)continue;miss++;fx.push({x:Math.max(40,Math.min(cv.W-40,o.x)),y:H-40,txt:'Ratée !',t:0,c:'#ff6b5b'});hud();
          if(miss>=MAXMISS){over=true;api.end(false,'Le jus est raté !',`${MAXMISS} oranges sont retombées dans l'eau. Aude garde sa recette… mais pas le jus.`);return;}}}
      for(let k=halves.length-1;k>=0;k--){const h=halves[k];h.vy+=h.G*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=h.vr*dt;h.life-=dt;if(h.life<=0)halves.splice(k,1);}

      for(let k=trail.length-1;k>=0;k--){trail[k].a-=dt*4;if(trail[k].a<=0)trail.splice(k,1);}

    },
    draw(){

      drawHall(ctx,0,0,W,H*0.84);
      const wy=H*0.82;const wg=ctx.createLinearGradient(0,wy,0,H);wg.addColorStop(0,'#4fd0d3');wg.addColorStop(1,'#1b9fb2');ctx.fillStyle=wg;ctx.fillRect(0,wy,W,H-wy);
      ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=W;x+=10){const y=wy+Math.sin(x*0.05+t*2)*3;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();

      ctx.save();ctx.clip();ctx.fillStyle='#ffa31a';ctx.fillRect(gx,gy+gh*(1-lvl),gw,gh*lvl);ctx.restore();
      ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+gw,gy);ctx.lineTo(gx+gw-5,gy+gh);ctx.lineTo(gx+5,gy+gh);ctx.closePath();ctx.stroke();
      const orange=(o)=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.beginPath();ctx.arc(0,0,o.r,0,7);ctx.fillStyle='#ff9a1f';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-o.r*0.35,-o.r*0.35,o.r*0.25,o.r*0.15,-0.6,0,7);ctx.fill();
        ctx.fillStyle='#2fb36d';ctx.beginPath();ctx.ellipse(o.r*0.15,-o.r*1.02,o.r*0.32,o.r*0.15,-0.4,0,7);ctx.fill();ctx.lineWidth=2;ctx.stroke();ctx.restore();};
      const bottle=o=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);const r=o.r;ctx.lineWidth=3;ctx.strokeStyle=INK;

        ctx.fillStyle='#2f7d4a';ctx.fill();ctx.stroke();rr(ctx,-r*0.2,-r*1.35,r*0.4,r*0.24,3);ctx.fillStyle='#b8865b';ctx.fill();ctx.stroke();
        rr(ctx,-r*0.45,r*0.05,r*0.9,r*0.5,4);ctx.fillStyle='#ff4d4d';ctx.fill();ctx.stroke();
        ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(r*0.32)}px Fredoka, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('XXX',0,r*0.31);
        ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-r*0.32,-r*0.2,r*0.12,r*0.9);ctx.restore();};
      for(const o of os)o.bomb?bottle(o):orange(o);

        ctx.strokeStyle='#ffa31a';ctx.lineWidth=2;for(let k=1;k<5;k++){const a=k/5*Math.PI;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*h.r*0.8,Math.sin(a)*h.r*0.8);ctx.stroke();}

/* ================= NATHAN : gare aux thons ================= */
function gameNathan(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const LV=[{n:4,v:70,t:22},{n:6,v:90,t:20},{n:8,v:110,t:18},{n:10,v:125,t:16}];

  let lv=0,lives=3,t=0,lvT=0,over=false,path=[],pi=0,nx=0.5,ny=0.9,drawing=false,inv=0,tunas=[],won=0;const fx=[];
  const hud=()=>api.hud(`💖 ${lv+1}/${LV.length}  ❤️ ${lives}  ⏱ ${Math.ceil(Math.max(0,lvT))}s`);
  function setup(){tunas=[];const n=LV[lv].n;for(let k=0;k<n;k++){tunas.push({x:Math.random(),y0:0.22+0.58*(k+0.5)/n,y:0.22+0.58*(k+0.5)/n,d:Math.random()<.5?1:-1,v:LV[lv].v*(0.7+Math.random()*0.6),ph:Math.random()*6,amp:lv>0&&Math.random()<0.5?0.03+lv*0.01:0,burst:0});}

  const pd=e=>{e.preventDefault();if(over)return;const q=cv.pt(e);const end=path.length?path[path.length-1]:P();
    if(Math.hypot(q.x-end.x,q.y-end.y)<60){drawing=true;if(!path.length)path.push({x:end.x,y:end.y});}};
  const pm=e=>{if(!drawing)return;const q=cv.pt(e),l=path[path.length-1];if(Math.hypot(q.x-l.x,q.y-l.y)>8)path.push({x:q.x,y:q.y});};
  const pu=()=>{drawing=false;};
  cv.c.addEventListener('pointerdown',pd);cv.c.addEventListener('pointermove',pm);window.addEventListener('pointerup',pu);
  return{
    update(dt){
      if(over)return;t+=dt;inv=Math.max(0,inv-dt);const W=cv.W,H=cv.H;
      for(const tu of tunas){tu.ph+=dt*5;tu.y=tu.y0+Math.sin(tu.ph*0.35)*tu.amp;if(tu.burst<=0&&lv>=2&&Math.random()<dt*0.25)tu.burst=0.8;tu.burst=Math.max(0,tu.burst-dt);tu.x+=tu.d*tu.v*(tu.burst>0?2.2:1)*dt/W;if(tu.x>1.08){tu.x=1.08;tu.d=-1;}if(tu.x<-0.08){tu.x=-0.08;tu.d=1;}}
      if(won>0){won-=dt;if(won<=0){lv++;if(lv>=LV.length){over=true;api.end(true,'Il est arrivé !',"Nathan a traversé tout le bassin sans croiser un seul thon. Il peut enfin lui dire bonjour 💕");}else setup();}return;}
      lvT-=dt;if(lvT<=0){lives--;fx.push({x:cv.W/2,y:cv.H*0.2,txt:'Elle s\'impatiente !',t:0,c:'#ff6b5b'});lvT=LV[lv].t;reset();
        if(lives<=0){over=true;hud();api.end(false,'Elle est partie !','Nathan a mis trop de temps à traverser le bassin…');return;}}
      hud();let step=125*dt;let p=P();
      while(step>0&&pi<path.length){const tg=path[pi],d=Math.hypot(tg.x-p.x,tg.y-p.y);if(d<=step){p={x:tg.x,y:tg.y};step-=d;pi++;}else{p={x:p.x+(tg.x-p.x)/d*step,y:p.y+(tg.y-p.y)/d*step};step=0;}}
      nx=p.x/W;ny=p.y/H;
      if(inv<=0)for(const tu of tunas){if(Math.abs(tu.x*W-p.x)<38&&Math.abs(tu.y*H-p.y)<22){lives--;inv=1.2;fx.push({x:p.x,y:p.y-30,txt:'Aïe, un thon !',t:0,c:'#ff6b5b'});reset();hud();
        if(lives<=0){over=true;api.end(false,'Trop de thons !','Nathan s\'est fait bousculer par les thons… Il retentera sa chance au prochain cours.');}break;}}
      if(ny<0.17){won=1.3;fx.push({x:p.x,y:p.y-30,txt:'💖',t:0,c:'#ff7eb6'});}
      for(let k=fx.length-1;k>=0;k--){fx[k].t+=dt;if(fx[k].t>1.2)fx.splice(k,1);}
    },
    draw(){
      const W=cv.W,H=cv.H;ctx.clearRect(0,0,W,H);

      ctx.fillStyle='#fff';ctx.fillRect(0,H*0.14-4,W,8);

        ctx.fillStyle='#c9d8e6';ctx.beginPath();ctx.ellipse(4,6,22,6,0,0,Math.PI);ctx.fill();
        ctx.fillStyle='#ffcf33';ctx.beginPath();ctx.moveTo(-6,-14);ctx.lineTo(4,-24);ctx.lineTo(10,-13);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(18,-3,5,0,7);ctx.fill();ctx.stroke();ctx.fillStyle=INK;ctx.beginPath();ctx.arc(19,-3,2.2,0,7);ctx.fill();ctx.restore();}

        [-1,1].forEach(sd=>{const a=Math.sin(t*8+sd)*0.6;ctx.strokeStyle=INK;ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x+sd*r*0.6,p.y+r*0.3);ctx.lineTo(p.x+sd*r*1.3,p.y-r*0.6+a*r);ctx.stroke();ctx.strokeStyle=CHARS.nathan.look.skin;ctx.lineWidth=5;ctx.stroke();});
        drawImg(ctx,nat,p.x-r,p.y-r,r*2,r*2);}

      if(won>0&&lv<LV.length-1)bubbleText(ctx,W/2,H/2,`Niveau ${lv+2} : encore plus de thons !`,15);
      for(const tu of tunas)if(tu.burst>0){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;const x=tu.x*W-tu.d*50,y=tu.y*H;ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x-tu.d*18,y-6);ctx.moveTo(x,y+6);ctx.lineTo(x-tu.d*18,y+6);ctx.stroke();}

/* ================= DAVID : cache-toi de Marcel ! ================= */
function gameDavid(stage,api){

  const ITEMS=[['des frites neuves',80],['un sifflet en or',120],['un canard gonflable géant',150],['une machine à café',200],['des bonnets pour tout le club',100],['une sono pour la piscine',180],['un jacuzzi',250]];
  let round=0,wallet=600,t=0,over=false,phase='choose',spot=-1,mem=SPOTS.map(()=>0),item=pick(ITEMS),checks=[],ci=0,peekT=0,run=null;
  const M={x:1.1,dir:-1};const fx=[];

  const geo=()=>{const W=cv.W,H=cv.H;return{W,H,gy:H*0.6,wy:H*0.84};};
  const spotXY=(i,g)=>({x:SPOTS[i].x*g.W,y:SPOTS[i].w?g.wy:g.gy});
  const green=()=>phase==='search'&&peekT>0;
  function startSearch(){const n=Math.min(5,2+Math.floor(round/1.5));const w=SPOTS.map((_,i)=>1+mem[i]*1.4+Math.random()*1.3);
    checks=SPOTS.map((_,i)=>i).sort((a,b)=>w[b]-w[a]).slice(0,n);checks.sort((a,b)=>SPOTS[b].x-SPOTS[a].x);ci=0;phase='search';M.x=1.12;M.dir=-1;}
  function caught(msg){if(phase==='found')return;phase='found';run=null;wallet-=item[1];
    fx.push({x:cv.W/2,y:geo().gy-150,txt:`${msg} -${item[1]}€`,t:0,c:'#ff6b5b'});hud();

  function next(){round++;if(round>=ROUNDS){over=true;api.end(true,'Bien caché !',`David a échappé à Marcel et garde ${wallet}€ en poche. Les achats du club attendront !`);return;}
    item=pick(ITEMS);phase='choose';spot=-1;run=null;M.x=1.12;hud();}
  const onDown=e=>{e.preventDefault();if(over)return;const q=cv.pt(e),g=geo();
    let best=-1,bd=60;SPOTS.forEach((_,i)=>{const p=spotXY(i,g),d=Math.hypot(p.x-q.x,(p.y-40)-q.y);if(d<bd){bd=d;best=i;}});if(best<0)return;
    if(phase==='choose'){spot=best;mem[best]++;phase='ready';setTimeout(()=>{if(!over&&phase==='ready')startSearch();},700);}
    else if(phase==='search'&&!run&&best!==spot){
      if(peekT>0&&best===checks[ci]){fx.push({x:q.x,y:q.y-40,txt:'Il fouille là !',t:0,c:'#ffcf33'});return;}
      if(!green()){run={from:spot,to:best,k:0};caught('Vu en train de bouger !');return;}
      run={from:spot,to:best,k:0};}};
  cv.c.addEventListener('pointerdown',onDown);
  return{
    update(dt){
      if(over)return;t+=dt;for(let k=fx.length-1;k>=0;k--){fx[k].t+=dt;if(fx[k].t>1.4)fx.splice(k,1);}
      if(run&&phase==='search'){run.k+=dt/0.35;if(run.k>=1){spot=run.to;mem[run.to]++;run=null;}}
      if(phase!=='search')return;const sp=0.2+round*0.025;
      if(ci<checks.length){const tx=SPOTS[checks[ci]].x+0.07;
        if(peekT>0){peekT-=dt;M.dir=-1;if(peekT<=0){if(run){caught('Vu en train de bouger !');return;}
          if(spot===checks[ci]){caught('Trouvé !');return;}fx.push({x:SPOTS[checks[ci]].x*cv.W,y:geo().gy-130,txt:'Personne…',t:0,c:'#fff'});ci++;}}
        else{const d=tx-M.x;M.dir=d<0?-1:1;if(Math.abs(d)<sp*dt){M.x=tx;peekT=Math.max(0.9,1.5-round*0.1);}else M.x+=Math.sign(d)*sp*dt;}}
      else{M.dir=1;M.x+=sp*dt;if(M.x>1.15){fx.push({x:cv.W/2,y:geo().gy-150,txt:'Bizarre, pas de David…',t:0,c:'#7dffa8'});phase='safe';setTimeout(()=>{if(!over)next();},1300);}}
    },
    draw(){
      const g=geo(),W=g.W,H=g.H;ctx.clearRect(0,0,W,H);drawHall(ctx,0,0,W,g.gy-40);
      ctx.fillStyle='#ece8df';ctx.fillRect(0,g.gy-40,W,g.wy-g.gy);ctx.strokeStyle='rgba(120,120,120,.2)';ctx.lineWidth=1.5;for(let x=0;x<W;x+=26){ctx.beginPath();ctx.moveTo(x,g.gy-40);ctx.lineTo(x,g.gy+30);ctx.stroke();}
      const wtop=g.gy+30,wg=ctx.createLinearGradient(0,wtop,0,H);wg.addColorStop(0,'#4fd0d3');wg.addColorStop(1,'#1b9fb2');ctx.fillStyle=wg;ctx.fillRect(0,wtop,W,H-wtop);
      ctx.fillStyle='#fff';ctx.fillRect(0,wtop-4,W,8);
      for(let x=6,n=0;x<W;x+=16,n++){ctx.fillStyle=n%2?'#ff5d5d':'#ffd21f';ctx.beginPath();ctx.arc(x,H*0.95,4,0,7);ctx.fill();}
      const prop=(i,x,y)=>{ctx.strokeStyle=INK;ctx.lineWidth=3;
        if(i===0){ctx.fillStyle='#fff';ctx.fillRect(x-24,y-96,48,10);ctx.strokeRect(x-24,y-96,48,10);ctx.beginPath();ctx.moveTo(x-20,y);ctx.lineTo(x-14,y-86);ctx.moveTo(x+20,y);ctx.lineTo(x+14,y-86);ctx.moveTo(x-18,y-40);ctx.lineTo(x+18,y-40);ctx.stroke();ctx.fillStyle='#e63b3b';ctx.fillRect(x-22,y-130,44,34);ctx.strokeRect(x-22,y-130,44,34);}

        else if(i===3){ctx.lineCap='round';ctx.lineWidth=26;ctx.beginPath();ctx.moveTo(x-40,y-140);ctx.quadraticCurveTo(x+40,y-100,x-10,y-10);ctx.stroke();ctx.strokeStyle='#ff8a1f';ctx.lineWidth=19;ctx.stroke();ctx.strokeStyle='#2f6fd0';ctx.lineWidth=3;ctx.stroke();}
        else if(i===4){ctx.save();ctx.translate(x-52,y-100);ctx.scale(0.36,0.36);drawBike(ctx,null,t);ctx.restore();ctx.fillStyle='rgba(79,208,211,.55)';ctx.fillRect(x-60,y-10,120,14);}
        else{ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(x+(k-1.5)*10,y-20-((t*25+k*11)%30),3+k%2*2,0,7);ctx.stroke();}}};
      if(phase==='search'&&ci<checks.length){const p=spotXY(checks[ci],g);ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle='#ffcf33';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y-40,48,0,7);ctx.stroke();ctx.restore();
        ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('👀',p.x,p.y-96);}
      SPOTS.forEach((sp,i)=>{const p=spotXY(i,g);
        if(spot===i&&!run){const r=15,off=[[0,-68],[0,-92],[28,-34],[30,-30],[-6,-62],[0,-6]][i];

      if(run){const a=spotXY(run.from,g),b=spotXY(run.to,g),k=Math.min(1,run.k),x=a.x+(b.x-a.x)*k,y=Math.min(a.y,b.y)+(1-Math.abs(k-0.5)*2)*-20,dw=44;drawImg(ctx,dav,x-dw/2,y-dw*1.15,dw,dw*1.15);}

        ctx.font='700 14px Fredoka, sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';

/* ================= ANTHONY : l'urgence sur la plage (course vue de dos) ================= */
function gameAnthony(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const GOAL=40,LIVES=3;const L=CHARS.anthony.look;
  const kidImg=Array.from({length:4},()=>svgImg(avatar(randLook({hair:pick(['short','pigtails','curly']),beard:false,mustache:false,glasses:false,freckles:true}))));
  const vic=svgImg(avatar(randLook({hair:'long',beard:false,mustache:false}),{viewBox:'30 20 140 140'}));
  let t=0,over=false,dist=0,lives=LIVES,lane=1,px=1,jy=0,jv=0,fall=0,inv=0,nextO=1,st=null;const obs=[],fx=[];
  const hud=()=>api.hud(`🏃 ${Math.min(100,Math.floor(dist/GOAL*100))}%  ❤️ ${lives}`);hud();
  const geo=()=>{const W=cv.W,H=cv.H;return{W,H,hy:H*0.34,by:H*1.02,lw:W*0.3};};
  const proj=(z,g)=>{const f=1/(1+5*z);return{f,y:g.hy+(g.by-g.hy)*(f-1/6)/(5/6)};};
  const LOW=['flaque','planche','frite'],HIGH=['enfant','pile','seau'];
  function act(kind){if(over||fall>0)return;if(kind==='l')lane=Math.max(0,lane-1);else if(kind==='r')lane=Math.min(2,lane+1);else if(jy===0)jv=1.25;}
  const pd=e=>{e.preventDefault();st=cv.pt(e);};
  const pu=e=>{if(!st)return;const q=cv.pt(e),dx=q.x-st.x,dy=q.y-st.y;st=null;
    if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))act(dx>0?'r':'l');else if(dy<-30||Math.hypot(dx,dy)<20)act('j');};
  const kd=e=>{if(e.key==='ArrowLeft')act('l');else if(e.key==='ArrowRight')act('r');else if(e.key==='ArrowUp'||e.key===' ')act('j');};
  cv.c.addEventListener('pointerdown',pd);window.addEventListener('pointerup',pu);window.addEventListener('keydown',kd);
  return{
    update(dt){
      if(over)return;t+=dt;inv=Math.max(0,inv-dt);for(let k=fx.length-1;k>=0;k--){fx[k].t+=dt;if(fx[k].t>1.4)fx.splice(k,1);}
      px+=Math.max(-dt*7,Math.min(dt*7,lane-px));
      if(fall>0){fall-=dt;if(fall<=0)inv=1.2;return;}
      const sp=0.55+dist*0.012;dist+=dt;
      if(jv>0||jy>0){jy+=jv*dt*2.2;jv-=dt*4.2;if(jy<=0){jy=0;jv=0;}}
      nextO-=dt;if(nextO<=0){const free=Math.floor(Math.random()*3);const n=dist>12&&Math.random()<0.45?2:1;
        const lanes=[0,1,2].filter(l=>l!==free);shuffle(lanes).slice(0,n).forEach(l=>{const high=Math.random()<(dist<6?0.2:0.45);obs.push({lane:l,z:1,k:high?pick(HIGH):pick(LOW),high,img:pick(kidImg)});});
        nextO=Math.max(0.55,1.25-dist*0.015)*(0.8+Math.random()*0.4);}
      for(let k=obs.length-1;k>=0;k--){const o=obs[k];o.z-=sp*dt;
        if(!o.done&&o.z<=0.03){o.done=true;if(o.lane===lane&&inv<=0&&!(jy>0.25&&!o.high)){lives--;fall=1.2;hud();
          fx.push({x:cv.W/2,y:cv.H*0.5,txt:o.k==='flaque'?'Il glisse !':'Boum !',t:0,c:'#ff6b5b'});
          if(lives<=0){over=true;setTimeout(()=>api.end(false,'Sur les fesses !','Anthony est tombé trois fois… tout le monde a bien lu « MAÎTRE NAGEUR » sur son slip !'),900);return;}}}
        if(o.z<-0.2)obs.splice(k,1);}
      if(dist>=GOAL){over=true;api.end(true,'Sauvé !',"Anthony est arrivé à temps pour sauver le nageur en détresse. Le slip « MAÎTRE NAGEUR » a fait son effet !");}
      hud();
    },
    draw(){

      ctx.save();ctx.beginPath();ctx.moveTo(tx-tw/2,ty-th/2);ctx.lineTo(tx-tw/2,ty+th/2-tw/2);ctx.arc(tx,ty+th/2-tw/2,tw/2,Math.PI,0,true);ctx.lineTo(tx+tw/2,ty-th/2);ctx.closePath();

/* ================= FRANÇOISE : les sauvetages du grand bassin ================= */
function gameFrancoise(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const GOAL=12,MAXMISS=3;const L=CHARS.francoise.look;
  const fr=svgImg(avatar(L)),frH=svgImg(avatar(L,{viewBox:'30 20 140 140'}));
  const kidImgs=Array.from({length:8},()=>svgImg(avatar(randLook({hair:pick(['short','pigtails','curly']),beard:false,mustache:false,glasses:false,freckles:true}),{viewBox:'30 20 140 140'})));
  let t=0,el=0,over=false,saved=0,miss=0,state='edge',fx_=0.5,fy=0,carry=null,jump=null,last=0,next=0.5;const kids=[],fx=[];
  const geo=()=>{const W=cv.W,H=cv.H;return{W,H,top:H*0.06,bot:H*0.82,px:12,pw:W-24};};
  const hud=()=>api.hud(`🛟 ${saved}/${GOAL}  😵 ${miss}/${MAXMISS}`);hud();
  function spawn(){const g=geo();kids.push({x:0.12+Math.random()*0.76,y:0.1+Math.random()*0.55,life:1,rate:1/Math.max(5,9-el*0.06),img:pick(kidImgs),ph:Math.random()*6});}
  const onDown=e=>{e.preventDefault();if(over)return;const q=cv.pt(e),g=geo();
    if(state==='edge'){let best=null,bd=40;for(const k of kids){const d=Math.hypot(k.x*g.W-q.x,g.top+k.y*(g.bot-g.top)-q.y);if(d<bd){bd=d;best=k;}}

      ctx.fillStyle='#fff';ctx.fillRect(px-6,gy*0.62,6,gy*0.38+30);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;for(let i=0;i<4;i++){const yy=gy*0.7+i*18;ctx.beginPath();ctx.moveTo(px+6,yy);ctx.quadraticCurveTo(px+(W-px)/2,yy-5+Math.sin(t*2+i)*3,W,yy);ctx.stroke();}

      if(hstate==='come'||phase==='won'){ctx.fillStyle='#ff7eb6';ctx.beginPath();ctx.ellipse(R*1.55,-R*0.62,R*0.08,R*0.16,0,0,7);ctx.fill();}
      ctx.restore();

      // la voix d'Alix

        ctx.font=`${call.big?30:24}px "Lilita One", Impact, sans-serif`;ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.fillStyle=call.c;ctx.strokeText(call.txt,0,0);ctx.fillText(call.txt,0,0);ctx.restore();}
      // panneau de la voix

      if(hold){const nx=mx+mw*Math.max(0,Math.min(1,needle+wob));ctx.fillStyle=INK;ctx.fillRect(nx-3,my-10,6,mh+20);ctx.beginPath();ctx.moveTo(nx-9,my-14);ctx.lineTo(nx+9,my-14);ctx.lineTo(nx,my-4);ctx.fill();}

    destroy(){cv.c.removeEventListener('pointerdown',down);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);cv.destroy();}
  };
}

/* ================= KAYAK : le téléphone au fond de l'eau trouble ================= */
function gameKayak(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx,LIVES=3;
  const cam=svgImg(avatar(CHARS.kayak.look));
  let t=0,over=false,phase='play',lives=LIVES,o2=1,dx=0.45,dy=0.12,tx=null,ty=null,face=-1,carried=null,silt=0,passCd=2,pingT=0,wonT=0,hurtT=0,inv=0,msgT=0,msg='',done=0;
  const fx=[],bub=[],pings=[],mud=[],flies=[];
  const FCOL=['#f2a541','#7fc8a9','#e86a5a','#c9a24a','#8fb3d9','#b58ad6','#9ccf5b','#f28fb0'];
  const fish=[];for(let i=0;i<8;i++)fish.push({x:0.1+Math.random()*0.8,y:0.35+Math.random()*0.55,a:Math.random()*6.28,turn:1+Math.random()*2,col:FCOL[i],sz:0.8+Math.random()*0.5,flee:0,tired:0,ph:null});
  // les deux téléphones : celui de Christian (coque bleue) et celui de Camille (coque rose)
  const PH=[{who:'Christian',col:'#3c8ee6',done:false},{who:'Camille',col:'#ff5fa2',done:false}];
  fish[0].ph=PH[0];fish[4].ph=PH[1];
  const silure={x:0.2,y:0.8,a:0,turn:3,rest:0};
  const geo=()=>{const W=cv.W,H=cv.H,s=Math.min(W/400,H/700);return{W,H,s,surf:H*0.17,bot:H*0.96};};
  const hud=()=>api.hud(`📱 ${done}/2  ❤️ ${lives}  🫧 ${Math.round(o2*100)}%`);hud();
  const say=(m,d)=>{msg=m;msgT=d||2;};
  const down=e=>{e.preventDefault();if(over)return;const q=cv.pt(e);tx=q.x/cv.W;ty=q.y/cv.H;};
  const move=e=>{if(tx===null)return;const q=cv.pt(e);tx=q.x/cv.W;ty=q.y/cv.H;};
  const up=()=>{tx=ty=null;};
  cv.c.addEventListener('pointerdown',down);cv.c.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  const free=()=>fish.filter(f=>!f.ph&&!flies.some(fl=>fl.to===f));
  function nearestFree(x,y,max){const g=geo();let best=null,bd=1e9;free().forEach(f=>{const d=Math.hypot((f.x-x)*g.W,(f.y-y)*g.H);if(d<bd&&d<(max||1e9)){bd=d;best=f;}});return best;}
  function dropPhone(){if(!carried)return;const to=nearestFree(dx,dy);flies.push({ph:carried,x:dx,y:dy,to,t:0});carried=null;}
  function grab(ph,txt){carried=ph;fx.push({x:dx*cv.W,y:dy*cv.H-30,txt,t:0,c:'#2fb36d'});say(`Le téléphone de ${ph.who} ! Au kayak 🛶`,2.5);}
  function loseLife(m){lives--;hud();fx.push({x:dx*cv.W,y:dy*cv.H-30,txt:m,t:0,c:'#ff6b5b'});dropPhone();
    if(lives<=0){over=true;phase='lost';setTimeout(()=>api.end(false,'Glouglou…',done?'Un téléphone sur deux… l\'autre reste au fond, et les poissons continuent de scroller sur FishApp.':'Les téléphones restent au fond, et les poissons continuent de scroller sur FishApp.'),900);return;}
    dx=0.45;dy=0.12;o2=1;inv=2;tx=ty=null;}
  return{
    update(dt){t+=dt;for(let k=fx.length-1;k>=0;k--){fx[k].t+=dt;if(fx[k].t>1.4)fx.splice(k,1);}
      for(let k=bub.length-1;k>=0;k--){const b=bub[k];b.y-=b.v*dt;b.t+=dt;if(b.t>2.5)bub.splice(k,1);}
      for(let k=pings.length-1;k>=0;k--){pings[k].t+=dt;if(pings[k].t>1.2)pings.splice(k,1);}
      for(let k=mud.length-1;k>=0;k--){mud[k].t+=dt;if(mud[k].t>3)mud.splice(k,1);}
      if(msgT>0)msgT-=dt;
      if(phase==='won'){wonT+=dt;return;}if(over)return;
      const g=geo(),{W,H,s,surf,bot}=g,sy=surf/H,by=bot/H;
      if(inv>0)inv-=dt;if(hurtT>0)hurtT-=dt;
      // plongeur
      let moving=false;
      if(tx!==null){const ddx=(tx-dx)*W,ddy=(ty-dy)*H,d=Math.hypot(ddx,ddy);if(d>5){const sp=Math.min(d*3,215*s);dx+=ddx/d*sp*dt/W;dy+=ddy/d*sp*dt/H;moving=true;if(Math.abs(ddx)>2)face=ddx>0?1:-1;}}
      dx=Math.max(0.04,Math.min(0.96,dx));dy=Math.max(sy-0.05,Math.min(by-0.02,dy));
      const under=dy>sy+0.015;
      if(under){o2-=dt/16;if(Math.random()<dt*3)bub.push({x:dx+face*0.02,y:dy-0.01,v:0.06+Math.random()*0.05,t:0});}
      else{if(o2<1&&Math.random()<dt*2)fx.push({x:dx*W,y:surf-20,txt:'🫧',t:0,c:'#fff'});o2=Math.min(1,o2+dt/2);}
      if(o2<=0){o2=0;loseLife('Plus d\'air ! 😵');return;}

        f.x+=Math.cos(f.a)*sp*dt/W;f.y+=Math.sin(f.a)*sp*dt/H;
        if(f.x<0.04||f.x>0.96){f.a=Math.PI-f.a;f.x=Math.max(0.04,Math.min(0.96,f.x));}
        if(f.y<sy+0.07||f.y>by-0.04){f.a=-f.a;f.y=Math.max(sy+0.07,Math.min(by-0.04,f.y));}});
      // passes

      if(passCd<=0){const hd=fish.find(f=>f.ph&&f.flee>0.9);if(hd){const to=nearestFree(hd.x,hd.y,260*s);
        if(to){flies.push({ph:hd.ph,x:hd.x,y:hd.y,to,t:0});hd.ph=null;hd.flee=0;passCd=3.2;fx.push({x:hd.x*W,y:hd.y*H-24,txt:'Passe ! 🐟',t:0,c:'#ffcf33'});}}}
      for(let k=flies.length-1;k>=0;k--){const fl=flies[k];fl.t+=dt/0.6;const q=Math.min(1,fl.t);
        fl.cx=fl.x+(fl.to.x-fl.x)*q;fl.cy=fl.y+(fl.to.y-fl.y)*q-Math.sin(q*Math.PI)*0.06;
        if(!carried&&Math.hypot((fl.cx-dx)*W,(fl.cy-dy)*H)<34*s){flies.splice(k,1);grab(fl.ph,'Intercepté ! 📱');}

      // attraper un porteur
      if(!carried){const h2=fish.find(f=>f.ph&&Math.hypot((f.x-dx)*W,(f.y-dy)*H)<24*s);if(h2){const ph=h2.ph;h2.ph=null;grab(ph,'📱 Récupéré !');}}
      // vibrations des téléphones encore perdus
      pingT-=dt;if(pingT<=0){pingT=3.2/Math.max(1,2-done);fish.forEach(f=>{if(f.ph)pings.push({x:f.x,y:f.y,t:0,col:f.ph.col});});flies.forEach(fl=>pings.push({x:fl.cx,y:fl.cy,t:0,col:fl.ph.col}));}
      // silure
      silure.turn-=dt;if(silure.turn<=0){silure.turn=2+Math.random()*3;silure.a=Math.random()<0.5?0:Math.PI;}
      const sd=Math.hypot((silure.x-dx)*W,(silure.y-dy)*H);
      silure.rest-=dt;const hunt=sd<150*s&&under&&silure.rest<=0;if(hunt){silure.a=Math.atan2((dy-silure.y)*H,(dx-silure.x)*W);}
      silure.x+=Math.cos(silure.a)*(hunt?95:40)*s*dt/W;silure.y+=Math.sin(silure.a)*(hunt?95:22)*s*dt/H;
      silure.x=Math.max(0.08,Math.min(0.92,silure.x));silure.y=Math.max(sy+0.25,Math.min(by-0.05,silure.y));
      if(sd<38*s&&inv<=0){inv=2.5;hurtT=0.5;silure.rest=2.5;silure.a+=Math.PI;o2=Math.max(0.05,o2-0.3);fx.push({x:dx*W,y:dy*H-30,txt:'Le silure ! -30% 🫧',t:0,c:'#ff6b5b'});if(carried){dropPhone();say('Le téléphone t\'a échappé !',1.6);}
        const a=Math.atan2((dy-silure.y)*H,(dx-silure.x)*W);dx+=Math.cos(a)*0.12;dy+=Math.sin(a)*0.06;}
      // livraison au kayak
      const kx=0.7;if(carried&&dy<sy+0.03&&Math.abs(dx-kx)<0.14){carried.done=true;done++;carried=null;

        else{fx.push({x:kx*W,y:surf-40,txt:'1/2 ! Encore un 📱',t:0,c:'#2fb36d'});say('Plus qu\'un téléphone ! Suis les 📳',2.2);}}

    },
    draw(){const g=geo(),{W,H,s,surf,bot}=g;ctx.clearRect(0,0,W,H);
      // ciel + rive
      const sk=ctx.createLinearGradient(0,0,0,surf);sk.addColorStop(0,'#9fd9f5');sk.addColorStop(1,'#d8f0e0');ctx.fillStyle=sk;ctx.fillRect(0,0,W,surf);
      ctx.fillStyle='#6fae55';ctx.beginPath();ctx.moveTo(0,surf);for(let x=0;x<=W;x+=W/8)ctx.lineTo(x,surf-18-Math.sin(x*0.03)*10);ctx.lineTo(W,surf);ctx.fill();
      ctx.fillStyle='#4e8c3e';[[0.08,0.6],[0.2,0.75],[0.9,0.65]].forEach(p=>{ctx.beginPath();ctx.arc(W*p[0],surf-30*p[1]-20,22*s,0,7);ctx.fill();});
      // eau trouble

    },
    draw(){

      const tw=W*0.12;ctx.fillRect(0,g.py,tw,g.wy-g.py);ctx.strokeRect(-3,g.py,tw+3,g.wy-g.py);
      for(let y=g.py+16;y<g.wy;y+=16){ctx.beginPath();ctx.moveTo(4,y);ctx.lineTo(tw-4,y);ctx.stroke();}

      ctx.font='22px "Lilita One", Impact, sans-serif';ctx.textAlign='left';ctx.textBaseline='bottom';ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.fillStyle='#ffcf33';

      const wg=ctx.createLinearGradient(0,g.wy,0,H);wg.addColorStop(0,'#4fd0d3');wg.addColorStop(1,'#1b9fb2');ctx.fillStyle=wg;ctx.fillRect(0,g.wy,W,H-g.wy);

        ctx.save();const sc=0.7+Math.min(1,impactT*3)*0.3+last/250;ctx.translate(W/2,H*0.38);ctx.scale(sc,sc);
        ctx.font='40px "Lilita One", Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=7;ctx.strokeStyle=INK;ctx.fillStyle='#ffcf33';

        ctx.font='700 12px Fredoka, sans-serif';ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(`${hh} m : ${scores[k]!==undefined?scores[k]:'–'}`,bx+bw/2,by+15);});
    },
    destroy(){cv.c.removeEventListener('pointerdown',onDown);cv.destroy();}
  };

/* Swipe gauche / droite sur une carte */
function bindSwipe(el,locked,cb){
  let sx=null,dx=0;
  el.addEventListener('pointerdown',e=>{if(locked())return;sx=e.clientX;dx=0;el.style.transition='none';try{el.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener('pointermove',e=>{if(sx===null)return;dx=e.clientX-sx;el.style.transform=`translateX(${dx}px) rotate(${dx/14}deg)`;});
  const up=()=>{if(sx===null)return;sx=null;el.style.transition='';
    if(dx>70)cb(true);else if(dx<-70)cb(false);else el.style.transform='';};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

MEMBER_SLOTS=Math.max(60,MEMBERS.length);
const memIdx=id=>MEMBERS.findIndex(m=>m.id===id);
function memberHTML(id,big){const m=MEMBERS[memIdx(id)],num=String(memIdx(id)+1).padStart(2,'0'),isNew=!big&&COL.members[id]&&!COL.seen['m_'+id];
  if(m.full)return `<div class="tcard mem full${m.fit?' fit':''} r-${m.r}${big?' big':''}" data-mem="${id}" role="button" aria-label="Carte ${m.n}">
    ${m.fit?`<img class="fitbg" src="${big?m.img:(m.thumb||m.img)}" ${big?'':'loading="lazy" '}decoding="async" alt="">`:''}<img class="fullimg" src="${big?m.img:(m.thumb||m.img)}" ${big?'':'loading="lazy" '}decoding="async" alt="${m.n}" style="object-position:${m.fit?'50% 30%':m.pos}">
    ${isNew?'<span class="newtag">NOUVEAU</span>':''}
    <div class="tc-top"><span class="tc-num">#${num}</span><span class="tc-rar" title="${RAR[m.r].n}">${RAR[m.r].s}</span></div>
    <div class="tc-name">${m.n}</div></div>`;
  return `<div class="tcard mem r-${m.r}${big?' big':''}" data-mem="${id}" role="button" aria-label="Carte ${m.n}" style="--ar:${m.ar||1}">
    ${isNew?'<span class="newtag">NOUVEAU</span>':''}
    <div class="tc-top"><span class="tc-num">#${num}</span><span class="tc-rar" title="${RAR[m.r].n}">${RAR[m.r].s}</span></div>
    <div class="tc-art">${m.fit?`<img class="fitbg" src="${big?m.img:(m.thumb||m.img)}" ${big?'':'loading="lazy" '}decoding="async" alt="">`:''}<img class="${m.fit?'fitimg':''}" src="${big?m.img:(m.thumb||m.img)}" ${big?'':'loading="lazy" '}decoding="async" alt="${m.n}" style="object-position:${m.fit?'50% 50%':m.pos}"></div>
    <div class="tc-name${m.n.length>13?' lng':''}">${m.n}</div>
    <div class="tc-who">${RAR[m.r].n}</div>
    <div class="tc-txt${m.t.length>165?' xxlong':m.t.length>120?' xlong':m.t.length>75?' long':''}">${m.t}</div>

let colTab='mg';
function buildCol(){
  updBoostBtn();

  const g=$('#cgrid');$('#rarLegend').style.display=colTab==='mg'?'none':'flex';

  else{const own=MEMBERS.filter(m=>COL.members[m.id]).length;
    g.innerHTML=`<div class="cmsg">👥 ${own} / ${MEMBER_SLOTS} — Les cartes membres s'obtiennent dans les <b>boosters</b>, les <b>pochettes</b> et la <b>carte du jour</b> 🎁</div>`+
    Array.from({length:MEMBER_SLOTS},(_,i)=>{const m=MEMBERS[i];if(m&&COL.members[m.id])return memberHTML(m.id,false);
      return `<div class="tcard locked${m?' r-'+m.r:''}" data-member="1"><div class="lq">?</div><div class="lh">#${String(i+1).padStart(2,'0')}${m?'<br>'+RAR[m.r].s:''}</div></div>`;}).join('');}
  $('.cscroll').scrollTop=0;
  $('#cloudNote').textContent=cloudOK?'☁️ Collection sauvegardée sur ton compte':'📱 Collection sauvegardée sur cet appareil';
  g.querySelectorAll('.tcard').forEach(el=>el.onclick=()=>openCard(el));
}
function openCard(el){const m=$('#cmodal'),k=el.dataset.k;

  else if(el.dataset.member){m.innerHTML=`<div class="hint">🎁 Cette carte membre s'obtiendra dans un booster.<br>Patience, ils arrivent bientôt !</div><button class="btn" id="cmClose">OK</button>`;}
  else if(el.dataset.locked){const c=CHARS[k];m.innerHTML=`<div class="hint">🔒 ${k==='bonus'?'Fais au moins <b>300 points</b> au':'Gagne'} <b>« ${c.game} »</b>${k==='bonus'?'':' avec '+c.name} pour obtenir cette carte !</div><div class="endbtns"><button class="btn" id="cmPlay">Jouer ▶</button><button class="btn alt" id="cmClose">Fermer</button></div>`;}
  else{COL.seen[k]=1;saveCol();m.innerHTML=cardHTML(k,true)+`<button class="btn alt" id="cmClose">Fermer</button>`;tilt(m.querySelector('.tcard.big'));}
  m.classList.add('show');
  m.onclick=e=>{if(e.target===m)closeCard();};
  const cl=m.querySelector('#cmClose');if(cl)cl.onclick=closeCard;
  const pl=m.querySelector('#cmPlay');if(pl)pl.onclick=()=>{closeCard();openIntro(k);};
}

const WRAP='img/x/cd067210f6b4.webp';
const PACK_SIZE=5,RAR_W={R:75,E:20,L:5};

/* Récompenses : pochette (1 carte) à la 1re victoire, booster de 3 cartes tous les 5 mini-jeux gagnés, 5 cartes quand tout est gagné, carte du jour */
const MILESTONES=[5,10,15,20,25,30,35,40];
function packCount(){return (COL.boosters||0)+(COL.packs||[]).length;}
function curPack(){return (COL.packs&&COL.packs.length)?COL.packs[0]:{n:PACK_SIZE,label:'Booster'};}
function grantPack(n,label){COL.packs=COL.packs||[];COL.packs.push({n,label});}
(function initRew(){if(COL.rew)return;const n=ownedMGsafe();COL.rew={mil:{},all:false};MILESTONES.forEach(m=>{if(n>=m)COL.rew.mil[m]=true;});})();
function ownedMGsafe(){try{return Object.keys(COL.cards||{}).filter(k=>MG_CARDS[k]).length;}catch(_){return 0;}}
function winRewards(k){const out=[];COL.rew=COL.rew||{mil:{},all:false};
  grantPack(1,'Pochette « '+CHARS[k].name+' »');out.push({e:'🎴',t:'Une pochette surprise (1 carte)'});
  const n=ownedMGsafe(),tot=MG_ORDER.length;
  if(n>=tot&&!COL.rew.all){COL.rew.all=true;grantPack(5,'Tous les mini-jeux !');out.push({e:'🏆',t:'Tous les mini-jeux gagnés : un booster de 5 cartes !'});}
  else MILESTONES.forEach(m=>{if(n>=m&&m<tot&&!COL.rew.mil[m]){COL.rew.mil[m]=true;grantPack(3,m+' mini-jeux gagnés');out.push({e:'🎁',t:m+' mini-jeux gagnés : un booster de 3 cartes !'});}});
  saveCol();updBoostBtn();return out;}
function nextMilestone(){const n=ownedMGsafe(),tot=MG_ORDER.length,m=MILESTONES.find(x=>x>n&&x<tot);return m?{left:m-n,n:3}:(n<tot?{left:tot-n,n:5}:null);}
function dailyCheck(){const d=new Date(),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(COL.daily===key)return false;COL.daily=key;grantPack(1,'Carte du jour');saveCol();updBoostBtn();return true;}
function drawPack(size){size=size||PACK_SIZE;const pool=r=>MEMBERS.filter(m=>m.r===r);const out=[];
  for(let i=0;i<size;i++){let x=Math.random()*100,r='R';if(x<RAR_W.L&&pool('L').length)r='L';else if(x<RAR_W.L+RAR_W.E&&pool('E').length)r='E';
    out.push(pick(pool(r)).id);}
  const ord={R:0,E:1,L:2};return out.sort((a,b)=>ord[MEMBERS[memIdx(a)].r]-ord[MEMBERS[memIdx(b)].r]);}
function updBoostBtn(){const b=$('#openBoost');if(!b)return;const n=packCount();b.disabled=!n;b.textContent=n?`🎁 Ouvrir ${n>1?'mes paquets':'mon paquet'} (${n})`:'🎁 Aucun booster pour l\'instant';
  const g=$('#boostGoal');if(g){const m=nextMilestone();g.innerHTML=m?`🎯 Encore <b>${m.left}</b> mini-jeu${m.left>1?'x':''} à gagner pour ton prochain booster de ${m.n} cartes`:'🏆 Tous les mini-jeux sont gagnés !';}}
let BST=null;
function openBooster(){if(!(packCount()>0))return;$('#booster').classList.add('on');startPack();}
function closeBooster(){$('#booster').classList.remove('on');$('#bstage').innerHTML='';BST=null;}
function sparks(x,y,n,cols){const st=$('#bstage');for(let i=0;i<n;i++){const d=document.createElement('div');d.className='spark';const a=Math.random()*Math.PI*2,r=60+Math.random()*120;
  d.style.cssText=`left:${x}px;top:${y}px;background:${pick(cols)};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;st.appendChild(d);setTimeout(()=>d.remove(),950);}}
function startPack(){
  const st=$('#bstage');st.innerHTML='';const cp=curPack();$('#bcount').textContent=`🎁 ${packCount()} à ouvrir · ${cp.label}`;

  setTimeout(()=>pk.classList.add('idle'),750);
  const pw=$('#pkwrap');$('#booster').onpointermove=e=>{if(!BST||BST.phase!=='pack'||(BST.down&&BST.down.strip))return;const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
    pw.style.transform=`perspective(900px) rotateY(${x*22}deg) rotateX(${-y*16}deg)`;pk.style.setProperty('--lx',(50+x*80)+'%');};
  $('#bhint').textContent='Touche le paquet, ou glisse le doigt sur la bande du haut pour le découper ✂️';
  BST={phase:'pack',cards:drawPack(cp.n),n:cp.n,i:0,cut:0,down:null};if(cp.n<5)$('#pack').classList.add('small');
  pk.addEventListener('pointerdown',e=>{if(BST.phase!=='pack')return;e.preventDefault();const r=pk.getBoundingClientRect();
    BST.down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,strip:e.clientY<r.top+r.height*0.28};try{pk.setPointerCapture(e.pointerId);}catch(_){}});
  pk.addEventListener('pointermove',e=>{const d=BST&&BST.down;if(!d||BST.phase!=='pack')return;d.moved=Math.max(d.moved,Math.hypot(e.clientX-d.x,e.clientY-d.y));
    if(!d.strip)return;const r=pk.getBoundingClientRect();const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    if(p>BST.cut&&p-BST.cut<0.35){BST.cut=p;$('#pkcut').style.width=(p*100)+'%';$('#pksc').style.left=`calc(${p*100}% - 14px)`;
      if(Math.random()<.3)sparks(e.clientX-$('#bstage').getBoundingClientRect().left,r.top+r.height*0.14-$('#bstage').getBoundingClientRect().top,2,['#fff','#ffe36b']);
      if(BST.cut>0.92)tear();}});
  pk.addEventListener('pointerup',()=>{const d=BST&&BST.down;if(!d||BST.phase!=='pack')return;BST.down=null;
    if(d.moved<12&&performance.now()-d.t<500)autoCut();});
}
function autoCut(){if(BST.phase!=='pack')return;BST.phase='cutting';const cut=$('#pkcut'),sc=$('#pksc');let p=0;
  const step=()=>{p+=0.06;cut.style.width=Math.min(100,p*100)+'%';sc.style.left=`calc(${Math.min(100,p*100)}% - 14px)`;if(p<1)requestAnimationFrame(step);else tear();};step();}
function tear(){if(BST.phase==='open')return;BST.phase='open';const pk=$('#pack');pk.classList.remove('idle');pk.classList.add('opened','shake');
  const r=pk.getBoundingClientRect(),sr=$('#bstage').getBoundingClientRect();sparks(r.left-sr.left+r.width/2,r.top-sr.top+r.height*0.14,26,['#ffe36b','#b77cff','#4fd0d3','#a6d84a','#fff']);
  pk.querySelector('.pk-top').classList.add('off');if(COL.packs&&COL.packs.length)COL.packs.shift();else COL.boosters--;BST.cards.forEach(id=>{BST.newIds=BST.newIds||[];if(!COL.members[id])BST.newIds.push(id);COL.members[id]=(COL.members[id]||0)+1;});saveCol();
  $('#bcount').textContent=`🎁 ${packCount()} à ouvrir`;$('#bhint').textContent='';
  setTimeout(()=>{pk.classList.add('out');const w=$('#pkwrap');w.style.transform='';w.style.pointerEvents='none';setTimeout(()=>w.remove(),800);showStack();},650);}
function showStack(){const st=$('#bstage');const stack=document.createElement('div');stack.className='cstack';st.appendChild(stack);
  const fresh=new Set();
  BST.cards.slice().reverse().forEach((id,k)=>{const m=MEMBERS[memIdx(id)],i=BST.cards.length-1-k;const isNew=BST.newIds.includes(id)&&!fresh.has(id);if(isNew)fresh.add(id);
    const f=document.createElement('div');f.className=`fcard rise g${m.r}${i>0?' wait':''}`;f.style.setProperty('--wrap',`url(${WRAP})`);f.addEventListener('animationend',ev=>{if(ev.animationName==='cardrise')f.classList.remove('rise');});f.style.animationDelay=(0.15+k*0.07)+'s';f.style.zIndex=10-i;f.dataset.i=i;
    f.innerHTML=`<div class="fglow"></div><div class="fin"><div class="fback"><img src="${LOGO}" alt=""></div><div class="fface">${memberHTML(id,true)}</div></div><div class="rtag">${m.r==='L'?'✨ LÉGENDAIRE ✨':m.r==='E'?'ÉPIQUE !':''}</div>${isNew?'<div class="ntag">NOUVEAU</div>':''}`;
    stack.appendChild(f);});
  BST.phase='reveal';BST.i=0;BST.flipped=false;$('#bhint').textContent='Touche pour retourner la carte';
  stack.addEventListener('click',onStackTap);}
function onStackTap(){if(BST.phase!=='reveal')return;const f=document.querySelector(`.fcard[data-i="${BST.i}"]`);if(!f)return;
  if(!BST.flipped){f.classList.add('flip');BST.flipped=true;const m=MEMBERS[memIdx(BST.cards[BST.i])];
    if(m.r!=='R'){const r=f.getBoundingClientRect(),sr=$('#bstage').getBoundingClientRect();setTimeout(()=>sparks(r.left-sr.left+r.width/2,r.top-sr.top+r.height/2,m.r==='L'?50:24,m.r==='L'?['#ffe36b','#fff3a0','#fff']:['#b77cff','#d6b4ff','#fff']),300);}
    $('#bhint').textContent=BST.i<BST.cards.length-1?`Carte ${BST.i+1}/${BST.cards.length} · touche pour la suivante`:'Touche pour voir ton booster';}
  else{f.classList.remove('rise');f.style.animation='none';f.classList.add('away');BST.i++;const nx=document.querySelector(`.fcard[data-i="${BST.i}"]`);if(nx){nx.classList.remove('wait');nx.style.animation='none';void nx.offsetWidth;nx.style.animation='';nx.classList.add('rise');}BST.flipped=false;
    if(BST.i>=BST.cards.length)setTimeout(summary,350);else $('#bhint').textContent='Touche pour retourner la carte';}}
function summary(){BST.phase='done';const st=$('#bstage');st.innerHTML='';$('#bhint').textContent='';
  const seen=new Set();

/* ================= CLASSEMENTS ================= */
/* Mesure par mini-jeu : temps de victoire (plus court = mieux) ou points (plus = mieux) */
const METRIC={ethan:{t:'pts',u:'soulevés'},christine:{t:'pts',u:'%'},bonus:{t:'pts',u:'pts'},laetitia:{t:'wins',u:'victoires'}};
const metricOf=k=>METRIC[k]||{t:'time',u:'s'};
COL.best=COL.best||{};COL.wins_n=COL.wins_n||{};
let BOARD={},boardRef=null,myId=null,USER=null,rkTab='time',rkGame=null,pendingScore=null,gameT0=0;
function fmtVal(k,v){const m=metricOf(k);if(v==null)return '–';if(m.t==='time'){const mm=Math.floor(v/60),ss=(v%60).toFixed(1);return mm?`${mm} min ${ss.padStart(4,'0')} s`:`${ss} s`;}return `${v} ${m.t==='wins'&&v<2?'victoire':m.u}`;}
function better(k,a,b){if(b==null)return true;return metricOf(k).t==='time'?a<b:a>b;}
function cardCount(){return ownedMG()+MEMBERS.filter(m=>COL.members[m.id]).length;}
function recordResult(k,win){if(!win)return;const m=metricOf(k);let v;
  if(m.t==='time')v=Math.round((performance.now()-gameT0)/100)/10;
  else if(m.t==='wins'){COL.wins_n[k]=(COL.wins_n[k]||0)+1;v=COL.wins_n[k];}
  else v=pendingScore;
  if(v!=null&&(m.t==='wins'||better(k,v,COL.best[k]))){COL.best[k]=v;saveCol();pushBoard();}}
let pushT=0;
function pushBoard(){if(!boardRef)return;clearTimeout(pushT);pushT=setTimeout(()=>{boardRef.set({best:Object.assign({},COL.best),cards:cardCount(),dups:myDoubles().map(x=>x.id),at:Date.now()}).catch(()=>{});},400);}
(async function rkInit(){try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use('db'),u=await window.claude.use('user');if(!db||!u)return;
  USER=u;myId=await u.id();if(!myId)return;boardRef=db.doc('board/'+myId);pushBoard();
  db.collection('board').onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data();});BOARD=o;if($('#ranks').classList.contains('active'))buildRanks();},()=>{});
}catch(_){boardRef=null;}})();
async function nameOf(ids){const out={};if(USER&&ids.length){try{const ps=await USER.profiles(ids);ids.forEach(i=>out[i]=(ps[i]&&ps[i].name)||'Joueur');return out;}catch(_){}}
  ids.forEach(i=>out[i]=i===myId?'Toi':'Joueur');return out;}
function rows(){const r=Object.entries(BOARD).map(([id,d])=>({id,d:d||{}}));
  if(!r.some(x=>x.id===myId))r.push({id:myId||'local',d:{best:COL.best,cards:cardCount()}});return r;}
function rankList(k){const m=metricOf(k),valOf=r=>r.d.best&&r.d.best[k];
  return rows().filter(r=>valOf(r)!=null).sort((a,b)=>m.t==='time'?valOf(a)-valOf(b):valOf(b)-valOf(a)).map(r=>({id:r.id,v:valOf(r)}));}

function esc(t){const e=document.createElement('span');e.textContent=t;return e.innerHTML;}
async function buildRanks(){

    $('#rkList').querySelectorAll('.rkg-head').forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.k;rkGame=rkGame===k?null:k;buildRanks().then(()=>{const el=$(`.rkgame[data-k="${k}"]`);if(el&&rkGame)el.scrollIntoView({block:'nearest',behavior:'smooth'});});});

/* gifts/all et gifts/<id> : écrits par le propriétaire seulement, cumulatifs ; chaque joueur retient ce qu'il a déjà reçu */
COL.got=COL.got||{all:0,me:0,cards:0};
let DB=null,IS_ADMIN=false,GIFTS={},ADM={tab:'gift',to:'all',mode:'boost',n:1,msg:'',card:null};
(async function giftInit(){try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use('db'),u=await window.claude.use('user');if(!db||!u)return;DB=db;
  IS_ADMIN=await u.isOwner();if(IS_ADMIN){$('#openAdmin').hidden=false;db.collection('gifts').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());GIFTS=o;if($('#admin').classList.contains('active'))buildAdmin();},()=>{});}
  const id=await u.id();if(!id)return;
  const check=async()=>{const a=await db.doc('gifts/all').get(),m=await db.doc('gifts/'+id).get();claimGifts(a.exists?a.data():{},m.exists?m.data():{});};
  check();setInterval(check,60000);
}catch(_){}})();
function claimGifts(all,me){const out=[];let nb=0;
  const ab=(all.boosters||0)-(COL.got.all||0);if(ab>0){nb+=ab;COL.got.all=all.boosters;if(all.msg)out.push(all.msg);}
  const mb=(me.boosters||0)-(COL.got.me||0);if(mb>0){nb+=mb;COL.got.me=me.boosters;if(me.msg)out.push(me.msg);}
  const cl=(me.cards||[]).slice(COL.got.cards||0);const cards=[];cl.forEach(c=>{if(memIdx(c.id)>=0){COL.members[c.id]=(COL.members[c.id]||0)+1;cards.push({id:c.id,msg:c.msg||''});}});COL.got.cards=(me.cards||[]).length;
  if(!nb&&!cards.length)return;COL.boosters=(COL.boosters||0)+nb;saveCol();updBoostBtn();
  const pages=[];if(nb)pages.push({t:'boost',n:nb,msgs:[...new Set(out)]});cards.forEach(c=>pages.push({t:'card',id:c.id,msg:c.msg}));
  giftShow(pages);}
function giftShow(pages){let i=0;const pop=document.createElement('div');pop.className='giftpop';$('#app').appendChild(pop);
  const dots=()=>pages.length>1?`<div class="gc-dots">${pages.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`:'';
  function render(){const pg=pages[i],last=i===pages.length-1;
    if(pg.t==='boost'){pop.innerHTML=`<div class="gcard"><div class="emo">🎁</div><h3>Un cadeau pour toi !</h3>
      <p><b>${pg.n} booster${pg.n>1?'s':''}</b> ${pg.n>1?'ont été ajoutés':'a été ajouté'} à ta collection.</p>

function buildSelect(){
  const w=wins();$('#colCount').textContent=`(${ownedMG()}/${MG_ORDER.length})`;
  const card=k=>{const c=CHARS[k];return`<button class="char" data-k="${k}">
      ${w[k]?'<span class="badge" aria-label="Mini-jeu réussi">🏆</span>':''}
      <div class="avwrap" style="background:${c.bg}">${charArt(c)}</div>
      <div class="nm">${c.name}</div><div class="gm">${c.game}</div></button>`;};
  const main=ORDER.filter(k=>k!=='bonus');
  $('#grid').innerHTML=main.map(card).join('')+
    `<div class="char soon"><div class="q">?</div><div class="gm">D'autres persos arrivent…</div></div>`+card('bonus');
  $('#grid').querySelectorAll('button.char').forEach(b=>b.onclick=()=>openIntro(b.dataset.k));
}
function openIntro(k){
  curKey=k;const c=CHARS[k];
  $('#introAv').innerHTML=charArt(c);$('#introName').textContent=c.name;
  const b=$('#bubbleText');b.textContent='';$('#goBtn').classList.remove('show');
  clearInterval(typing);let n=0;
  typing=setInterval(()=>{n++;b.textContent=c.line.slice(0,n);if(n>=c.line.length){clearInterval(typing);typing=null;$('#goBtn').classList.add('show');}},32);
  show('intro');
}
$('#intro').addEventListener('click',()=>{
  if(typing){clearInterval(typing);typing=null;$('#bubbleText').textContent=CHARS[curKey].line;$('#goBtn').classList.add('show');return;}
  startGame(curKey);
});

const api={
  score(v){pendingScore=v;},
  hud(t){const h=$('#hudInfo');if(h.textContent!==t)h.textContent=t;},
  unlock(){if(saveWin(curKey))freshCard=curKey;},
  end(win,title,msg){if(ended)return;ended=true;try{recordResult(curKey,win);}catch(_){}pendingScore=null;if(win&&saveWin(curKey))freshCard=curKey;const fc=freshCard;freshCard=null;
    setTimeout(()=>{$('#endEmo').textContent=win?'🏆':'💦';$('#endTitle').textContent=title;$('#endMsg').textContent=msg;
      const ec=$('#endCard');const rw=fc?winRewards(fc):[];ec.innerHTML=(fc?`<div class="newcard">🃏 Nouvelle carte !${cardHTML(fc,false)}</div>`:'')
        +(rw.length?`<div class="rewbox">${rw.map(r=>`<div class="rew"><span>${r.e}</span>${r.t}</div>`).join('')}<button class="btn" id="rewOpen">Ouvrir maintenant 🎁</button></div>`:'');
      const ro=ec.querySelector('#rewOpen');if(ro)ro.onclick=()=>{$('#end').classList.remove('show');stopGame();goAlbumMembers();openBooster();};
      const nc=ec.querySelector('.tcard');if(nc)nc.onclick=()=>openCard(nc);
      $('#end').classList.add('show');$('#again').focus();},400);}
};
function startGame(k){
  stopGame();curKey=k;show('game');$('#hudTitle').textContent=CHARS[k].game;$('#end').classList.remove('show');
  const st=$('#stage');st.innerHTML='';ended=false;
  pendingScore=null;gameT0=performance.now();current=GAMES[k](st,api);last=performance.now();raf=requestAnimationFrame(tick);
}
function tick(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  if(current){if(!ended&&current.update)current.update(dt);if(current.draw)current.draw();}
  raf=requestAnimationFrame(tick);
}
function stopGame(){cancelAnimationFrame(raf);if(current&&current.destroy)current.destroy();current=null;}
function toSelect(){stopGame();$('#end').classList.remove('show');buildSelect();show('select');}
$('#quit').onclick=toSelect;$('#toSel').onclick=toSelect;$('#again').onclick=()=>startGame(curKey);
})();
</script>
</body>
</html>
