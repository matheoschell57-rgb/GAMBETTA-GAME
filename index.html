/* ================= MINI-JEU 1 : ROLAND ================= */
function gameRoland(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;
  const TOTAL=8,DUR=45;
  let time=DUR,saved=0,over=false,t=0,spawnT=1,spawned=0;
  const roland=svgImg(avatar(CHARS.roland.look));
  const heads=[];for(let i=0;i<TOTAL;i++){const l=randLook();heads.push({img:svgImg(avatar(l,{viewBox:'30 20 140 140'})),skin:l.skin});}
  const sw=[],fx=[];const buoy={st:'idle',y:0,carry:null};
  function geo(){const dy=cv.H*0.24,rh=Math.min(dy*1.2,160),rw=rh*200/230,bx=cv.W/2+rw*0.3;return{dy,rh,rw,bx,oy:dy-rh*0.18};}
  const laneY=i=>{const g=geo(),top=g.dy+(cv.H-g.dy)*0.16,bot=cv.H-(cv.H-g.dy)*0.1;return top+(bot-top)*i/3;};
  function spawn(){
    const used=sw.filter(s=>s.st==='swim').map(s=>s.lane);const free=[0,1,2,3].filter(l=>!used.includes(l));
    const h=heads[spawned];
    sw.push({lane:free.length?pick(free):Math.floor(Math.random()*4),x:-50-Math.random()*60,v:55+Math.random()*55,ph:Math.random()*6,img:h.img,skin:h.skin,st:'swim'});
    spawned++;
  }
  spawn();spawn();
  const onDown=e=>{e.preventDefault();if(!over&&buoy.st==='idle')buoy.st='down';};
  cv.c.addEventListener('pointerdown',onDown);
  const hud=()=>api.hud(`⏱ ${Math.ceil(time)}s  🛟 ${saved}/${TOTAL}`);hud();

  function drawSwimmer(s,x,y,carried){
    const r=26;
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(x,y+r*0.8,r*1.5,r*0.45,0,0,7);ctx.fill();
    ctx.lineCap='round';
    [-1,1].forEach(sd=>{
      const ex=x+sd*(r*1.15+Math.sin(s.ph*2+sd)*5),eyy=carried?y+r*0.1:y-r*0.95+Math.sin(s.ph*2+sd*1.5)*8;
      ctx.strokeStyle=INK;ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(x+sd*r*0.6,y+r*0.6);ctx.lineTo(ex,eyy);ctx.stroke();
      ctx.strokeStyle=s.skin;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x+sd*r*0.6,y+r*0.6);ctx.lineTo(ex,eyy);ctx.stroke();
    });
    drawImg(ctx,s.img,x-r,y-r,r*2,r*2);
    
    if(!carried&&Math.sin(s.ph*0.35)>0.55)bubbleText(ctx,x,y-r-16,"À l'aide !");
  }
  function drawBuoy(x,y,r){
    ctx.lineWidth=r*0.62;
    for(let k=0;k<4;k++){ctx.strokeStyle=k%2?'#fff':'#ff4d4d';ctx.beginPath();ctx.arc(x,y,r,k*Math.PI/2,(k+1)*Math.PI/2);ctx.stroke();}
    ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(x,y,r*1.31,0,7);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*0.69,0,7);ctx.stroke();
  }
  return{
    update(dt){
      if(over)return;t+=dt;time-=dt;
      const g=geo(),scale=Math.max(.8,cv.W/400),boost=1+saved*0.07;
      for(const s of sw){s.ph+=dt*5;if(s.st==='swim'){s.x+=s.v*scale*boost*dt;if(s.x>cv.W+50){s.x=-50;s.lane=(s.lane+1+Math.floor(Math.random()*3))%4;}}}
      if(sw.filter(s=>s.st!=='saved').length<3&&spawned<TOTAL){spawnT-=dt;if(spawnT<=0){spawn();spawnT=1.2;}}
      if(buoy.st==='idle')buoy.y=g.oy;
      else if(buoy.st==='down'){
        buoy.y+=cv.H*1.05*dt;
        for(const s of sw){if(s.st!=='swim')continue;const sy=laneY(s.lane);
          if(Math.abs(s.x-g.bx)<36&&Math.abs(sy-buoy.y)<26){s.st='carried';buoy.carry=s;buoy.st='up';fx.push({x:g.bx,y:sy-40,txt:'Attrapé !',t:0});break;}}
        if(buoy.y>cv.H-8)buoy.st='up';
      }else if(buoy.st==='up'){
        buoy.y-=cv.H*(buoy.carry?0.75:1.1)*dt;
        if(buoy.carry)buoy.carry.x+=(g.bx-buoy.carry.x)*Math.min(1,dt*10);
        if(buoy.y<=g.oy){
          buoy.y=g.oy;
          if(buoy.carry){buoy.carry.st='saved';saved++;fx.push({x:g.bx,y:g.oy-30,txt:'+1 sauvé !',t:0,c:'#7dffa8'});
            if(saved>=TOTAL){over=true;hud();api.end(true,'Bravo !',`Roland a sauvé tout le monde en ${Math.round(DUR-time)} secondes. Napoléon serait fier !`);}}
          buoy.carry=null;buoy.st='idle';
        }
      }
      for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>1.2)fx.splice(i,1);}
      if(!over&&time<=0){time=0;over=true;api.end(false,'Trop tard !',`Roland en a sauvé ${saved} sur ${TOTAL}. Il faut tous les ramener avant la fin du chrono !`);}
      hud();
    },
    draw(){
      const W=cv.W,H=cv.H,g=geo();ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#ece8df';ctx.fillRect(0,0,W,g.dy);
      ctx.strokeStyle='rgba(160,120,70,.25)';ctx.lineWidth=2;
      for(let x=0;x<W;x+=34){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,g.dy);ctx.stroke();}
      for(let y=0;y<g.dy;y+=34){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      drawHall(ctx,0,0,W,g.dy*0.6);const gr=ctx.createLinearGradient(0,g.dy,0,H);gr.addColorStop(0,'#4fd0d3');gr.addColorStop(1,'#1b9fb2');ctx.fillStyle=gr;ctx.fillRect(0,g.dy,W,H-g.dy);
      ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=3;
      for(let k=0;k<7;k++){const yy=g.dy+(H-g.dy)*(k+0.5)/7;ctx.beginPath();for(let x=0;x<=W;x+=12){const y=yy+Math.sin(x*0.04+t*2+k)*4;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
      for(let i=0;i<3;i++){const y=(laneY(i)+laneY(i+1))/2;for(let x=8,n=0;x<W;x+=18,n++){ctx.fillStyle=n%2?'#ff5d5d':'#ffd21f';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();}}
      ctx.fillStyle='#fff';ctx.fillRect(0,g.dy-6,W,10);for(let k=0;k<5;k++){const bx=W*(0.1+k*0.2)-14;if(Math.abs(bx+14-geo().bx)<40)continue;rr(ctx,bx,g.dy-16,28,12,3);ctx.fillStyle='#2f6fd0';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();ctx.fillStyle='#fff';ctx.font='700 9px Fredoka, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(k+1),bx+14,g.dy-10);}ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,g.dy+4);ctx.lineTo(W,g.dy+4);ctx.stroke();
      if(buoy.st==='idle'){ctx.save();ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(g.bx,g.oy+20);ctx.lineTo(g.bx,H);ctx.stroke();ctx.restore();}
      for(const s of sw){if(s.st==='saved'||s.st==='carried')continue;drawSwimmer(s,s.x,laneY(s.lane)+Math.sin(s.ph)*3,false);}
      drawImg(ctx,roland,g.bx-g.rw-2,g.dy-g.rh+8,g.rw,g.rh);
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(g.bx-g.rw*0.2,g.dy-g.rh*0.22);ctx.lineTo(g.bx,buoy.y);ctx.stroke();
      if(buoy.carry)drawSwimmer(buoy.carry,buoy.carry.x,buoy.y+8,true);
      drawBuoy(g.bx,buoy.y,15);
      for(const f of fx)floatText(ctx,f);
      if(t<4)bubbleText(ctx,W/2,H-30,'Touche l\'écran pour lancer la bouée !',15);
    },
    destroy(){cv.c.removeEventListener('pointerdown',onDown);cv.destroy();}
  };
}

/* ================= MINI-JEU 2 : CHRISTIAN ================= */
function gameChristian(stage,api){
  const list=makePeople(8).map(p=>Object.assign({},p,{cap:pick(CAPS)}));
  const n=list.length;let i=0,score=0,lock=true,over=false,pc,dots;
  const hud=()=>api.hud(`👤 ${Math.min(i+1,n)}/${n}  ⭐ ${score}`);
  function memo(){
    api.hud('🧠 Mémorise');
    stage.innerHTML=`<div class="cardgame"><div class="memo-title">Retiens qui a des cheveux !</div>
      <div class="memo-grid">${list.map(p=>`<div class="mini">${avatar(p.look)}<div class="mini-nm">${p.name}</div></div>`).join('')}</div>
      <button class="btn" id="ready">C'est bon, j'ai retenu !</button></div>`;
    stage.querySelector('#ready').onclick=play;
  }
  function play(){
    stage.innerHTML=`<div class="cardgame"><div class="dots">${list.map(()=>'<span></span>').join('')}</div>
      <div class="cardwrap"><div class="pcard" id="pc"></div></div>
      <div class="hint">Glisse la carte ou touche un bouton</div>
      <div class="choices"><button class="choice left" id="bl">⬅ Pas de<br>cheveux</button><button class="choice right" id="br">Des<br>cheveux ➡</button></div></div>`;
    pc=stage.querySelector('#pc');dots=stage.querySelectorAll('.dots span');
    stage.querySelector('#bl').onclick=()=>answer(false);stage.querySelector('#br').onclick=()=>answer(true);
    bindSwipe(pc,()=>lock||over,answer);show();
  }
  function show(){
    const p=list[i];
    pc.innerHTML=`<div class="avbox">${avatar(Object.assign({},p.look,{cap:p.cap}))}</div><div class="nameplate">${p.name}</div><div class="verdict"></div>`;
    pc.style.transform='';pc.classList.remove('enter');void pc.offsetWidth;pc.classList.add('enter');lock=false;hud();
  }
  function answer(hair){
    if(lock||over)return;lock=true;const p=list[i];const ok=hair===p.hair;if(ok)score++;
    dots[i].classList.add(ok?'ok':'ko');pc.classList.remove('enter');
    pc.style.transform=`translateX(${hair?40:-40}px) rotate(${hair?6:-6}deg)`;
    setTimeout(()=>{
      pc.style.transform='';const box=pc.querySelector('.avbox');box.innerHTML=avatar(p.look);box.classList.add('reveal');
      const v=pc.querySelector('.verdict');v.textContent=(ok?'✅ ':'❌ ')+(p.hair?'Des cheveux !':'Pas un cheveu !');v.className='verdict show '+(ok?'good':'bad');hud();
    },180);
    setTimeout(next,1500);
  }
  function next(){
    i++;
    if(i>=n){over=true;i=n-1;hud();const perfect=score===n;
      api.end(perfect,perfect?'Sans-faute !':'Presque !',`${score} bonnes réponses sur ${n}.`+(perfect?' Christian approuve, bonnet bien vissé !':' Il faut un sans-faute pour gagner.'));return;}
    show();
  }
  memo();
  return{destroy(){over=true;}};
}

/* ================= MINI-JEU 3 : LAETITIA ================= */
function gameLaetitia(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const DUR=40,MAX=3;
  let time=DUR,el=0,over=false,nextT=2,t=0;
  const pool=()=>{const pw=cv.W*0.6,ph=Math.min(cv.H*0.48,cv.W*0.95);return{x:(cv.W-pw)/2,y:cv.H*0.22,w:pw,h:ph};};
  const POSTS=[['t',0.25],['t',0.75],['l',0.5],['r',0.5],['b',0.25],['b',0.75]];
  function postPos(p,P){const m=34;
    if(p[0]==='t')return{x:P.x+P.w*p[1],y:P.y-m,nx:0,ny:-1};
    if(p[0]==='b')return{x:P.x+P.w*p[1],y:P.y+P.h+m,nx:0,ny:1};
    if(p[0]==='l')return{x:P.x-m,y:P.y+P.h*p[1],nx:-1,ny:0};
    return{x:P.x+P.w+m,y:P.y+P.h*p[1],nx:1,ny:0};}
  const staff=POSTS.map(p=>({p,dx:0,dy:0,st:'post',ux:0,uy:0,ph:Math.random()*6,say:'',
    img:svgImg(avatar(randLook({shirt:PINK,logo:true,whistle:true,beard:false,mustache:false,hair:pick(['short','long','curly','bun','pigtails'])})))}));
  const kids=[0,1,2,3].map(i=>{const l=randLook({hair:pick(['short','pigtails','curly']),beard:false,mustache:false,glasses:false,freckles:true});
    return{lane:i,f:Math.random(),d:Math.random()<.5?1:-1,v:0.15+Math.random()*0.12,ph:Math.random()*6,skin:l.skin,img:svgImg(avatar(l,{viewBox:'30 20 140 140'}))};});
  const laet=svgImg(avatar(CHARS.laetitia.look));const fx=[];
  const away=()=>staff.filter(s=>s.st==='leave').length;
  const hud=()=>api.hud(`⏱ ${Math.ceil(time)}s  🚨 ${away()}/${MAX}`);hud();
  function depart(){
    const c=staff.filter(s=>s.st==='post');if(!c.length)return;const s=pick(c);const pp=postPos(s.p,pool());
    const ang=(Math.random()<.5?-1:1)*(0.9+Math.random()*0.5);
    s.ux=pp.nx*Math.cos(ang)-pp.ny*Math.sin(ang);s.uy=pp.nx*Math.sin(ang)+pp.ny*Math.cos(ang);
    s.st='leave';s.say=pick(['Pause !','Je reviens !','Café ?','2 minutes !','Toilettes !','Snap !']);
  }
  const onDown=e=>{
    e.preventDefault();if(over)return;const q=cv.pt(e),P=pool();let best=null,bd=48;
    for(const s of staff){if(s.st!=='leave')continue;const pp=postPos(s.p,P);const d=Math.hypot(pp.x+s.dx-q.x,pp.y+s.dy-5-q.y);if(d<bd){bd=d;best=s;}}
    if(best){best.st='back';const pp=postPos(best.p,P);fx.push({x:pp.x+best.dx,y:pp.y+best.dy-40,txt:'Au boulot !',t:0});hud();}
  };
  cv.c.addEventListener('pointerdown',onDown);
  return{
    update(dt){
      if(over)return;t+=dt;el+=dt;time-=dt;
      const spd=(22+el*1.6)*Math.max(.8,cv.W/400);
      nextT-=dt;if(nextT<=0){depart();nextT=Math.max(0.5,2.3-el*0.045)*(0.7+Math.random()*0.6);}
      const P=pool();
      for(const s of staff){
        s.ph+=dt*6;const pp=postPos(s.p,P);
        if(s.st==='leave'){
          s.dx+=s.ux*spd*dt;s.dy+=s.uy*spd*dt;let x=pp.x+s.dx,y=pp.y+s.dy;
          if(x<20||x>cv.W-20){s.ux*=-1;s.dx=Math.max(20,Math.min(cv.W-20,x))-pp.x;}
          if(y<34||y>cv.H-20){s.uy*=-1;s.dy=Math.max(34,Math.min(cv.H-20,y))-pp.y;}
          x=pp.x+s.dx;y=pp.y+s.dy;
          if(x>P.x-10&&x<P.x+P.w+10&&y>P.y-10&&y<P.y+P.h+10){s.dx-=s.ux*spd*dt*2;s.dy-=s.uy*spd*dt*2;s.ux*=-1;s.uy*=-1;}
        }else if(s.st==='back'){
          const d=Math.hypot(s.dx,s.dy),step=320*dt;
          if(d<=step){s.dx=0;s.dy=0;s.st='post';}else{s.dx-=s.dx/d*step;s.dy-=s.dy/d*step;}
        }
      }
      for(const k of kids){k.f+=k.d*k.v*dt;if(k.f>1){k.f=1;k.d=-1;}if(k.f<0){k.f=0;k.d=1;}k.ph+=dt*6;}
      for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>1.2)fx.splice(i,1);}
      if(away()>=MAX){over=true;hud();api.end(false,'Panique au bassin !','Trop de postes vides : les enfants ne sont plus surveillés. Laetitia va devoir se lever…');return;}
      if(time<=0){time=0;over=true;hud();api.end(true,'Bravo !',"Les enfants ont été surveillés jusqu'au bout, et Laetitia n'a pas levé le petit doigt !");return;}
      hud();
    },
    draw(){
      const W=cv.W,H=cv.H,P=pool();ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#e6f3f8';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(60,140,180,.18)';ctx.lineWidth=2;
      for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      rr(ctx,P.x-8,P.y-8,P.w+16,P.h+16,22);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
      const gr=ctx.createLinearGradient(0,P.y,0,P.y+P.h);gr.addColorStop(0,'#55d4d6');gr.addColorStop(1,'#1e9db1');
      rr(ctx,P.x,P.y,P.w,P.h,16);ctx.fillStyle=gr;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();

        drawImg(ctx,k.img,x-r,y-r,r*2,r*2);
        
      }

/* ================= MINI-JEU 4 : MARCEL ================= */
/* lvl de 0 (début, signes évidents) à 1 (fin, un seul petit signe) */
function makeClient(tp,lvl){
  const b=randLook({sunglasses:false});
  const decoy=()=>{const r=Math.random();if(r<.25)b.sunglasses=true;else if(r<.5)b.hat=pick(SHIRTS);else if(r<.6)b.earrings=true;};
  const nSigns=lvl<.34?3:lvl<.67?2:1;
  if(tp==='kid'){
    Object.assign(b,{kid:true,kidScale:lvl<.5?.7:.8,hair:pick(['short','pigtails','curly']),beard:false,mustache:false,glasses:false});
    const extra=shuffle(['freckles','star','lollipop']).slice(0,Math.max(0,nSigns-1));extra.forEach(k=>b[k]=true);
    if(lvl>.5)decoy();
  }else if(tp==='swimmer'){
    const signs=shuffle(['cap','goggles','towel']).slice(0,nSigns);
    signs.forEach(k=>b[k]=k==='cap'?pick(CAPS):true);
    if(!b.cap&&Math.random()<.4)decoy();
  }else if(tp==='drunk'){
    b.glasses=false;shuffle(['sleepy','flush','redNose','hic','wob']).slice(0,nSigns).forEach(k=>b[k]=true);
    if(Math.random()<.4)decoy();
  }else if(tp==='marcel'){
    return Object.assign({},CHARS.marcel.look);
  }else{
    decoy();if(Math.random()<.3)decoy();
  }
  return b;
}
function gameMarcel(stage,api){
  const types=shuffle(['adult','adult','adult','adult','adult','kid','kid','kid','swimmer','swimmer','swimmer','drunk','drunk','drunk','marcel']);
  const N=types.length;
  const clients=types.map((tp,i)=>({tp,look:makeClient(tp,i/(N-1))}));
  let i=0,lock=true,over=false,tl=0,tmax=3;
  const REASON={kid:"C'était un enfant ! Pas de bière pour les petits.",swimmer:"Il allait nager ! Bonnet, lunettes ou serviette : il fallait de l'eau.",
    drunk:"Il avait déjà trop bu ! De l'eau, et vite.",adult:"Cet adulte avait droit à sa bière… Marcel n'est pas content.",
    marcel:"C'était Marcel ! Il voulait SA bière."};
  stage.innerHTML=`<div class="cardgame bar"><div class="dots">${clients.map(()=>'<span></span>').join('')}</div>
    <div class="timer"><div class="fill" id="fill"></div></div>
    <div class="cardwrap"><div class="pcard barcard" id="pc"></div></div>
    <div class="hint">Eau : enfant, nageur ou trop bu. Bière : les autres. Attention aux détails !</div>
    <div class="choices"><button class="choice water" id="bw"><span class="e">💧</span><br>Eau</button><button class="choice beer" id="bb"><span class="e">🍺</span><br>Bière</button></div></div>`;
  const pc=stage.querySelector('#pc'),fill=stage.querySelector('#fill'),dots=stage.querySelectorAll('.dots span');
  stage.querySelector('#bw').onclick=()=>answer(false);stage.querySelector('#bb').onclick=()=>answer(true);
  bindSwipe(pc,()=>lock||over,answer);
  const hud=()=>api.hud(`🍺 ${i}/${N}`);
  function show(){
    const p=clients[i];
    pc.innerHTML=`<div class="avbox ${p.look.wob?'drunkwob':''}">${avatar(p.look)}</div><div class="counter"><div class="glass"></div></div>`;
    pc.style.transform='';pc.classList.remove('enter');void pc.offsetWidth;pc.classList.add('enter');
    tmax=Math.max(1.4,3-i*0.12);tl=tmax;lock=false;hud();
  }
  function answer(beer){
    if(lock||over)return;lock=true;const p=clients[i];const ok=(p.tp==='adult'||p.tp==='marcel')===beer;
    const g=pc.querySelector('.glass');g.textContent=beer?'🍺':'💧';g.classList.add('serve');
    dots[i].classList.add(ok?'ok':'ko');
    if(ok){i++;hud();
      if(i>=N){over=true;setTimeout(()=>api.end(true,'Service parfait !',`${N} clients servis sans erreur. Et il reste de la bière pour Marcel !`),500);}
      else setTimeout(show,450);
    }else{over=true;setTimeout(()=>api.end(false,'Raté !',REASON[p.tp]),550);}
  }
  show();
  return{
    update(dt){
      if(lock||over)return;tl-=dt;const r=Math.max(0,tl/tmax);fill.style.width=(r*100)+'%';
      fill.style.background=r>.5?'#2fb36d':r>.25?'#ffcf33':'#ff6b5b';
      if(tl<=0){over=true;lock=true;dots[i].classList.add('ko');api.end(false,'Trop lent !','Le client est reparti à sec. Il faut décider plus vite !');}
    },
    destroy(){over=true;}
  };
}

/* ================= MINI-JEU 5 : CHRISTOPHE ================= */
function gameChristophe(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;
  const ROUNDS=[{n:25,t:25},{n:45,t:30},{n:70,t:35}];
  const C=CHARS.christophe.look;
  let r=0,time=ROUNDS[0].t,over=false,started=false,t=0,people=[],target=null,fx=[],found=false,reveal=false,roundT=0;
  const isLike=l=>l.hair==='short'&&l.hairColor===C.hairColor&&l.beard&&l.mustache;
  function crowdLook(level){
    let l;
    do{
      l=randLook({sunglasses:Math.random()<.1});if(Math.random()<.35){l.shirt=PINK;l.logo=true;}
      if(Math.random()<0.2+0.15*level){
        shuffle(['hair','color','glasses','mustache']).slice(0,1+level).forEach(k=>{
          if(k==='hair')l.hair='short';if(k==='color')l.hairColor=C.hairColor;if(k==='glasses'){l.beard='short';l.beardColor=C.beardColor;}
          if(k==='mustache'){l.mustache=true;l.mustacheColor=C.mustacheColor;}});
      }
    }while(isLike(l));
    return l;
  }
  const portrait=svgImg(avatar(C,{viewBox:'30 20 140 140'}));
  function build(){
    const W=cv.W,H=cv.H,dk=H*0.34,n=ROUNDS[r].n,gap=r<2?26:21;const pts=[];
    for(let i=0;i<=n;i++){
      let p=null;
      for(let k=0;k<80;k++){
        const inPool=Math.random()<0.6;
        const c=inPool?{x:16+Math.random()*(W-32),y:dk+22+Math.random()*(H-dk-40),head:true}:{x:20+Math.random()*(W-40),y:H*0.12+Math.random()*(dk-H*0.12-4),head:false};
        if(!c.head&&c.x<W*0.2)continue;
        if(c.head&&c.x<W*0.36&&c.y<dk+H*0.12)continue;
        if(pts.every(q=>Math.hypot(q.x-c.x,q.y-c.y)>gap)){p=c;break;}
      }
      if(p)pts.push(p);
    }
    const ti=Math.floor(Math.random()*pts.length);
    people=pts.map((q,i)=>{const me=i===ti;const look=me?C:crowdLook(r);
      return{fx:q.x/W,fy:q.y/H,head:q.head,me,ph:Math.random()*6,
        img:svgImg(q.head?avatar(look,{viewBox:'30 20 140 140'}):avatar(look))};});
    people.sort((a,b)=>a.fy-b.fy);target=people.find(q=>q.me);
    found=false;time=ROUNDS[r].t;roundT=0;
  }
  const pos=q=>{const x=q.fx*cv.W,y=q.fy*cv.H;return q.head?{x,y,cx:x,cy:y}:{x,y,cx:x,cy:y-24};};
  const hud=()=>api.hud(`🔎 ${r+1}/${ROUNDS.length}  ⏱ ${Math.ceil(Math.max(0,time))}s`);
  build();hud();
  const ov=document.createElement('div');ov.className='findme';
  ov.innerHTML=`<div class="fm-card">${avatar(C)}<h3>Voici Christophe</h3><p>Cheveux courts bruns, moustache et petite barbe grisonnante. Retrouve-le dans la foule, 3 fois de suite !</p><button class="btn">Chercher !</button></div>`;
  stage.appendChild(ov);
  ov.querySelector('button').onclick=e=>{e.stopPropagation();ov.remove();started=true;t=0;};
  const onDown=e=>{
    e.preventDefault();if(!started||over||found)return;const q=cv.pt(e);const tp=pos(target);
    if(Math.hypot(tp.cx-q.x,tp.cy-q.y)<22){
      found=true;fx.push({x:tp.cx,y:tp.cy-30,txt:'Trouvé !',t:0,c:'#7dffa8'});
      setTimeout(()=>{if(over)return;r++;
        if(r>=ROUNDS.length){over=true;api.end(true,'Bien joué !','Christophe a été démasqué 3 fois. Il va devoir retourner voir Christian…');}
        else{build();hud();}},1300);
      return;
    }
    if(people.some(p=>{const pp=pos(p);return Math.hypot(pp.cx-q.x,pp.cy-q.y)<20;})){time-=2;fx.push({x:q.x,y:q.y-20,txt:'Pas lui ! -2s',t:0,c:'#ff6b5b'});}
  };
  cv.c.addEventListener('pointerdown',onDown);
  function drawSlide(W,H,dk){
    const tx=W*0.03,tw=W*0.11;
    ctx.fillStyle='#d8dde3';ctx.strokeStyle=INK;ctx.lineWidth=3;
    ctx.fillRect(tx,H*0.05,tw,dk-H*0.05);ctx.strokeRect(tx,H*0.05,tw,dk-H*0.05);
    for(let y=H*0.09;y<dk;y+=12){ctx.beginPath();ctx.moveTo(tx+4,y);ctx.lineTo(tx+tw-4,y);ctx.stroke();}
    const path=()=>{ctx.beginPath();ctx.moveTo(tx+tw*0.6,H*0.06);ctx.bezierCurveTo(W*0.42,H*0.08,W*0.4,H*0.24,W*0.2,H*0.26);ctx.bezierCurveTo(W*0.08,H*0.28,W*0.12,dk+H*0.04,W*0.26,dk+H*0.07);};
    ctx.lineCap='round';
    path();ctx.strokeStyle=INK;ctx.lineWidth=26;ctx.stroke();
    path();ctx.strokeStyle='#ff8a1f';ctx.lineWidth=19;ctx.stroke();path();ctx.strokeStyle='#2f6fd0';ctx.lineWidth=3;ctx.stroke();
    path();ctx.strokeStyle='#ffc27a';ctx.lineWidth=5;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(W*0.27,dk+H*0.08,26,8,0,0,7);ctx.fill();
  }
  return{
    update(dt){
      if(over)return;t+=dt;roundT+=dt;
      for(const p of people)p.ph+=dt*3;
      for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>1.2)fx.splice(i,1);}
      if(started&&!found){time-=dt;
        if(time<=0){time=0;over=true;reveal=true;hud();api.end(false,'Il est trop fort !','Christophe est resté caché… Il était dans le cercle rouge.');return;}}
      hud();
    },
    draw(){
      const W=cv.W,H=cv.H,dk=H*0.34;ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#ece8df';ctx.fillRect(0,0,W,dk);ctx.strokeStyle='rgba(160,120,70,.22)';ctx.lineWidth=2;
      for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,dk);ctx.stroke();}
      for(let y=0;y<dk;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      drawHall(ctx,0,0,W,dk*0.42);const gr=ctx.createLinearGradient(0,dk,0,H);gr.addColorStop(0,'#4fd0d3');gr.addColorStop(1,'#1b9fb2');ctx.fillStyle=gr;ctx.fillRect(0,dk,W,H-dk);
      ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=3;
      for(let k=0;k<8;k++){const yy=dk+(H-dk)*(k+0.5)/8;ctx.beginPath();for(let x=0;x<=W;x+=12){const y=yy+Math.sin(x*0.04+t*2+k)*3;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
      ctx.fillStyle='#fff';ctx.fillRect(0,dk-5,W,9);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,dk+4);ctx.lineTo(W,dk+4);ctx.stroke();
      drawSlide(W,H,dk);
      for(const p of people){
        const q=pos(p);
        if(p.head){const rr_=15,y=q.y+Math.sin(p.ph)*1.5;
          ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(q.x,y+rr_*0.8,rr_*1.4,rr_*0.4,0,0,7);ctx.fill();
          drawImg(ctx,p.img,q.x-rr_,y-rr_,rr_*2,rr_*2);
          
        }else{const w=32,h=37,y=q.y+Math.abs(Math.sin(p.ph))*-1.5;drawImg(ctx,p.img,q.x-w/2,y-h,w,h);}
      }
      if(target&&(found||reveal)){const q=pos(target);ctx.strokeStyle=found?'#2fb36d':'#ff3b3b';ctx.lineWidth=5;ctx.beginPath();ctx.arc(q.cx,q.cy,24+Math.sin(t*8)*3,0,7);ctx.stroke();}
      ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.arc(W-30,30,24,0,7);ctx.fill();ctx.stroke();
      drawImg(ctx,portrait,W-50,10,40,40);
      for(const f of fx)floatText(ctx,f);
      if(started&&roundT<1.6&&!found)bubbleText(ctx,W/2,24,`Manche ${r+1} : trouve Christophe !`,15);
    },
    destroy(){cv.c.removeEventListener('pointerdown',onDown);cv.destroy();}
  };
}

/* ================= MINI-JEU 6 : AGNÈS – le service de l'apéro ================= */
function miniQuiche(ctx,x,y,R,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ctx.fillStyle='#e6b56e';ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.beginPath();
  for(let k=0;k<=20;k++){const a=k/20*Math.PI*2,r=R*(k%2?0.9:1);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#f2b33d';ctx.beginPath();ctx.arc(0,0,R*0.68,0,7);ctx.fill();
  ctx.fillStyle='#ff8fa3';ctx.fillRect(-R*0.3,-R*0.2,R*0.25,R*0.18);ctx.fillRect(R*0.1,R*0.1,R*0.25,R*0.18);
  ctx.fillStyle='#2fb36d';ctx.beginPath();ctx.arc(R*0.15,-R*0.25,R*0.1,0,7);ctx.fill();ctx.restore();
}
function gameAgnes(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const GOAL=15,MAXMISS=5,DUR=60;
  const agnes=svgImg(avatar(CHARS.agnes.look)),marcelImg=svgImg(avatar(CHARS.marcel.look));
  const heads=Array.from({length:8},()=>svgImg(avatar(randLook(),{viewBox:'30 20 140 140'})));
  let time=DUR,el=0,t=0,over=false,served=0,missed=0,cd=0,nextS=0.4,aim=null;
  const sw=[],qs=[],fx=[];const mc={x:-60,dir:1,active:false,next:5,ph:0};
  const geo=()=>{const W=cv.W,H=cv.H;return{W,H,edge:H*0.5,tx:W/2,ty:H*0.84,my:H*0.68};};
  const hud=()=>api.hud(`🥧 ${served}/${GOAL}  😩 ${missed}/${MAXMISS}`);hud();
  function spawn(){const g=geo();
    for(let k=0;k<20;k++){const x=30+Math.random()*(g.W-60),y=g.H*0.1+Math.random()*(g.edge-g.H*0.16);
      if(sw.every(o=>Math.hypot(o.x*g.W-x,o.y*g.H-y)>70)){sw.push({x:x/g.W,y:y/g.H,age:0,life:Math.max(1.9,3.4-el*0.03),img:pick(heads),ph:Math.random()*6});return;}}}
  const down=e=>{e.preventDefault();if(over)return;aim=cv.pt(e);};
  const moveP=e=>{if(aim)aim=cv.pt(e);};
  const up=e=>{e.preventDefault();if(!aim||over){aim=null;return;}const p=cv.pt(e),g=geo();aim=null;if(cd>0)return;
    let dx=p.x-g.tx,dy=p.y-(g.ty-24);if(dy>-10)dy=-10;const l=Math.hypot(dx,dy),v=720*Math.max(.8,g.W/400);
    qs.push({x:g.tx,y:g.ty-24,vx:dx/l*v,vy:dy/l*v,rot:0});cd=0.28;};
  cv.c.addEventListener('pointerdown',down);cv.c.addEventListener('pointermove',moveP);cv.c.addEventListener('pointerup',up);
  return{
    update(dt){
      if(over)return;t+=dt;el+=dt;time-=dt;cd=Math.max(0,cd-dt);const g=geo();
      const maxSw=1+Math.min(3,Math.floor(el/12));nextS-=dt;if(nextS<=0&&sw.length<maxSw){spawn();nextS=Math.max(0.4,1.1-el*0.012);}
      for(let k=sw.length-1;k>=0;k--){const o=sw[k];o.age+=dt;o.ph+=dt*4;
        if(o.age>o.life){missed++;fx.push({x:o.x*g.W,y:o.y*g.H-20,txt:'Il a faim…',t:0,c:'#ff6b5b'});sw.splice(k,1);hud();}}
      if(!mc.active){mc.next-=dt;if(mc.next<=0){mc.active=true;mc.x=mc.dir>0?-40:g.W+40;}}
      else{mc.ph+=dt*8;mc.x+=mc.dir*(70+el*2.2)*Math.max(.8,g.W/400)*dt;
        if((mc.dir>0&&mc.x>g.W+50)||(mc.dir<0&&mc.x<-50)){mc.active=false;mc.dir*=-1;mc.next=Math.max(1,3.5+Math.random()*3-el*0.04);}}
      for(let k=qs.length-1;k>=0;k--){const q=qs[k];q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=dt*10;
        if(mc.active&&Math.hypot(q.x-mc.x,q.y-(g.my-28))<34){fx.push({x:mc.x,y:g.my-70,txt:'Miam ! (Marcel)',t:0,c:'#ff8a3d'});qs.splice(k,1);continue;}
        let hit=-1;for(let m=0;m<sw.length;m++){if(Math.hypot(q.x-sw[m].x*g.W,q.y-sw[m].y*g.H)<28){hit=m;break;}}
        if(hit>=0){const o=sw[hit];served++;fx.push({x:o.x*g.W,y:o.y*g.H-24,txt:'Merci !',t:0,c:'#7dffa8'});sw.splice(hit,1);qs.splice(k,1);hud();continue;}
        if(q.y<-20||q.x<-20||q.x>g.W+20)qs.splice(k,1);}
      for(let k=fx.length-1;k>=0;k--){fx[k].t+=dt;if(fx[k].t>1.2)fx.splice(k,1);}
      if(served>=GOAL){over=true;api.end(true,"L'apéro est servi !",`${GOAL} nageurs régalés de mini-quiches en ${Math.round(DUR-time)} secondes. Agnès est fière de toi !`);return;}
      if(missed>=MAXMISS){over=true;api.end(false,'Ils ont trop faim !',`${MAXMISS} nageurs sont repartis le ventre vide. Les mini-quiches d'Agnès méritaient mieux !`);return;}
      if(time<=0){time=0;over=true;api.end(false,'Fin de l\'apéro !',`Seulement ${served} nageurs servis sur ${GOAL}.`);}

const KNOBS=[[103,172],[196,135],[110,128]];

function gameJacky(stage,api){

  function build(){keys=shuffle(Object.keys(DIFFS)).slice(0,NDIFF);D={};keys.forEach(k=>D[k]=true);found=[];time=ROUNDS[r].t;wait=0;hud();}
  function hud(){api.hud(`🔍 ${found.length}/${NDIFF}  ⏱ ${Math.ceil(Math.max(0,time))}s`);}

    return{W,H,s,ox:(W-bw)/2,y1:lab+4,y2:lab*2+12+avail,bw};}

  return{
    update(dt){

    },
    draw(){

      ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=3;
      for(let k=0;k<6;k++){const yy=dk+(H-dk)*(k+0.5)/6;ctx.beginPath();for(let x=0;x<=W;x+=12){const y=yy+Math.sin(x*0.04+t*2+k)*3;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
      ctx.fillStyle='#fff';ctx.fillRect(0,dk-4,W,9);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,dk+5);ctx.lineTo(W,dk+5);ctx.stroke();
      const chh=Math.min(dk*0.95,110),chw=chh/1.15,x=cx*W;
      if(state==='look'){ctx.fillStyle='rgba(255,60,60,.18)';ctx.beginPath();ctx.moveTo(x,dk-chh*0.6);ctx.lineTo(W*0.12,H);ctx.lineTo(W*0.88,H);ctx.closePath();ctx.fill();}

      drawImg(ctx,state==='look'?chFront:chBack,-chw/2,-chh,chw,chh);ctx.restore();

      if(state==='look')bubbleText(ctx,x,dk-chh-10,'👀 Je surveille !',13);

        ctx.save();ctx.translate(gx,gy);if(talk)ctx.rotate((i?-1:1)*0.12);

      });
      if(talk){ctx.fillStyle='#ff7eb6';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('💬',W/2,H*0.5);}
      const r=Math.min(20,W/20);

        rr(ctx,bx,by,Math.max(3,bw*v),7,3);ctx.fillStyle=v>.5?'#2fb36d':v>.25?'#ffcf33':'#ff3b3b';ctx.fill();rr(ctx,bx,by,bw,7,3);ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();
        if(help)bubbleText(ctx,kx,by-12,'👍',11);else if(v<0.4)bubbleText(ctx,kx,by-12,"À l'aide !",11);}

      rr(ctx,bx,by,Math.max(8,bw*gos/100),16,8);ctx.fillStyle='#ff7eb6';ctx.fill();rr(ctx,bx,by,bw,16,8);ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
      ctx.font='700 12px Fredoka, sans-serif';ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Potins',W/2,by+8);
      for(const f of fx)floatText(ctx,f);

  };

/* ================= CHRISTINE : l'aquaform en rythme ================= */
const MOVES=['Bras en croix','Jumping jack','Genou levé'];
function drawMove(ctx,i,x,y,r){
  const L=(pts)=>{ctx.beginPath();ctx.moveTo(x+pts[0][0]*r,y+pts[0][1]*r);for(let k=1;k<pts.length;k++)ctx.lineTo(x+pts[k][0]*r,y+pts[k][1]*r);ctx.stroke();};
  ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=Math.max(2.5,r*0.13);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.fillStyle='rgba(60,180,230,.55)';ctx.beginPath();ctx.moveTo(x-r*0.85,y+r*0.12);for(let k=0;k<=8;k++)ctx.lineTo(x-r*0.85+k*r*0.2125,y+r*0.12+(k%2?-r*0.06:r*0.06));
  ctx.lineTo(x+r*0.85,y+r*0.7);ctx.lineTo(x-r*0.85,y+r*0.7);ctx.closePath();ctx.fill();
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(x,y-r*0.58,r*0.16,0,7);ctx.fill();
  L([[0,-0.4],[0,0.15]]);
  if(i===0){L([[-0.7,-0.28],[0.7,-0.28]]);L([[-0.18,0.65],[0,0.15],[0.18,0.65]]);}
  else if(i===1){L([[-0.5,-0.8],[0,-0.32],[0.5,-0.8]]);L([[-0.45,0.62],[0,0.15],[0.45,0.62]]);}
  else{L([[-0.42,-0.05],[-0.2,-0.3],[0,-0.32]]);L([[0,-0.32],[0.2,-0.3],[0.42,-0.05]]);L([[0,0.15],[-0.08,0.65]]);L([[0,0.15],[0.38,0.1],[0.36,0.48]]);}
  ctx.restore();
}
function gameChristine(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;
  const BPM=104,BEAT=60/BPM,LEAD=1.6,WIN=0.17,END_B=72;
  const CL=CHARS.christine.look,chr=svgImg(avatar(CL,{viewBox:'30 20 140 140'})),clogo=new Image();clogo.src=LOGO;
  /* Poses : angle 0 = membre vers le bas, PI/2 = à l'horizontale vers l'extérieur, PI = vers le haut */
  const POSES={idle:{a:[0.18,0.08],l:[[0.07,0.02],[0.07,0.02]],j:0},
    0:{a:[1.57,1.57],l:[[0.07,0.02],[0.07,0.02]],j:0},
    1:{a:[2.55,2.85],l:[[0.42,0.42],[0.42,0.42]],j:1},
    2:{a:[0.95,2.5],l:[[0.07,0.02],[1.45,0.15]],j:0.25}};
  const cp=JSON.parse(JSON.stringify(POSES.idle));
  const notes=[];
  for(let b=4;b<=68;b++){
    if(Math.random()<(b<36?0.7:0.85))notes.push({t:b*BEAT,lane:Math.floor(Math.random()*3)});
    if(b>=36&&Math.random()<0.3)notes.push({t:(b+0.5)*BEAT,lane:Math.floor(Math.random()*3)});
  }
  notes.forEach(n=>{n.hit=false;n.miss=false;});
  let ac=null;try{ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(_){ac=null;}
  const clock=()=>ac?ac.currentTime:performance.now()/1000;const t0=clock()+2;const now=()=>clock()-t0;
  if(ac){
    const nb=ac.createBuffer(1,Math.floor(ac.sampleRate*0.05),ac.sampleRate);const dd=nb.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
    const master=ac.createGain();master.gain.value=0.6;master.connect(ac.destination);
    const tone=(at,fr,d,vol,type)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'triangle';o.frequency.value=fr;
      g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+0.01);g.gain.exponentialRampToValueAtTime(0.0001,at+d);o.connect(g).connect(master);o.start(at);o.stop(at+d+0.02);};
    const BASS=[130.8,110,87.3,98];
    for(let b=0;b<=END_B;b++){const at=t0+b*BEAT;
      const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,at);o.frequency.exponentialRampToValueAtTime(45,at+0.15);
      g.gain.setValueAtTime(0.8,at);g.gain.exponentialRampToValueAtTime(0.001,at+0.2);o.connect(g).connect(master);o.start(at);o.stop(at+0.22);
      const sN=ac.createBufferSource();sN.buffer=nb;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const gh=ac.createGain();
      gh.gain.setValueAtTime(0.25,at+BEAT/2);gh.gain.exponentialRampToValueAtTime(0.001,at+BEAT/2+0.05);sN.connect(f).connect(gh).connect(master);sN.start(at+BEAT/2);
      tone(at,BASS[Math.floor(b/4)%4],BEAT*0.9,0.18,'sine');}
    notes.forEach(n=>tone(t0+n.t,[523.3,659.3,784][n.lane],0.15,0.08));
  }
  let hits=0,misses=0,combo=0,pose=1,poseT=0,over=false;const fx=[],flash=[0,0,0];
  const hud=()=>api.hud(`🎵 ${hits} ✅  ${misses} ❌`);hud();
  const geo=()=>{const W=cv.W,H=cv.H,lw=Math.min(W/3.2,120);return{W,H,lw,top:H*0.33,hy:H*0.84,cx:i=>W/2+(i-1)*lw};};
  const onDown=e=>{e.preventDefault();if(over)return;const q=cv.pt(e),g=geo();
    const lane=Math.max(0,Math.min(2,Math.round((q.x-g.W/2)/g.lw)+1));flash[lane]=0.15;const tn=now();
    let best=null,bd=WIN;for(const n of notes){if(n.hit||n.miss||n.lane!==lane)continue;const d=Math.abs(n.t-tn);if(d<bd){bd=d;best=n;}}
    if(best){best.hit=true;hits++;combo++;pose=lane;poseT=0.35;fx.push({x:g.cx(lane),y:g.hy-40,txt:bd<0.07?'Parfait !':'Bien !',t:0,c:bd<0.07?'#7dffa8':'#ffcf33'});}
    else{combo=0;fx.push({x:g.cx(lane),y:g.hy-40,txt:'Hors tempo',t:0,c:'#ff8a3d'});}
    hud();};
  cv.c.addEventListener('pointerdown',onDown);
  return{
    update(dt){
      const tg=poseT>0?POSES[pose]:POSES.idle,kk=Math.min(1,dt*20);
      for(let i=0;i<2;i++){cp.a[i]+=(tg.a[i]-cp.a[i])*kk;for(let j=0;j<2;j++)cp.l[i][j]+=(tg.l[i][j]-cp.l[i][j])*kk;}cp.j+=(tg.j-cp.j)*kk;
      if(over)return;const tn=now();poseT=Math.max(0,poseT-dt);for(let i=0;i<3;i++)flash[i]=Math.max(0,flash[i]-dt);
      for(const n of notes)if(!n.hit&&!n.miss&&tn-n.t>WIN){n.miss=true;misses++;combo=0;hud();}
      for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>1.2)fx.splice(i,1);}
      if(tn>notes[notes.length-1].t+1.2){over=true;const r=Math.round(hits/notes.length*100);
        if(r>=70)api.score(r);api.end(r>=70,r>=70?'Super séance !':'Pas en rythme…',`${r} % des mouvements réussis (${hits}/${notes.length}).`+(r>=70?' Christine est ravie de son cours.':' Il en faut 70 % pour valider le cours.'));}
    },
    draw(){
      const g=geo(),W=g.W,H=g.H,tn=now();ctx.clearRect(0,0,W,H);
      const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#7fd8f7');gr.addColorStop(1,'#1b9fb2');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ece8df';ctx.fillRect(0,0,W,H*0.26);drawHall(ctx,0,0,W,H*0.16);ctx.fillStyle='#fff';ctx.fillRect(0,H*0.26-4,W,8);
      { /* Christine dessinée en entier, avec des membres articulés */
        const u=Math.min(H*0.022,W*0.05),bob=Math.abs(Math.sin(tn*Math.PI/BEAT))*u*0.25;
        const feetY=H*0.26-2-cp.j*u*0.8-bob,cxp=W/2;
        const hipY=feetY-4*u,shY=hipY-3*u,tw=2.5*u,lw=u*0.62;
        const V=(x,y,sd,a,l)=>[x+sd*Math.sin(a)*l,y+Math.cos(a)*l];
        const limbs=[];
        [-1,1].forEach((sd,i)=>{const sx=cxp+sd*tw*0.42,sy=shY+u*0.35,e=V(sx,sy,sd,cp.a[0],1.6*u),h=V(e[0],e[1],sd,cp.a[1],1.5*u);limbs.push({pts:[[sx,sy],e,h],w:lw,arm:1});
          const hx=cxp+sd*tw*0.26,k=V(hx,hipY,sd,cp.l[i][0],2*u),f=V(k[0],k[1],sd,cp.l[i][1],2*u);limbs.push({pts:[[hx,hipY],k,f],w:lw*1.15,arm:0});});
        const stroke=(L,w,c)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(L.pts[0][0],L.pts[0][1]);ctx.lineTo(L.pts[1][0],L.pts[1][1]);ctx.lineTo(L.pts[2][0],L.pts[2][1]);ctx.stroke();};
        const torso=(g,c)=>{ctx.fillStyle=c;rr(ctx,cxp-tw/2-g,shY-g,tw+g*2,3*u+g*2,u*0.8+g);ctx.fill();
          [-1,1].forEach(sd=>{ctx.beginPath();ctx.ellipse(cxp+sd*tw*0.45,shY+u*0.45,u*0.62+g,u*0.52+g,sd*0.5,0,7);ctx.fill();});};
        limbs.filter(L=>!L.arm).forEach(L=>stroke(L,L.w+7,INK));limbs.filter(L=>!L.arm).forEach(L=>stroke(L,L.w,CL.skin));
        ctx.fillStyle=INK;rr(ctx,cxp-tw*0.48-3.5,hipY-u*0.9-3.5,tw*0.96+7,u*1.3+7,u*0.4);ctx.fill();ctx.fillStyle='#2b3a55';rr(ctx,cxp-tw*0.48,hipY-u*0.9,tw*0.96,u*1.3,u*0.4);ctx.fill();
        torso(3.5,INK);limbs.filter(L=>L.arm).forEach(L=>stroke(L,L.w+7,INK));
        torso(0,PINK);limbs.filter(L=>L.arm).forEach(L=>stroke(L,L.w,CL.skin));
        if(clogo.complete&&clogo.naturalWidth)ctx.drawImage(clogo,cxp+tw*0.04,shY+u*0.6,u*1.0,u*0.9);
        limbs.forEach(L=>{const e=L.pts[2];ctx.fillStyle=INK;ctx.beginPath();ctx.arc(e[0],e[1],L.w*0.62+3,0,7);ctx.fill();ctx.fillStyle=CL.skin;ctx.beginPath();ctx.arc(e[0],e[1],L.w*0.62,0,7);ctx.fill();});
        const hs=3.1*u;drawImg(ctx,chr,cxp-hs/2,shY-hs*0.9,hs,hs);
        if(poseT>0)bubbleText(ctx,cxp+tw*1.9,shY-u,MOVES[pose]+' !',11);
      }
      const COL=['#ff7eb6','#ffcf33','#7dffa8'];
      for(let i=0;i<3;i++){const x=g.cx(i);rr(ctx,x-g.lw*0.42,g.top,g.lw*0.84,H-g.top-10,16);ctx.fillStyle=`rgba(255,255,255,${0.12+flash[i]*2})`;ctx.fill();
        ctx.beginPath();ctx.arc(x,g.hy,g.lw*0.3,0,7);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();

      for(const n of notes){if(n.hit)continue;const dtn=n.t-tn;if(dtn>LEAD||dtn<-0.4)continue;
        const y=g.hy-dtn/LEAD*(g.hy-g.top),x=g.cx(n.lane),r=g.lw*0.24;

      for(const f of fx)floatText(ctx,f);

/* ================= ETHAN : Musclor ou Dodu ================= */
function gameEthan(stage,api){

  const hud=()=>api.hud(`⏱ ${Math.ceil(time)}s  🏋️ ${reps}`);hud();
  const onDown=e=>{e.preventDefault();if(over)return;started=true;reps++;b=Math.min(1,b+0.035);lift=1;hud();};

    update(dt){

      if(!started)return;time-=dt;const el=DUR-time;b=Math.max(-1,b-(0.25+el*0.02)*dt);
      if(time<=0){time=0;over=true;hud();
        if(b>=0.35){api.score(reps);api.end(true,'Musclor !',`${reps} soulevés en ${DUR} secondes. Ethan a des bras comme des bouées !`);}

        else api.end(false,'Ni l\'un ni l\'autre',`${reps} soulevés : ni Musclor, ni Dodu. Il faut taper encore plus vite !`);}
      else hud();
    },
    draw(){
      const W=cv.W,H=cv.H;ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#ffeede';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f3d2b0';ctx.fillRect(0,H*0.82,W,H*0.18);
      const sc=Math.min(W/360,H/560),m=Math.max(0,b),f=Math.max(0,-b),cx=W/2,top=H*0.43,th=120*sc,tw=90*sc;

        ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(g.bx,g.by-g.br*0.45,g.len*0.14,g.br*0.18,g.ang,0,7);ctx.fill();});
      A.forEach(dumbbell);

      const torsoShape=(grow,col)=>{ctx.fillStyle=col;rr(ctx,cx-tw/2-grow,top-grow,tw+grow*2,th+grow*2,26*sc+grow);ctx.fill();
        [-1,1].forEach(sd=>{ctx.beginPath();ctx.ellipse(cx+sd*tw*0.46,top+20*sc,19*sc+grow,16*sc+grow,sd*0.5,0,7);ctx.fill();});

        ctx.strokeStyle='rgba(120,10,60,.3)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(bellyR.x,bellyR.y,bellyR.rx*0.85,bellyR.ry*0.85,0,Math.PI*0.2,Math.PI*0.8);ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(bellyR.x-bellyR.rx*0.35,bellyR.y-bellyR.ry*0.35,bellyR.rx*0.25,bellyR.ry*0.15,-0.4,0,7);ctx.fill();}
      if(logo.complete&&logo.naturalWidth)ctx.drawImage(logo,cx+tw*0.06,top+th*0.14,30*sc,27*sc);
      const hs=96*sc;drawImg(ctx,head,cx-hs/2,top-hs*0.88,hs,hs);

/* ================= AUDE : le jus d'orange secret ================= */
function gameAude(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const GOAL=30,MAXMISS=3;
  const aude=svgImg(avatar(CHARS.aude.look));
  let t=0,el=0,over=false,sliced=0,miss=0,nextO=0.6,down=false,last=null;const os=[],halves=[],drops=[],trail=[],fx=[];
  const hud=()=>api.hud(`🍊 ${sliced}/${GOAL}  💔 ${miss}/${MAXMISS}`);hud();
  function spawn(bomb){const W=cv.W,H=cv.H,G=H*1.5,h=H*(0.5+Math.random()*0.3),x=W*(0.15+Math.random()*0.7);
    os.push({bomb:!!bomb,x,y:H+30,vx:(W/2-x)*(0.2+Math.random()*0.5),vy:-Math.sqrt(2*G*h),r:Math.min(30,W/13),rot:Math.random()*6,vr:(Math.random()-.5)*4,G});}
  function cut(o,ang){sliced++;hud();
    [-1,1].forEach(sd=>halves.push({x:o.x,y:o.y,vx:o.vx+sd*Math.cos(ang+Math.PI/2)*120,vy:o.vy*0.3+sd*Math.sin(ang+Math.PI/2)*120,r:o.r,rot:ang+(sd<0?Math.PI:0),vr:sd*3,G:o.G,life:1.6}));
    for(let k=0;k<10;k++)drops.push({x:o.x,y:o.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.8)*300,life:0.6});
    fx.push({x:o.x,y:o.y-30,txt:'Tchak !',t:0,c:'#ffcf33'});
    if(sliced>=GOAL){over=true;api.end(true,'Jus secret réussi !',`${GOAL} oranges pressées : le jus d'Aude est prêt, et la recette reste secrète !`);}}
  const segHit=(ax,ay,bx,by,o)=>{const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;let k=((o.x-ax)*dx+(o.y-ay)*dy)/l2;k=Math.max(0,Math.min(1,k));return Math.hypot(ax+dx*k-o.x,ay+dy*k-o.y)<o.r;};
  const pd=e=>{e.preventDefault();down=true;last=cv.pt(e);trail.length=0;trail.push({x:last.x,y:last.y,a:1});};
  const pm=e=>{if(!down||over)return;const q=cv.pt(e);trail.push({x:q.x,y:q.y,a:1});
    for(let k=os.length-1;k>=0;k--)if(segHit(last.x,last.y,q.x,q.y,os[k])){const o=os.splice(k,1)[0];
      if(o.bomb){over=true;for(let j=0;j<16;j++)drops.push({x:o.x,y:o.y,vx:(Math.random()-.5)*400,vy:(Math.random()-.8)*400,life:0.8,glass:true});fx.push({x:o.x,y:o.y-30,txt:'CRASH !',t:0,c:'#ff3b3b'});
        api.end(false,"De l'alcool dans le jus ?!","Tu as tranché une bouteille… La recette secrète d'Aude est 100 % orange, sans une goutte d'alcool !");break;}
      cut(o,Math.atan2(q.y-last.y,q.x-last.x));if(over)break;}
    last=q;};
  const pu=()=>{down=false;};
  cv.c.addEventListener('pointerdown',pd);cv.c.addEventListener('pointermove',pm);window.addEventListener('pointerup',pu);
  return{
    update(dt){
      if(over)return;t+=dt;el+=dt;const H=cv.H;
      nextO-=dt;if(nextO<=0){const n=el>15&&Math.random()<.4?2+(el>30&&Math.random()<.4?1:0):1;for(let k=0;k<n;k++)spawn(el>6&&Math.random()<Math.min(0.3,0.12+el*0.004));nextO=Math.max(0.55,1.4-el*0.02);}
      for(let k=os.length-1;k>=0;k--){const o=os[k];o.vy+=o.G*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt;
        if(o.vy>0&&o.y>H+40){os.splice(k,1);if(o.bomb)continue;miss++;fx.push({x:Math.max(40,Math.min(cv.W-40,o.x)),y:H-40,txt:'Ratée !',t:0,c:'#ff6b5b'});hud();
          if(miss>=MAXMISS){over=true;api.end(false,'Le jus est raté !',`${MAXMISS} oranges sont retombées dans l'eau. Aude garde sa recette… mais pas le jus.`);return;}}}
      for(let k=halves.length-1;k>=0;k--){const h=halves[k];h.vy+=h.G*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=h.vr*dt;h.life-=dt;if(h.life<=0)halves.splice(k,1);}
      for(let k=drops.length-1;k>=0;k--){const d=drops[k];d.vy+=900*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.life-=dt;if(d.life<=0)drops.splice(k,1);}
      for(let k=trail.length-1;k>=0;k--){trail[k].a-=dt*4;if(trail[k].a<=0)trail.splice(k,1);}
      for(let k=fx.length-1;k>=0;k--){fx[k].t+=dt;if(fx[k].t>1.2)fx.splice(k,1);}
    },
    draw(){
      const W=cv.W,H=cv.H;ctx.clearRect(0,0,W,H);
      drawHall(ctx,0,0,W,H*0.84);
      const wy=H*0.82;const wg=ctx.createLinearGradient(0,wy,0,H);wg.addColorStop(0,'#4fd0d3');wg.addColorStop(1,'#1b9fb2');ctx.fillStyle=wg;ctx.fillRect(0,wy,W,H-wy);
      ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=W;x+=10){const y=wy+Math.sin(x*0.05+t*2)*3;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
      const aw=Math.min(70,W*0.18);drawImg(ctx,aude,8,8,aw,aw*1.15);
      const gx=W-50,gy=12,gw=38,gh=70,lvl=sliced/GOAL;
      ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+gw,gy);ctx.lineTo(gx+gw-5,gy+gh);ctx.lineTo(gx+5,gy+gh);ctx.closePath();ctx.fill();
      ctx.save();ctx.clip();ctx.fillStyle='#ffa31a';ctx.fillRect(gx,gy+gh*(1-lvl),gw,gh*lvl);ctx.restore();
      ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+gw,gy);ctx.lineTo(gx+gw-5,gy+gh);ctx.lineTo(gx+5,gy+gh);ctx.closePath();ctx.stroke();
      const orange=(o)=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.beginPath();ctx.arc(0,0,o.r,0,7);ctx.fillStyle='#ff9a1f';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-o.r*0.35,-o.r*0.35,o.r*0.25,o.r*0.15,-0.6,0,7);ctx.fill();
        ctx.fillStyle='#2fb36d';ctx.beginPath();ctx.ellipse(o.r*0.15,-o.r*1.02,o.r*0.32,o.r*0.15,-0.4,0,7);ctx.fill();ctx.lineWidth=2;ctx.stroke();ctx.restore();};
      const bottle=o=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);const r=o.r;ctx.lineWidth=3;ctx.strokeStyle=INK;
        ctx.beginPath();ctx.moveTo(-r*0.45,r*1.0);ctx.lineTo(-r*0.45,-r*0.2);ctx.quadraticCurveTo(-r*0.45,-r*0.55,-r*0.16,-r*0.7);ctx.lineTo(-r*0.16,-r*1.15);ctx.lineTo(r*0.16,-r*1.15);ctx.lineTo(r*0.16,-r*0.7);ctx.quadraticCurveTo(r*0.45,-r*0.55,r*0.45,-r*0.2);ctx.lineTo(r*0.45,r*1.0);ctx.closePath();
        ctx.fillStyle='#2f7d4a';ctx.fill();ctx.stroke();rr(ctx,-r*0.2,-r*1.35,r*0.4,r*0.24,3);ctx.fillStyle='#b8865b';ctx.fill();ctx.stroke();
        rr(ctx,-r*0.45,r*0.05,r*0.9,r*0.5,4);ctx.fillStyle='#ff4d4d';ctx.fill();ctx.stroke();
        ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(r*0.32)}px Fredoka, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('XXX',0,r*0.31);
        ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-r*0.32,-r*0.2,r*0.12,r*0.9);ctx.restore();};
      for(const o of os)o.bomb?bottle(o):orange(o);
      for(const h of halves){ctx.save();ctx.globalAlpha=Math.min(1,h.life);ctx.translate(h.x,h.y);ctx.rotate(h.rot);
        ctx.beginPath();ctx.arc(0,0,h.r,0,Math.PI);ctx.closePath();ctx.fillStyle='#ff9a1f';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
        ctx.beginPath();ctx.arc(0,0,h.r*0.8,0,Math.PI);ctx.closePath();ctx.fillStyle='#ffd27a';ctx.fill();
        ctx.strokeStyle='#ffa31a';ctx.lineWidth=2;for(let k=1;k<5;k++){const a=k/5*Math.PI;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*h.r*0.8,Math.sin(a)*h.r*0.8);ctx.stroke();}
        ctx.restore();}
      for(const d of drops){ctx.fillStyle=d.glass?'#7fd39a':'#ffa31a';ctx.globalAlpha=Math.max(0,d.life/0.6);ctx.beginPath();ctx.arc(d.x,d.y,4,0,7);ctx.fill();}ctx.globalAlpha=1;

      for(const f of fx)floatText(ctx,f);

/* ================= NATHAN : gare aux thons ================= */
function gameNathan(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const LV=[{n:4,v:70,t:22},{n:6,v:90,t:20},{n:8,v:110,t:18},{n:10,v:125,t:16}];

  const girl=svgImg(avatar(randLook({hair:'long',hairColor:'#d9a441',shirt:'#ff7eb6',earrings:true,beard:false,mustache:false,glasses:false})));
  let lv=0,lives=3,t=0,lvT=0,over=false,path=[],pi=0,nx=0.5,ny=0.9,drawing=false,inv=0,tunas=[],won=0;const fx=[];

  function setup(){tunas=[];const n=LV[lv].n;for(let k=0;k<n;k++){tunas.push({x:Math.random(),y0:0.22+0.58*(k+0.5)/n,y:0.22+0.58*(k+0.5)/n,d:Math.random()<.5?1:-1,v:LV[lv].v*(0.7+Math.random()*0.6),ph:Math.random()*6,amp:lv>0&&Math.random()<0.5?0.03+lv*0.01:0,burst:0});}
    lvT=LV[lv].t;reset();hud();}
  function reset(){nx=0.5;ny=0.9;path=[];pi=0;}
  setup();
  const P=()=>({x:nx*cv.W,y:ny*cv.H});
  const pd=e=>{e.preventDefault();if(over)return;const q=cv.pt(e);const end=path.length?path[path.length-1]:P();
    if(Math.hypot(q.x-end.x,q.y-end.y)<60){drawing=true;if(!path.length)path.push({x:end.x,y:end.y});}};
  const pm=e=>{if(!drawing)return;const q=cv.pt(e),l=path[path.length-1];if(Math.hypot(q.x-l.x,q.y-l.y)>8)path.push({x:q.x,y:q.y});};
  const pu=()=>{drawing=false;};
  cv.c.addEventListener('pointerdown',pd);cv.c.addEventListener('pointermove',pm);window.addEventListener('pointerup',pu);
  return{
    update(dt){
      if(over)return;t+=dt;inv=Math.max(0,inv-dt);const W=cv.W,H=cv.H;
      for(const tu of tunas){tu.ph+=dt*5;tu.y=tu.y0+Math.sin(tu.ph*0.35)*tu.amp;if(tu.burst<=0&&lv>=2&&Math.random()<dt*0.25)tu.burst=0.8;tu.burst=Math.max(0,tu.burst-dt);tu.x+=tu.d*tu.v*(tu.burst>0?2.2:1)*dt/W;if(tu.x>1.08){tu.x=1.08;tu.d=-1;}if(tu.x<-0.08){tu.x=-0.08;tu.d=1;}}
      if(won>0){won-=dt;if(won<=0){lv++;if(lv>=LV.length){over=true;api.end(true,'Il est arrivé !',"Nathan a traversé tout le bassin sans croiser un seul thon. Il peut enfin lui dire bonjour 💕");}else setup();}return;}
      lvT-=dt;if(lvT<=0){lives--;fx.push({x:cv.W/2,y:cv.H*0.2,txt:'Elle s\'impatiente !',t:0,c:'#ff6b5b'});lvT=LV[lv].t;reset();
        if(lives<=0){over=true;hud();api.end(false,'Elle est partie !','Nathan a mis trop de temps à traverser le bassin…');return;}}
      hud();let step=125*dt;let p=P();
      while(step>0&&pi<path.length){const tg=path[pi],d=Math.hypot(tg.x-p.x,tg.y-p.y);if(d<=step){p={x:tg.x,y:tg.y};step-=d;pi++;}else{p={x:p.x+(tg.x-p.x)/d*step,y:p.y+(tg.y-p.y)/d*step};step=0;}}
      nx=p.x/W;ny=p.y/H;
      if(inv<=0)for(const tu of tunas){if(Math.abs(tu.x*W-p.x)<38&&Math.abs(tu.y*H-p.y)<22){lives--;inv=1.2;fx.push({x:p.x,y:p.y-30,txt:'Aïe, un thon !',t:0,c:'#ff6b5b'});reset();hud();
        if(lives<=0){over=true;api.end(false,'Trop de thons !','Nathan s\'est fait bousculer par les thons… Il retentera sa chance au prochain cours.');}break;}}
      if(ny<0.17){won=1.3;fx.push({x:p.x,y:p.y-30,txt:'💖',t:0,c:'#ff7eb6'});}
      for(let k=fx.length-1;k>=0;k--){fx[k].t+=dt;if(fx[k].t>1.2)fx.splice(k,1);}
    },
    draw(){
      const W=cv.W,H=cv.H;ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#ece8df';ctx.fillRect(0,0,W,H*0.14);
      const gr=ctx.createLinearGradient(0,H*0.14,0,H);gr.addColorStop(0,'#4fd0d3');gr.addColorStop(1,'#1b9fb2');ctx.fillStyle=gr;ctx.fillRect(0,H*0.14,W,H*0.86);
      ctx.fillStyle='#fff';ctx.fillRect(0,H*0.14-4,W,8);
      for(let k=1;k<4;k++){const x=W*k/4;for(let y=H*0.16,n=0;y<H;y+=18,n++){ctx.fillStyle=n%2?'#ff5d5d':'#ffd21f';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();}}

    g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(0.25,at+0.02);g.gain.exponentialRampToValueAtTime(0.0001,at+d);o.connect(g).connect(ac.destination);o.start(at);o.stop(at+d+0.05);};
  let round=0,lives=3,seq=[],inp=0,phase='pause',pt=1.2,step=0,lit=-1,litT=0,t=0,over=false,lyric='',lyT=0,tears=[],shake=0;const fx=[];
  const hud=()=>api.hud(`😢 ${round}/${ROUNDS}  ❤️ ${lives}`);hud();
  const speed=()=>Math.max(0.28,0.6-round*0.04);
  function newRound(){seq.push(Math.floor(Math.random()*4));if(seq.length<3){seq.push(Math.floor(Math.random()*4));seq.push(Math.floor(Math.random()*4));}phase='pause';pt=0.8;}

          if(round>=ROUNDS){over=true;phase='done';setTimeout(()=>api.end(true,'Stéphane craque !',`Il pleure à chaudes larmes… de rire 😂 ou d'émotion 😭 ? Personne ne saura jamais !`),1600);}
          else{phase='pause';pt=1.4;seq.push(Math.floor(Math.random()*4));}}}
      else{lives--;hud();fx.push({x:g.W/2,y:g.py-20,txt:'Fausse note !',t:0,c:'#ff6b5b'});if(ac)beep(110,0.4);
        if(lives<=0){over=true;api.end(false,'Il a tenu bon…',`Stéphane a résisté après ${round} couplet${round>1?'s':''}. Pas une larme ! Il faut une chanson sans fausse note.`);}

    },
    draw(){

/* ================= RICHARD : le coup de sifflet ================= */
function gameRichard(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const ROUNDS=5,MAXEAR=2,RED=0.85,MAXW=2;
  const ric=svgImg(avatar(CHARS.richard.look));
  const club=['roland','christian','laetitia','marcel','agnes','christine'].map(k=>({img:svgImg(avatar(CHARS[k].look,{viewBox:'10 20 180 210'}))}));
  const kidImgs=Array.from({length:10},()=>svgImg(avatar(randLook({hair:pick(['short','pigtails','curly']),beard:false,mustache:false,glasses:false,freckles:true}),{viewBox:'30 20 140 140'})));
  let ac=null;try{ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(_){ac=null;}
  let round=0,ears=0,t=0,over=false,hold=false,pw=0,time=12,wl=MAXW,wave=0,waveP=0,shake=0,covered=0;const kids=[],walkers=[],fx=[];
  const geo=()=>{const W=cv.W,H=cv.H;return{W,H,top:H*0.2,bot:H*0.76,rx:W/2,ry:H*0.86,maxR:Math.hypot(W*0.55,H*0.75)};};
  const hud=()=>api.hud(`🚿 ${round}/${ROUNDS}  👂 ${ears}/${MAXEAR}  📣 ${wl}  ⏱ ${Math.ceil(Math.max(0,time))}s`);
  function setup(){const g=geo();kids.length=0;const n=4+round;
    const need=0.64+Math.random()*0.16;
    for(let k=0;k<n;k++){let x,y,d,tries=0;do{x=g.W*(0.08+Math.random()*0.84);y=g.top+20+Math.random()*(g.bot-g.top-40);d=Math.hypot(x-g.rx,y-g.ry)/g.maxR;tries++;}while(d>need&&tries<50);
      kids.push({x:x/g.W,y:y/g.H,vx:(Math.random()-.5)*(0.12+round*0.03),vy:(Math.random()-.5)*(0.08+round*0.02),ph:Math.random()*6,img:pick(kidImgs),dive:0,nd:1+Math.random()*3});}
    const far=kids[0];far.x=Math.max(0.06,Math.min(0.94,(g.rx+(Math.random()<.5?-1:1)*Math.sqrt(Math.max(0,(need*g.maxR)**2-(g.ry-(g.top+30))**2)))/g.W));far.y=(g.top+30)/g.H;
    time=Math.max(5,9-round);pw=0;hold=false;wl=MAXW;hud();}
  setup();
  function whistle(p){if(!ac)return;const at=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain();
    o.type=p>RED?'square':'sine';o.frequency.value=2600+p*600;lfo.frequency.value=28;lg.gain.value=90;lfo.connect(lg).connect(o.frequency);
    const v=Math.min(0.3,0.04+p*0.22);g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(v,at+0.03);g.gain.setValueAtTime(v,at+0.5+p*0.3);g.gain.exponentialRampToValueAtTime(0.0001,at+0.7+p*0.3);
    o.connect(g).connect(ac.destination);o.start(at);lfo.start(at);o.stop(at+0.8+p*0.3);lfo.stop(at+0.8+p*0.3);}
  function release(){if(!hold)return;hold=false;const g=geo(),p=Math.min(1.15,pw);pw=0;whistle(p);wave=0.01;waveP=p;
    wl--;const R=p*g.maxR;let n=0;
    for(let k=kids.length-1;k>=0;k--){const kd=kids[k],d=Math.hypot(kd.x*g.W-g.rx,kd.y*g.H-g.ry);if(d<=R&&kd.dive<=0){walkers.push({x:kd.x,y:kd.y,img:kd.img,k:0});kids.splice(k,1);n++;}}
    if(p>RED){ears++;shake=0.8;covered=2;fx.push({x:g.W/2,y:g.H*0.3,txt:'AÏE, MES OREILLES !',t:0,c:'#ff3b3b'});
      if(ears>=MAXEAR){over=true;hud();api.end(false,'Tympans explosés !','Richard a sifflé tellement fort que tout le club est devenu sourd. Un peu de retenue !');return;}}
    else if(n>0)fx.push({x:g.W/2,y:g.H*0.3,txt:kids.length?`${n} à la douche !`:'Parfait !',t:0,c:'#7dffa8'});
    else fx.push({x:g.W/2,y:g.H*0.3,txt:'Trop faible…',t:0,c:'#ffcf33'});
    hud();
    if(kids.length&&wl<=0){over=true;api.end(false,'Plus de souffle !',"Richard a utilisé ses deux coups de sifflet et il reste des enfants dans l'eau. Il faut viser juste !");return;}
    if(!kids.length){round++;hud();if(round>=ROUNDS){over=true;api.end(true,'Tout le monde à la douche !',`${ROUNDS} séances terminées pile à l'heure${ears?`, avec seulement ${ears} coup${ears>1?'s':''} de sifflet trop fort`:' sans casser une seule oreille'} !`);}else setTimeout(()=>{if(!over)setup();},1200);}}
  const down=e=>{e.preventDefault();if(over||!kids.length)return;hold=true;pw=0;};const up=()=>release();
  cv.c.addEventListener('pointerdown',down);window.addEventListener('pointerup',up);cv.c.addEventListener('pointercancel',up);
  return{
    update(dt){
      if(over)return;t+=dt;const g=geo();shake=Math.max(0,shake-dt);covered=Math.max(0,covered-dt);if(wave>0){wave+=dt*1.6;if(wave>1)wave=0;}

      for(const k of kids){k.ph+=dt*4;if(round>=1){k.nd-=dt;if(k.nd<=0&&k.dive<=0){k.dive=1.1;k.nd=2+Math.random()*3;}k.dive=Math.max(0,k.dive-dt);}k.x+=k.vx*dt;k.y+=k.vy*dt;if(k.x<0.06||k.x>0.94)k.vx*=-1;if(k.y*g.H<g.top+16||k.y*g.H>g.bot-16)k.vy*=-1;}
      for(let k=walkers.length-1;k>=0;k--){const w=walkers[k];w.k+=dt*0.8;if(w.k>1)walkers.splice(k,1);}
      for(let k=fx.length-1;k>=0;k--){fx[k].t+=dt;if(fx[k].t>1.2)fx.splice(k,1);}
      if(kids.length){time-=dt;if(time<=0){time=0;over=true;hud();api.end(false,'Ils jouent encore !',"L'heure est passée et des enfants sont toujours dans l'eau. Il fallait siffler plus fort… mais pas trop !");return;}}
      hud();
    },
    draw(){
      const g=geo(),W=g.W,H=g.H;ctx.save();if(shake>0)ctx.translate(Math.sin(t*60)*shake*8,Math.cos(t*55)*shake*6);
      ctx.fillStyle='#e9f2f7';ctx.fillRect(-10,-10,W+20,H+20);
      const gr=ctx.createLinearGradient(0,g.top,0,g.bot);gr.addColorStop(0,'#4fd0d3');gr.addColorStop(1,'#1e9db1');rr(ctx,8,g.top,W-16,g.bot-g.top,16);ctx.fillStyle=gr;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
      ctx.font='26px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🚿',W-26,g.top*0.5);ctx.fillText('🚿',W-60,g.top*0.5);
      const cw=Math.min(40,W/10);club.forEach((c,k)=>{const x=10+cw/2+k*(cw+4),y=g.top*0.5;drawImg(ctx,c.img,x-cw/2,y-cw*0.55,cw,cw*1.16);
        if(covered>0){ctx.font='16px sans-serif';ctx.fillText('🙉',x,y-cw*0.6);}});

/* ================= DAVID : cache-toi de Marcel ! ================= */
function gameDavid(stage,api){

  const dav=svgImg(avatar(CHARS.david.look)),davH=svgImg(avatar(CHARS.david.look,{viewBox:'30 20 140 140'})),mar=svgImg(avatar(CHARS.marcel.look));
  /* w=1 : cachette dans l'eau */
  const SPOTS=[{n:'Chaise',x:0.12,w:0},{n:'Planches',x:0.36,w:0},{n:'Plot de départ',x:0.6,w:0},{n:'Toboggan',x:0.86,w:0},{n:'Aquabike',x:0.3,w:1},{n:"Sous l'eau",x:0.72,w:1}];
  const ITEMS=[['des frites neuves',80],['un sifflet en or',120],['un canard gonflable géant',150],['une machine à café',200],['des bonnets pour tout le club',100],['une sono pour la piscine',180],['un jacuzzi',250]];
  let round=0,wallet=600,t=0,over=false,phase='choose',spot=-1,mem=SPOTS.map(()=>0),item=pick(ITEMS),checks=[],ci=0,peekT=0,run=null;
  const M={x:1.1,dir:-1};const fx=[];

  const spotXY=(i,g)=>({x:SPOTS[i].x*g.W,y:SPOTS[i].w?g.wy:g.gy});
  const green=()=>phase==='search'&&peekT>0;
  function startSearch(){const n=Math.min(5,2+Math.floor(round/1.5));const w=SPOTS.map((_,i)=>1+mem[i]*1.4+Math.random()*1.3);
    checks=SPOTS.map((_,i)=>i).sort((a,b)=>w[b]-w[a]).slice(0,n);checks.sort((a,b)=>SPOTS[b].x-SPOTS[a].x);ci=0;phase='search';M.x=1.12;M.dir=-1;}
  function caught(msg){if(phase==='found')return;phase='found';run=null;wallet-=item[1];
    fx.push({x:cv.W/2,y:geo().gy-150,txt:`${msg} -${item[1]}€`,t:0,c:'#ff6b5b'});hud();
    setTimeout(()=>{if(over)return;if(wallet<=0){over=true;api.end(false,'Portefeuille vide !',"Marcel a trouvé David trop souvent : tout l'argent est parti dans les achats du club…");return;}next();},1700);}
  function next(){round++;if(round>=ROUNDS){over=true;api.end(true,'Bien caché !',`David a échappé à Marcel et garde ${wallet}€ en poche. Les achats du club attendront !`);return;}
    item=pick(ITEMS);phase='choose';spot=-1;run=null;M.x=1.12;hud();}

    let best=-1,bd=60;SPOTS.forEach((_,i)=>{const p=spotXY(i,g),d=Math.hypot(p.x-q.x,(p.y-40)-q.y);if(d<bd){bd=d;best=i;}});if(best<0)return;
    if(phase==='choose'){spot=best;mem[best]++;phase='ready';setTimeout(()=>{if(!over&&phase==='ready')startSearch();},700);}
    else if(phase==='search'&&!run&&best!==spot){
      if(peekT>0&&best===checks[ci]){fx.push({x:q.x,y:q.y-40,txt:'Il fouille là !',t:0,c:'#ffcf33'});return;}
      if(!green()){run={from:spot,to:best,k:0};caught('Vu en train de bouger !');return;}

  cv.c.addEventListener('pointerdown',onDown);
  return{
    update(dt){

        else{const d=tx-M.x;M.dir=d<0?-1:1;if(Math.abs(d)<sp*dt){M.x=tx;peekT=Math.max(0.9,1.5-round*0.1);}else M.x+=Math.sign(d)*sp*dt;}}
      else{M.dir=1;M.x+=sp*dt;if(M.x>1.15){fx.push({x:cv.W/2,y:geo().gy-150,txt:'Bizarre, pas de David…',t:0,c:'#7dffa8'});phase='safe';setTimeout(()=>{if(!over)next();},1300);}}
    },
    draw(){
      const g=geo(),W=g.W,H=g.H;ctx.clearRect(0,0,W,H);drawHall(ctx,0,0,W,g.gy-40);
      ctx.fillStyle='#ece8df';ctx.fillRect(0,g.gy-40,W,g.wy-g.gy);ctx.strokeStyle='rgba(120,120,120,.2)';ctx.lineWidth=1.5;for(let x=0;x<W;x+=26){ctx.beginPath();ctx.moveTo(x,g.gy-40);ctx.lineTo(x,g.gy+30);ctx.stroke();}

      for(let x=6,n=0;x<W;x+=16,n++){ctx.fillStyle=n%2?'#ff5d5d':'#ffd21f';ctx.beginPath();ctx.arc(x,H*0.95,4,0,7);ctx.fill();}
      const prop=(i,x,y)=>{ctx.strokeStyle=INK;ctx.lineWidth=3;

/* ================= GWEN : les analyses de chlore ================= */
function gameGwen(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const ROUNDS=6,MAXERR=3;
  const gw=svgImg(avatar(CHARS.gwen.look));
  const BOT=[{k:'eau',n:'Eau du bassin',c:'#bfeff2'},{k:'dpd1',n:'DPD 1',c:'#ff7eb6'},{k:'dpd3',n:'DPD 3',c:'#b06bff'},{k:'phenol',n:'Phénol rouge',c:'#ff5d3d'}];
  const TESTS=[{n:'Chlore libre',seq:['eau','dpd1'],unit:'mg/L',vals:['0,5','1','1,5','2','3'],cols:['#fde4ec','#f8b6cf','#f28bb3','#e95f98','#d6337c']},
    {n:'pH',seq:['eau','phenol'],unit:'',vals:['6,8','7,2','7,4','7,6','8,0'],cols:['#f7d24a','#f4b13f','#ef8e3a','#e96a3c','#d94a4a']},
    {n:'Chlore total',seq:['eau','dpd1','dpd3'],unit:'mg/L',vals:['0,5','1','1,5','2','3'],cols:['#f6dcef','#eab2dc','#db86c8','#c95cb2','#ad3496']}];
  let round=0,err=0,t=0,over=false,phase='mix',test=null,step=0,ans=0,drag=null,liquid=[],tl=0,tmax=20,pour=null,shuffled=[];const fx=[];
  const hud=()=>api.hud(`🧪 ${round}/${ROUNDS}  ❌ ${err}/${MAXERR}  ⏱ ${Math.ceil(Math.max(0,tl))}s`);
  function setup(){test=TESTS[round<3?round%2:Math.floor(Math.random()*3)];if(round===2)test=TESTS[2];step=0;ans=Math.floor(Math.random()*5);liquid=[];phase='mix';tmax=Math.max(10,20-round*2);tl=tmax;shuffled=shuffle([0,1,2,3]);hud();}
  setup();
  const geo=()=>{const W=cv.W,H=cv.H,bw=Math.min(78,(W-40)/4);return{W,H,tx:W/2,ty:H*0.36,th:H*0.3,tw:Math.min(70,W*0.18),by:H*0.86,bw};};
  const botPos=(slot,g)=>({x:20+g.bw/2+slot*((g.W-40-g.bw)/3),y:g.by});
  function mistake(msg){err++;fx.push({x:cv.W/2,y:cv.H*0.2,txt:msg,t:0,c:'#ff6b5b'});hud();
    if(err>=MAXERR){over=true;api.end(false,'Analyses ratées !',"Trop d'erreurs dans les mélanges et les lectures… Le bassin attendra les bons résultats.");return true;}return false;}
  function nextRound(){round++;hud();if(round>=ROUNDS){over=true;api.end(true,'Eau parfaite !',`${ROUNDS} analyses réussies : chlore et pH au top, Gwen valide le bassin !`);return;}setTimeout(()=>{if(!over)setup();},900);}
  const pd=e=>{e.preventDefault();if(over)return;const q=cv.pt(e),g=geo();
    if(phase==='mix'&&!pour){shuffled.forEach((bi,slot)=>{const p=botPos(slot,g);if(Math.abs(q.x-p.x)<g.bw/2&&q.y>p.y-g.bw*1.4&&q.y<p.y+10)drag={bi,x:q.x,y:q.y};});}
    else if(phase==='read'){const sw=(g.W-40)/5;for(let i=0;i<5;i++){const x=20+i*sw;if(q.x>x&&q.x<x+sw&&q.y>g.by-70&&q.y<g.by+20){
      if(i===ans){fx.push({x:cv.W/2,y:cv.H*0.2,txt:`Bien lu : ${test.vals[ans]} ${test.unit}`,t:0,c:'#7dffa8'});phase='done';nextRound();}
      else{if(!mistake('Mauvaise lecture !')){phase='done';nextRound();}}}}}};
  const pm=e=>{if(!drag)return;const q=cv.pt(e);drag.x=q.x;drag.y=q.y;};

/* ================= MATHÉO : l'épuisette en apnée ================= */
function gameMatheo(stage,api){

  const head=svgImg(avatar(L,{viewBox:'30 20 140 140'})),logo=new Image();logo.src=LOGO;

  const geo=()=>{const W=cv.W,H=cv.H;return{W,H,sy:H*0.13,fy:H*0.93};};
  const left=()=>bits.length+net+src.reduce((s,q)=>s+q.n,0);

  function setup(){bits=[];time=LV[lvl].t;src=LV[lvl].src.map((q,i)=>({k:q.k,n:q.n,x:0.2+Math.random()*0.7,y:0,st:'swim',ty:0,d:Math.random()<.5?1:-1,next:0.4+i*0.7+Math.random()*0.5,img:kidImgs[i%kidImgs.length],sick:0}));net=0;hud();}

      for(const st of streaks){const f=flow(st.x,st.y);st.x+=f[0]*dt*1.5;st.y+=f[1]*dt*1.5;if(st.x<0)st.x+=1;if(st.x>1)st.x-=1;if(st.y<0.05||st.y>0.98){st.y=0.1+Math.random()*0.85;st.x=Math.random();}}

      {const f=flow(mx,my);mx+=f[0]*dt*0.85;my+=f[1]*dt*0.85;}

        if(tx!==null&&phase==='sneak')ctx.rotate(Math.sin(t*14)*0.06);if(phase==='caught')ctx.rotate(Math.sin(t*30)*0.1);
        ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(0,0,zw*0.4,7,0,0,7);ctx.fill();
        drawImg(ctx,zoe,-zw/2,-zh,zw,zh);
        if(phase==='sneak'||phase==='caught'){ctx.font=`${Math.round(28*s)}px sans-serif`;ctx.textAlign='center';ctx.fillText(phase==='splat'?'🍰':'🍰',zw*0.45,-zh*0.42);}
        ctx.restore();if(phase==='sneak'&&noise<15&&tx!==null)bubbleText(ctx,x,y-zh-10,'🤫',11);}});
      items.sort((a,b)=>a.y-b.y).forEach(it=>it.draw());
      // noise bar
      const bw=Math.min(220,W*0.55),bx2=(W-bw)/2,by2=H-22;rr(ctx,bx2,by2,bw,12,6);ctx.fillStyle='#fff';ctx.fill();rr(ctx,bx2,by2,Math.max(6,bw*noise/100),12,6);ctx.fillStyle=noise<50?'#2fb36d':noise<80?'#ffcf33':'#ff3b3b';ctx.fill();rr(ctx,bx2,by2,bw,12,6);ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();
      ctx.font='700 11px Fredoka, sans-serif';ctx.fillStyle=INK;ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText('🔊 Bruit',bx2-6,by2+6);
      for(const f of fx)floatText(ctx,f);
      if(phase==='close'||phase==='done'||phase==='missed'){const h=headGeo();
        ctx.fillStyle='rgba(12,8,32,.55)';ctx.fillRect(0,0,W,H);
        ctx.save();ctx.beginPath();ctx.arc(W/2,h.y0+h.ch*0.45,Math.max(W,H)*0.55,0,7);const rg=ctx.createRadialGradient(W/2,h.y0+h.ch*0.4,10,W/2,h.y0+h.ch*0.45,Math.max(W,H)*0.55);rg.addColorStop(0,'#ffe9f2');rg.addColorStop(1,'#ffb3cf00');ctx.fillStyle=rg;ctx.fill();ctx.restore();
        const sh=phase==='close'?Math.sin(t*30)*(closeT<1?3:0):0;
        drawImg(ctx,chF,h.x0+sh,h.y0,h.cw,h.ch);
        if(phase==='close'){bubbleText(ctx,W/2,h.y0-6>20?h.y0-6:22,'Hein ?! 😳',16);
          const bw=Math.min(240,W*0.6),bx=(W-bw)/2,by=h.y0+h.ch+14;rr(ctx,bx,by,bw,12,6);ctx.fillStyle='#fff';ctx.fill();rr(ctx,bx,by,Math.max(6,bw*closeT/3),12,6);ctx.fillStyle=closeT>1.5?'#2fb36d':closeT>.7?'#ffcf33':'#ff3b3b';ctx.fill();rr(ctx,bx,by,bw,12,6);ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();
          bubbleText(ctx,W/2,by+36,'Touche sa tête pour écraser le gâteau ! 🎯',14);
          if(cur){ctx.font=`${Math.round(64*s)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍰',cur.x,cur.y);}}
        if(hit){const k=Math.min(1,splatT*4),R=h.cw*0.2*(0.4+0.6*k);ctx.save();ctx.beginPath();ctx.ellipse(h.hx,h.hy,h.rx*1.05,h.ry*1.1,0,0,7);ctx.clip();
          ctx.fillStyle='#fff7ea';ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();for(let k2=0;k2<18;k2++){const a=k2/18*Math.PI*2,r=R*(0.75+(k2%2)*0.35+Math.sin(k2*7)*0.1);ctx.lineTo(hit.x+Math.cos(a)*r,hit.y+Math.sin(a)*r*0.9);}ctx.closePath();ctx.fill();ctx.stroke();
          [[-.3,.6],[.1,.75],[.35,.5]].forEach((d,i)=>{const dl=R*(0.4+Math.min(1,splatT*0.8)*0.9);ctx.fillStyle='#fff7ea';rr(ctx,hit.x+d[0]*R-6,hit.y+d[1]*R*0.5,12,dl,6);ctx.fill();ctx.stroke();});
          ctx.fillStyle='#e8b05a';ctx.beginPath();ctx.ellipse(hit.x,hit.y,R*0.35,R*0.26,0.3,0,7);ctx.fill();ctx.stroke();
          ctx.fillStyle='#ff7eb6';[[-.4,-.3],[.3,-.4],[.1,.35],[-.25,.3],[.45,.15]].forEach(d=>{ctx.beginPath();ctx.arc(hit.x+d[0]*R,hit.y+d[1]*R,5,0,7);ctx.fill();});
          ctx.fillStyle='#e63b3b';ctx.beginPath();ctx.arc(hit.x+R*0.05,hit.y-R*0.45,R*0.12,0,7);ctx.fill();ctx.stroke();ctx.restore();}
        if(miss){const y=miss.y+miss.t*miss.t*900;ctx.save();ctx.translate(miss.x,y);ctx.rotate(miss.t*6);ctx.font=`${Math.round(64*s)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍰',0,0);ctx.restore();}
      }
      if(phase==='take')bubbleText(ctx,W/2,H*0.5,'Touche le gâteau 🎂 pour prendre une part',14);
      else if(phase==='sneak'&&t<9)bubbleText(ctx,W/2,H*0.5,'Glisse le doigt doucement… cache-toi quand il se retourne !',12);
      if(phase==='done'){ctx.save();const k=Math.min(1,splatT*3);ctx.translate(W/2,H*0.86);ctx.scale(0.6+k*0.6,0.6+k*0.6);ctx.rotate(-0.1);
        ctx.font='54px "Lilita One", Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=8;ctx.strokeStyle=INK;ctx.fillStyle='#ff7eb6';ctx.strokeText('SPLAT !',0,0);ctx.fillText('SPLAT !',0,0);ctx.restore();}
    },
    destroy(){cv.c.removeEventListener('pointerdown',down);cv.c.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);cv.destroy();}
  };
}

/* ================= ALIX : appeler Hulk (voix grave, pas articulée) ================= */
function gameAlix(stage,api){

  let t=0,over=false,phase='play',hx=0.6,hdir=-1,hstate='walk',hT=0,dash=0,shame=0,hold=false,needle=0,nd=1,tz=0.62,tw=0.16,call=null,callT=0,wob=0,dist=null,distT=2.5,lick=0,mouth=0;

  const POOL=0.86,HOME=0.2;
  const ITEMS=[['🎾','une balle'],['🌭','une saucisse'],['🐦','un pigeon'],['🧦','une chaussette'],['🍦','une glace']];
  const hud=()=>api.hud(`🐶 ${Math.max(0,Math.round((hx-HOME)*40))} m  😳 ${shame}/${MAXH}`);hud();
  const geo=()=>{const W=cv.W,H=cv.H,s=Math.min(W/400,H/700);return{W,H,s,gy:H*0.5,cy:H*0.68};};

    if(v>=tz&&v<=tz+tw){const c=Math.abs(v-(tz+tw/2))/(tw/2),perfect=c<0.35;
      call={txt:perfect?'BLEUAARGHULKKKK !!':'BLEUARGHULK !',c:'#2fb36d',big:perfect};dash=perfect?0.17:0.11;hstate='come';hT=0;

      // distractions
      distT-=dt;if(!dist&&distT<=0){const it=pick(ITEMS);dist={e:it[0],n:it[1],x:Math.min(POOL-0.05,hx+0.05+Math.random()*0.15),t:0};distT=4+Math.random()*3;}
      if(dist)dist.t+=dt;
      // Hulk
      hT+=dt;
      if(hstate==='come'){const k=Math.min(1,hT/0.9);hx-=dash*dt/0.9;hdir=-1;if(k>=1)hstate='walk';}
      else if(hstate==='ignore'){if(hT>1.2)hstate='walk';}
      else if(hstate==='scared'){if(hT>1)hstate='walk';}
      else if(hstate==='sniff'){if(hT>1.6){hstate='walk';dist=null;}}
      else{const target=dist?dist.x:POOL+0.05;const sp=dist?0.1:0.02;hdir=target>hx?1:-1;hx+=hdir*sp*dt;
        if(dist&&Math.abs(hx-dist.x)<0.02){hstate='sniff';hT=0;fx.push({x:dist.x*cv.W,y:geo().gy-60,txt:`Hulk a trouvé ${dist.n} !`,t:0,c:'#ffcf33'});}}
      if(hx>=POOL){fx.push({x:POOL*cv.W,y:geo().gy-40,txt:'PLOUF ! 💦',t:0,c:'#3cb4e6'});hx=0.6;hstate='walk';dist=null;addShame('Hulk est dans le bassin… 🙈');}
      if(hx<=HOME&&phase==='play'){phase='won';over=true;lick=0;setTimeout(()=>api.end(true,'Hulk est là !','BLEUARGHULKKK… et Hulk est venu ! Personne n\'a compris ce qu\'Alix a dit, mais lui si 🐶❤️'),2200);}
      hud();
    },
    draw(){const g=geo(),{W,H,s,gy,cy}=g;ctx.clearRect(0,0,W,H);
      drawHall(ctx,0,0,W,gy*0.62);
      ctx.fillStyle='#ece8df';ctx.fillRect(0,gy*0.62,W,H);ctx.strokeStyle='rgba(120,120,120,.18)';ctx.lineWidth=1.5;for(let x=0;x<W;x+=34){ctx.beginPath();ctx.moveTo(x,gy*0.62);ctx.lineTo(x,gy+30);ctx.stroke();}
      // bassin à droite
      const px=POOL*W+20*s;const wg=ctx.createLinearGradient(0,gy*0.62,0,gy+30);wg.addColorStop(0,'#2bb3c7');wg.addColorStop(1,'#1784a8');ctx.fillStyle=wg;ctx.fillRect(px,gy*0.62,W-px,gy*0.38+30);
      ctx.fillStyle='#fff';ctx.fillRect(px-6,gy*0.62,6,gy*0.38+30);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;for(let i=0;i<4;i++){const yy=gy*0.7+i*18;ctx.beginPath();ctx.moveTo(px+6,yy);ctx.quadraticCurveTo(px+(W-px)/2,yy-5+Math.sin(t*2+i)*3,W,yy);ctx.stroke();}
      ctx.font=`${Math.round(12*s+4)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      // nageurs qui se retournent
      stares.forEach(st=>{ctx.globalAlpha=Math.min(1,st.t*3,(2.5-st.t)*2);bubbleText(ctx,st.x*W,gy*0.72,['👀','😳','🤨'][Math.floor(st.x*10)%3]+' Ça va, Alix ?',11);ctx.globalAlpha=1;});
      // distraction
      if(dist){ctx.font=`${Math.round(30*s)}px sans-serif`;ctx.fillStyle='#000';ctx.fillText(dist.e,dist.x*W,gy+8-Math.abs(Math.sin(t*4))*4);}
      // Alix
      const aw=Math.min(W*0.3,130*s),ah=aw*1.15;drawImg(ctx,alix,HOME*W-aw*0.75,gy+12-ah,aw,ah);
      if(mouth>0){ctx.fillStyle='#7a2230';ctx.beginPath();ctx.ellipse(HOME*W-aw*0.75+aw*0.5,gy+12-ah+ah*(126/230)*1,aw*0.045,aw*0.04*(1+Math.sin(t*40)*0.5),0,0,7);ctx.fill();}
      // Hulk, cocker anglais marron
      const x=hx*W,y=gy+6,R=36*s;ctx.save();ctx.translate(x,y);ctx.scale(hdir,1);const step=hstate==='walk'||hstate==='come'?Math.sin(t*(hstate==='come'?22:10)):0;
      ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.fillStyle='#8a4a22';
      [[-0.6,1],[-0.3,-1],[0.4,1],[0.7,-1]].forEach(l=>{rr(ctx,R*l[0]-4*s,-R*0.2,8*s,R*0.55+step*l[1]*3*s,4*s);ctx.fill();ctx.stroke();});
      ctx.beginPath();ctx.ellipse(0,-R*0.45,R*1.05,R*0.55,0,0,7);ctx.fill();ctx.stroke();
      const wag=Math.sin(t*(hstate==='come'||phase==='won'?30:8))*0.6;ctx.save();ctx.translate(-R*1,-R*0.6);ctx.rotate(-0.8+wag);rr(ctx,-3*s,-R*0.5,7*s,R*0.5,4*s);ctx.fill();ctx.stroke();ctx.restore();
      ctx.beginPath();ctx.ellipse(R*1.05,-R*1.0,R*0.5,R*0.45,0,0,7);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.ellipse(R*1.45,-R*0.88,R*0.25,R*0.2,0,0,7);ctx.fillStyle='#a2643a';ctx.fill();ctx.stroke();
      ctx.fillStyle=INK;ctx.beginPath();ctx.arc(R*1.66,-R*0.92,R*0.08,0,7);ctx.fill();ctx.beginPath();ctx.arc(R*1.15,-R*1.12,R*0.07,0,7);ctx.fill();
      ctx.fillStyle='#6b3517';ctx.beginPath();ctx.ellipse(R*0.8,-R*0.75+Math.sin(t*6)*2,R*0.22,R*0.55,0.25,0,7);ctx.fill();ctx.stroke();
      if(hstate==='come'||phase==='won'){ctx.fillStyle='#ff7eb6';ctx.beginPath();ctx.ellipse(R*1.55,-R*0.62,R*0.08,R*0.16,0,0,7);ctx.fill();}
      ctx.restore();
      if(hstate==='ignore')bubbleText(ctx,x,y-R*2.1,'… 😑',11);if(hstate==='scared')bubbleText(ctx,x,y-R*2.1,'😨 ?!',11);if(hstate==='sniff')bubbleText(ctx,x,y-R*2.1,'snif snif 👃',11);
      if(hstate==='come')bubbleText(ctx,x,y-R*2.1,'Ouaf ! 🐾',11);
      ctx.font='600 11px Fredoka, sans-serif';ctx.fillStyle=INK;ctx.fillText('Hulk',x,y+16);
      // la voix d'Alix

        ctx.font=`${call.big?30:24}px "Lilita One", Impact, sans-serif`;ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.fillStyle=call.c;ctx.strokeText(call.txt,0,0);ctx.fillText(call.txt,0,0);ctx.restore();}
      // panneau de la voix
      const pw=Math.min(W*0.9,400),px0=(W-pw)/2,py0=gy+44;rr(ctx,px0,py0,pw,H-py0-14,20);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
      ctx.font='700 14px Fredoka, sans-serif';ctx.fillStyle=INK;ctx.textAlign='center';ctx.fillText('🎙️ La voix d\'Alix',W/2,py0+20);
      const mx=px0+20,mw=pw-40,my=py0+40,mh=28;const gr=ctx.createLinearGradient(mx,0,mx+mw,0);gr.addColorStop(0,'#bfe0ff');gr.addColorStop(1,'#6b3517');rr(ctx,mx,my,mw,mh,10);ctx.fillStyle=gr;ctx.fill();

      ctx.beginPath();ctx.arc(0,4,br,0,7);ctx.fillStyle=INK;ctx.fill();ctx.beginPath();ctx.arc(0,hold?2:0,br,0,7);ctx.fillStyle=hold?'#ff8a3d':'#ffcf33';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();

      for(const f of fx)floatText(ctx,f);

        bubbleText(ctx,HOME*W+40,gy-120*s,'Slurp ! 👅',13);}
    },
    destroy(){cv.c.removeEventListener('pointerdown',down);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);cv.destroy();}
  };
}

/* ================= KAYAK : le téléphone au fond de l'eau trouble ================= */
function gameKayak(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx,LIVES=3;
  const cam=svgImg(avatar(CHARS.kayak.look));
  let t=0,over=false,phase='play',lives=LIVES,o2=1,dx=0.45,dy=0.12,tx=null,ty=null,face=-1,carried=null,silt=0,passCd=2,pingT=0,wonT=0,hurtT=0,inv=0,msgT=0,msg='',done=0;
  const fx=[],bub=[],pings=[],mud=[],flies=[];
  const FCOL=['#f2a541','#7fc8a9','#e86a5a','#c9a24a','#8fb3d9','#b58ad6','#9ccf5b','#f28fb0'];
  const fish=[];for(let i=0;i<8;i++)fish.push({x:0.1+Math.random()*0.8,y:0.35+Math.random()*0.55,a:Math.random()*6.28,turn:1+Math.random()*2,col:FCOL[i],sz:0.8+Math.random()*0.5,flee:0,tired:0,ph:null});
  // les deux téléphones : celui de Christian (coque bleue) et celui de Camille (coque rose)
  const PH=[{who:'Christian',col:'#3c8ee6',done:false},{who:'Camille',col:'#ff5fa2',done:false}];
  fish[0].ph=PH[0];fish[4].ph=PH[1];
  const silure={x:0.2,y:0.8,a:0,turn:3,rest:0};
  const geo=()=>{const W=cv.W,H=cv.H,s=Math.min(W/400,H/700);return{W,H,s,surf:H*0.17,bot:H*0.96};};
  const hud=()=>api.hud(`📱 ${done}/2  ❤️ ${lives}  🫧 ${Math.round(o2*100)}%`);hud();
  const say=(m,d)=>{msg=m;msgT=d||2;};
  const down=e=>{e.preventDefault();if(over)return;const q=cv.pt(e);tx=q.x/cv.W;ty=q.y/cv.H;};
  const move=e=>{if(tx===null)return;const q=cv.pt(e);tx=q.x/cv.W;ty=q.y/cv.H;};
  const up=()=>{tx=ty=null;};
  cv.c.addEventListener('pointerdown',down);cv.c.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  const free=()=>fish.filter(f=>!f.ph&&!flies.some(fl=>fl.to===f));
  function nearestFree(x,y,max){const g=geo();let best=null,bd=1e9;free().forEach(f=>{const d=Math.hypot((f.x-x)*g.W,(f.y-y)*g.H);if(d<bd&&d<(max||1e9)){bd=d;best=f;}});return best;}

function gameBonus(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;
