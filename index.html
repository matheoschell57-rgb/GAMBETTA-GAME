<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gambetta Game</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e0217a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gambetta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:inherit}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#bfeaff;--bg2:#6fcdf3;--card:#ffffff;--text:#1b2a3a;--muted:#4b6378;
  --ink:#1b2a3a;--yellow:#ffcf33;--coral:#ff6b5b;--green:#2fb36d;--red:#e63b3b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e2a40;--bg2:#15486b;--card:#1f3d56;--text:#f3f8fc;--muted:#a9c1d4}
}
:root[data-theme="dark"]{--bg:#0e2a40;--bg2:#15486b;--card:#1f3d56;--text:#f3f8fc;--muted:#a9c1d4}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;height:100%;max-width:640px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex;animation:fadeIn .35s ease}
.av{display:block;width:100%;height:auto}
button{font:inherit}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}

/* ---------- Titre ---------- */
#title{align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:20px 16px 110px}
.title-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo-badge{background:var(--pink,#e0217a);border:5px solid #1b2a3a;border-radius:50%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:16%}
.logo-badge img{width:100%;height:auto;display:block}
.logo{width:min(40vw,170px);filter:drop-shadow(0 6px 0 rgba(27,42,58,.35));animation:bob 3s ease-in-out infinite}
.gametitle{font-family:'Lilita One','Fredoka',Impact,sans-serif;font-weight:400;margin:0;line-height:.88;
  font-size:clamp(48px,15vw,84px);transform:rotate(-3deg);letter-spacing:1px}
.gametitle span{display:block;color:#fff;
  text-shadow:3px 3px 0 #1b2a3a,-3px -3px 0 #1b2a3a,3px -3px 0 #1b2a3a,-3px 3px 0 #1b2a3a,0 3px 0 #1b2a3a,3px 0 0 #1b2a3a,-3px 0 0 #1b2a3a,0 -3px 0 #1b2a3a,0 9px 0 #1b2a3a}
.gametitle .g2{color:var(--yellow);font-size:1.15em}
.newlogo{width:min(80vw,360px,46vh)}
.newlogo img{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 0 rgba(27,42,58,.25)) drop-shadow(0 0 0 #fff)}
.title-chars{display:flex;gap:6px;justify-content:center}
.title-chars div{width:min(15vw,70px);animation:bob 2.4s ease-in-out infinite}
.title-chars div:nth-child(2){animation-delay:.3s}.title-chars div:nth-child(3){animation-delay:.6s}.title-chars div:nth-child(4){animation-delay:.9s}.title-chars div:nth-child(5){animation-delay:1.2s}
.tap{font-weight:700;font-size:19px;animation:blink 1.3s ease-in-out infinite}
.waves{position:absolute;left:0;right:0;bottom:0;height:100px;background:#3cb4e6;z-index:1}
.waves::before{content:"";position:absolute;left:0;right:0;top:-22px;height:24px;
  background:radial-gradient(circle at 20px 26px,#3cb4e6 20px,transparent 21px) repeat-x;background-size:40px 24px;animation:waves 2.5s linear infinite}
.waves::after{content:"";position:absolute;left:0;right:0;top:22px;height:10px;
  background:radial-gradient(circle at 15px 12px,rgba(255,255,255,.5) 6px,transparent 7px) repeat-x;background-size:60px 12px;animation:waves 4s linear infinite reverse}
.bubbles i{position:absolute;bottom:-20px;width:16px;height:16px;border-radius:50%;border:3px solid rgba(255,255,255,.8);animation:rise 7s linear infinite;z-index:1}
.bubbles i:nth-child(1){left:8%;animation-delay:0s}.bubbles i:nth-child(2){left:22%;animation-delay:2.2s;width:10px;height:10px}
.bubbles i:nth-child(3){left:41%;animation-delay:4.1s}.bubbles i:nth-child(4){left:63%;animation-delay:1.1s;width:22px;height:22px}
.bubbles i:nth-child(5){left:80%;animation-delay:3.3s}.bubbles i:nth-child(6){left:92%;animation-delay:5.2s;width:10px;height:10px}

/* ---------- Sélection ---------- */
#select{padding:16px 14px 10px;gap:10px}
.sel-head{text-align:center}
.sel-head h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:32px;margin:0}
.sel-head p{margin:2px 0 0;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;overflow-y:auto;padding:6px 4px 18px;min-height:0}
.char{position:relative;background:var(--card);color:var(--text);border:4px solid var(--ink);border-radius:22px;
  box-shadow:0 6px 0 var(--ink);padding:8px 8px 12px;text-align:center;cursor:pointer;transition:transform .1s}
.char:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.duo{display:flex;align-items:flex-end;justify-content:center}.duo .av{width:52%;margin:0 -2%}
.char .avwrap{border-radius:16px;border:3px solid var(--ink);overflow:hidden;padding-top:6px}
.char .nm{font-family:'Lilita One',sans-serif;font-size:24px;margin-top:6px}
.char .gm{font-size:14px;font-weight:600;color:var(--muted)}
.char .badge{position:absolute;top:-10px;right:-8px;font-size:26px;filter:drop-shadow(0 2px 0 var(--ink))}
.char.soon{cursor:default;opacity:.75;display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed;box-shadow:none}
.char.soon .q{font-family:'Lilita One',sans-serif;font-size:64px;line-height:1}

/* ---------- Intro ---------- */
#intro{align-items:center;justify-content:center;padding:20px 18px 26px;gap:12px;cursor:pointer}
.bubble{position:relative;background:#fff;color:#1b2a3a;border:4px solid var(--ink);border-radius:24px;padding:16px 20px;
  font-size:clamp(18px,5vw,23px);font-weight:600;line-height:1.3;box-shadow:0 6px 0 var(--ink);max-width:520px;width:100%;min-height:5.2em}
.bubble::after{content:"";position:absolute;bottom:-22px;left:50%;margin-left:-14px;border:14px solid transparent;border-top:18px solid var(--ink)}
.bubble::before{content:"";position:absolute;bottom:-13px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:12px solid #fff;z-index:1}
.intro-av{width:min(58vw,270px);margin-top:10px}
.intro-av .av{max-height:40vh}
#introAv{animation:pop .5s ease}
.intro-name{font-family:'Lilita One',sans-serif;font-size:34px}
.go{visibility:hidden}
.go.show{visibility:visible;animation:pop .3s ease}

/* ---------- Jeu ---------- */
.hud{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);border-bottom:4px solid var(--ink)}
.hud .x{flex:none;width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:var(--coral);color:#fff;font-weight:700;font-size:20px;cursor:pointer}
.hud .ht{flex:1;min-width:0;font-family:'Lilita One',sans-serif;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .hi{flex:none;font-weight:700;font-size:16px;background:var(--yellow);color:#1b2a3a;border:3px solid var(--ink);border-radius:12px;padding:5px 10px;white-space:nowrap}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#stage canvas{display:block}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,25,40,.6);z-index:5;padding:20px}
.overlay.show{display:flex}
.endcard{background:var(--card);color:var(--text);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:22px;text-align:center;max-width:360px;width:100%;animation:pop .4s ease}
.endcard .emo{font-size:58px;line-height:1}
.endcard h3{font-family:'Lilita One',sans-serif;font-weight:400;font-size:34px;margin:6px 0}
.endcard p{font-size:17px;font-weight:500;line-height:1.4;margin:0 0 18px}
.endbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font-weight:700;font-size:18px;padding:12px 20px;border-radius:16px;border:4px solid var(--ink);background:var(--yellow);color:#1b2a3a;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.alt{background:#fff}

/* ---------- Jeux à cartes ---------- */
.cardgame{height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 16px 18px;gap:12px;color:#1b2a3a;
  background:linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px) 0 0/34px 34px,linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px) 0 0/34px 34px,linear-gradient(#9fe0fb,#4dbbe9)}
.cardgame.bar{background:linear-gradient(90deg,rgba(120,60,20,.12) 50%,transparent 50%) 0 0/60px 100%,linear-gradient(#ffe3a8,#f0a457)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots span{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dots span.ok{background:var(--green)}.dots span.ko{background:var(--coral)}
.cardwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.pcard{position:relative;height:min(100%,430px);aspect-ratio:3/4;max-width:88vw;background:#fff;border:5px solid var(--ink);border-radius:26px;
  box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;transition:transform .18s ease;cursor:grab}
.pcard.enter{animation:enter .35s ease}
.pcard.barcard{background:linear-gradient(#fff8e8,#ffe9bf)}
.avbox{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;padding-top:30px}
.avbox .av{height:100%;width:auto;max-width:94%}
.avbox.reveal .av{animation:reveal .45s ease}
.avbox.drunkwob .av{animation:wob 1.3s ease-in-out infinite;transform-origin:50% 100%}
.nameplate{width:100%;background:var(--yellow);border-top:5px solid var(--ink);font-family:'Lilita One',sans-serif;font-size:30px;text-align:center;padding:8px}
.verdict{position:absolute;top:10px;left:8px;right:8px;text-align:center;font-family:'Lilita One',sans-serif;font-size:24px;opacity:0;
  background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px}
.verdict.show{animation:pop .35s ease forwards}
.verdict.good{background:#c9f5d6}.verdict.bad{background:#ffd1d1}
.counter{position:relative;width:100%;height:20%;min-height:56px;background:linear-gradient(#c07a43,#8a4f25);border-top:5px solid var(--ink)}
.counter::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#d99a62;border-bottom:3px solid var(--ink)}
.glass{position:absolute;left:50%;top:-40px;font-size:50px;transform:translate(-50%,0);opacity:0}
.glass.serve{animation:serve .45s ease forwards}
.hint{font-weight:600;font-size:15px;text-align:center;max-width:420px}
.choices{display:flex;gap:12px;width:100%;max-width:420px}
.choice{flex:1;font-weight:700;font-size:17px;line-height:1.2;padding:12px 8px;border-radius:18px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;color:#1b2a3a}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.choice.left{background:#ffd1d1}.choice.right{background:#c9f5d6}
.choice.water{background:#c6ecff}.choice.beer{background:#ffe08a}
.choice .e{font-size:28px}
.timer{width:100%;max-width:420px;height:18px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.timer .fill{height:100%;width:100%;background:var(--green)}
.memo-title{font-family:'Lilita One',sans-serif;font-size:26px;text-align:center}
.memo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:460px;overflow-y:auto;min-height:0}
.mini{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 2px 4px;text-align:center}
.mini-nm{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-grid + .btn{margin-top:auto}

.findme{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,25,40,.55);padding:20px;z-index:3}
.fm-card{background:#fff;color:#1b2a3a;border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:16px 18px 20px;text-align:center;max-width:320px;width:100%;animation:pop .4s ease}
.fm-card .av{width:150px;margin:0 auto}
.fm-card h3{font-family:'Lilita One',sans-serif;font-weight:400;font-size:28px;margin:6px 0 4px}
.fm-card p{margin:0 0 14px;font-weight:500;line-height:1.35}
.okbtn{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:2;white-space:nowrap}
.okbtn:active{transform:translateX(-50%) translateY(3px)}

/* ---------- Collection de cartes ---------- */
.colbtn{margin-top:8px;font-weight:700;font-size:16px;padding:8px 16px;border-radius:14px;border:3px solid var(--ink);background:var(--yellow);color:#1b2a3a;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.colbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#collection{padding:12px 12px 0;gap:10px}
.col-head{display:flex;align-items:center;gap:10px}
.col-head h2{flex:1;font-family:'Lilita One',sans-serif;font-weight:400;font-size:26px;margin:0}
.col-head .x{flex:none;width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:var(--coral);color:#fff;font-weight:700;font-size:20px;cursor:pointer}
.col-count{font-weight:700;background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:4px 10px;white-space:nowrap}
.tabs{display:flex;gap:8px}
.tab{flex:1;font-weight:700;font-size:15px;padding:9px 6px;border-radius:14px;border:3px solid var(--ink);background:var(--card);color:var(--text);cursor:pointer}
.tab.on{background:var(--yellow);color:#1b2a3a;box-shadow:0 4px 0 var(--ink)}
.rarlegend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.rarlegend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);vertical-align:-2px;margin-right:4px}
.cscroll{flex:1;min-height:0;overflow-y:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;padding:6px 4px 24px;align-items:start}
.cmsg{grid-column:1/-1;text-align:center;background:var(--card);border:3px dashed var(--ink);border-radius:18px;padding:14px;font-weight:600;line-height:1.4}
/* La carte */
.tcard{--rc:#9aa7b4;--rc2:#e6ebf0;position:relative;aspect-ratio:63/88;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(160deg,var(--rc2),var(--rc));
  box-shadow:0 4px 0 var(--ink);padding:6px;display:flex;flex-direction:column;gap:4px;color:#1b2a3a;cursor:pointer;overflow:hidden;font-size:10px;container-type:inline-size;text-align:left}
.tcard.r-R{--rc:#3c8ee6;--rc2:#bfe0ff}
.tcard.r-E{--rc:#8a4fe0;--rc2:#e3d2ff}
.tcard.r-L{--rc:#e0a400;--rc2:#fff1b0}
.tc-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:7.5cqw}
.tc-num{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 5px}
.tc-rar{color:#1b2a3a;letter-spacing:-1px;font-size:8cqw}
.tc-art{position:relative;flex:1;min-height:0;border-radius:8px;border:2px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.tc-art .av{width:auto;height:92%;max-width:96%}
.tc-art .duo .av{width:50%;height:auto}
.tc-emo{position:absolute;top:4%;right:5%;font-size:17cqw;filter:drop-shadow(0 2px 0 rgba(27,42,58,.4))}
.tc-name{font-family:'Lilita One',sans-serif;font-size:10.5cqw;line-height:1.05;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px 5px}
.tc-who{font-weight:700;font-size:7.5cqw;opacity:.85;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-txt{display:none;font-size:6.6cqw;font-weight:500;line-height:1.3;background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:8px;padding:4px 6px}
.tc-foot{display:none;justify-content:space-between;font-size:5.6cqw;font-weight:700;opacity:.75;padding:0 2px}
.tcard.big{width:min(78vw,330px);font-size:14px;cursor:default;box-shadow:0 8px 0 var(--ink);transition:transform .08s;transform-style:preserve-3d}
.tcard.big .tc-txt,.tcard.big .tc-foot{display:block}.tcard.big .tc-foot{display:flex}
.tcard.big .tc-art{flex:none;height:46%}
.tcard.r-L::after,.tcard.r-E::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.55;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.9) 35%,rgba(255,120,220,.6) 42%,rgba(120,220,255,.6) 50%,rgba(255,255,140,.6) 58%,transparent 70%);background-size:250% 250%;
  background-position:var(--hx,0%) var(--hy,0%);animation:holo 4s ease-in-out infinite}
.tcard.r-E::after{opacity:.3}
.tcard.big::after{animation:none}
@keyframes holo{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.tcard.mg{background:linear-gradient(160deg,color-mix(in srgb,var(--bc) 35%,#fff),var(--bc))}

.tcard.mem{background:linear-gradient(160deg,var(--rc2),var(--rc))}
.tcard.mem .tc-art{background:#d9d2c6}
.tcard.mem .tc-art img{width:100%;height:100%;object-fit:cover;display:block}
/* Toutes les cartes membres en grand ont la même taille ; l'image est recadrée au format 4:5 */
.tcard.big.mem{aspect-ratio:0.53;height:auto;width:min(78vw,330px,calc((100vh - 230px)*0.53))}
.tcard.big.mem:not(.full) .tc-art{flex:none;height:auto;aspect-ratio:4/5}
.tcard.big.mem:not(.full) .tc-txt{flex:1;min-height:0;overflow:hidden}
.tcard.big.mem .tc-who{display:none}
.tcard.big.mem .tc-txt{font-size:5cqw;line-height:1.3}
.tcard.big.mem .tc-name{font-size:10cqw}
.tcard.big.mem .tc-txt.long{font-size:4.5cqw;line-height:1.28}
.tcard.big.mem .tc-txt.xlong{font-size:4.1cqw;line-height:1.24}
.tcard.big.mem .tc-txt.xxlong{font-size:3.7cqw;line-height:1.22}
.tcard.mem .tc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard.big.mem .tc-name{white-space:normal}
.tcard.mem:not(.big):not(.full) .tc-name.lng{white-space:normal;font-size:8.6cqw;line-height:1.05}
.tcard.full{padding:0;justify-content:space-between}
/* Images montrées en entier (avec un fond flou pour remplir) */
.tcard .fitbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(10px) brightness(.85) saturate(1.1);transform:scale(1.2)}
.tcard.mem .tc-art img.fitimg{position:relative;object-fit:contain}
.tcard.full.fit .fullimg{object-fit:contain}

.tcard.full .fullimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tcard.full .tc-top{position:relative;z-index:1;padding:6px}
.tcard.full .tc-rar{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 5px}
.tcard.full .tc-name{position:relative;z-index:1;margin:6px;text-align:center;white-space:normal}
.tcard.mem .tc-name{font-size:12cqw}
.tcard.locked.r-E .lh,.tcard.locked.r-L .lh,.tcard.locked.r-R .lh{color:#ffd86b}
.tcard.locked{background:repeating-linear-gradient(45deg,#2b3a55 0 8px,#24324a 8px 16px);color:#fff;align-items:center;justify-content:center;text-align:center}
.tcard.locked::after{display:none}
.tcard.locked .lq{font-family:'Lilita One',sans-serif;font-size:34cqw;line-height:1;opacity:.85}
.tcard.locked .lh{font-size:7cqw;font-weight:700;opacity:.8;padding:0 4px}

<!-- ===== Raccourci sur l'écran d'accueil (site GitHub uniquement) ===== -->
<script>
(function(){
  if(!/github\.io$/.test(location.hostname))return;
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  const LS={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};
  const ua=navigator.userAgent||'';
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document);
  const inApp=/FBAN|FBAV|Instagram|Line\/|WhatsApp|Snapchat|TikTok|; wv\)/i.test(ua);
  let deferred=null;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});
  addEventListener('appinstalled',()=>LS.set('gg-install','done'));
  if(standalone)LS.set('gg-install','done');
  function card(html){const d=document.createElement('div');d.className='ggpop';d.innerHTML=`<div class="ggcard">${html}</div>`;document.getElementById('app').appendChild(d);return d;}
  function steps(){
    if(inApp)return `<p>Tu as ouvert le jeu depuis une appli (WhatsApp, Instagram…).<br>Touche <b>⋮</b> ou <b>…</b> puis <b>« Ouvrir dans le navigateur »</b> (Safari ou Chrome), et reviens ici.</p>`;
    if(ios)return `<p style="text-align:left">1. Touche le bouton <b>Partager</b> <span style="display:inline-block;border:2px solid currentColor;border-radius:5px;padding:0 5px">⬆</span> en bas de Safari<br>2. Choisis <b>« Sur l'écran d'accueil »</b><br>3. Touche <b>Ajouter</b></p>`;
    return `<p style="text-align:left">1. Touche le menu <b>⋮</b> en haut à droite de Chrome<br>2. Choisis <b>« Ajouter à l'écran d'accueil »</b> ou <b>« Installer l'application »</b><br>3. Confirme</p>`;}
  window.GGinstall=function(force){
    if(standalone){if(force)alert('Le Gambetta Game est déjà sur ton écran d\'accueil 👍');return;}
    const d=card(`<div style="width:84px;margin:0 auto 6px"><img src="icon-192.png" alt="" style="width:100%;border-radius:20px;border:3px solid #1b2a3a"></div>
      <h3>Ajouter le jeu<br>à ton écran d'accueil ?</h3><p>Tu le retrouveras comme une appli, sans chercher le lien.</p><div id="giHelp"></div>
      <button class="btn" id="giYes">📲 Oui, l'ajouter</button><button class="btn alt" id="giNo">Plus tard</button>`);
    d.querySelector('#giNo').onclick=()=>{LS.set('gg-install','later:'+Date.now());d.remove();};
    d.querySelector('#giYes').onclick=async()=>{
      if(deferred){deferred.prompt();const r=await deferred.userChoice.catch(()=>({}));deferred=null;
        if(r&&r.outcome==='accepted'){LS.set('gg-install','done');d.remove();return;}}
      const b=d.querySelector('#giYes');b.remove();d.querySelector('#giNo').textContent='C\'est fait / Fermer';
      d.querySelector('#giHelp').innerHTML='<h3 style="font-size:20px;margin-top:10px">Comment faire :</h3>'+steps();
      d.querySelector('#giNo').onclick=()=>{LS.set('gg-install','done');d.remove();};};
  };
  // Proposé tout seul à la première visite (puis une fois par semaine si « Plus tard »), quand aucune autre fenêtre n'est ouverte
  const st=LS.get('gg-install');if(standalone||st==='done')return;
  if(st&&st.startsWith('later:')&&Date.now()-(+st.slice(6))<7*864e5)return;
  let tries=0;const t=setInterval(()=>{tries++;if(tries>120){clearInterval(t);return;}
    const sel=document.getElementById('select');if(!sel||!sel.classList.contains('active'))return;
    if(document.querySelector('.ggpop,.giftpop,.trsheet'))return;clearInterval(t);setTimeout(()=>{if(!document.querySelector('.ggpop,.giftpop'))GGinstall(false);},1200);},1000);
})();
</script>

<script>
(function(){
  if(window.claude||!window.firebase)return; // dans Claude, le jeu garde sa sauvegarde Claude
  const ADMIN_EMAIL='matheo.schell57@gmail.com';
  const firebaseConfig={
    apiKey:"AIzaSyARSLTTINMQPdvx8oEGAnqM6P4FvA4-8eA",
    authDomain:"gambetta-game.firebaseapp.com",
    projectId:"gambetta-game",
    storageBucket:"gambetta-game.firebasestorage.app",
    messagingSenderId:"650369270455",
    appId:"1:650369270455:web:99cfb495879d2ad5778332"
  };
  let auth,fs;
  try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();fs=firebase.firestore();}catch(e){return;}
  const LS={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};
  const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const rnd=n=>Array.from(crypto.getRandomValues(new Uint32Array(n)),x=>AL[x%AL.length]).join('');
  const normCode=c=>{c=(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.startsWith('GMB'))c=c.slice(3);return c?'GMB-'+c:'';};
  const GG=window.GG={code:null,pid:null,name:null,admin:false};
  const NAMES={};
  const domReady=()=>new Promise(r=>document.readyState!=='loading'?r():document.addEventListener('DOMContentLoaded',r));
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function pop(html){const d=document.createElement('div');d.className='ggpop';d.innerHTML=`<div class="ggcard">${html}</div>`;(document.getElementById('app')||document.body).appendChild(d);return d;}

  const waitAuth=new Promise(res=>{const un=auth.onAuthStateChanged(u=>{if(u){un();res(u);}else auth.signInAnonymously().catch(()=>{un();res(null);});});});

  async function loadPlayer(code){const s=await fs.doc('players/'+code).get();return s.exists?s.data():null;}

  // Première visite : choisir un pseudo, ou reprendre une partie avec un code
  async function askPlayer(){await domReady();
    return new Promise(resolve=>{
      const d=pop(`<div class="emo">🏊</div><h3>Bienvenue !</h3><p>Choisis ton pseudo pour les classements.</p>
        <input class="ainput" id="ggName" maxlength="20" placeholder="Ton prénom ou pseudo" autocomplete="off">
        <div class="ggerr" id="ggErr"></div>
        <button class="btn" id="ggGo">C'est parti !</button>
        <button class="gglink" id="ggHave">J'ai déjà un code de sauvegarde</button>`);
      const err=m=>{d.querySelector('#ggErr').textContent=m;};
      d.querySelector('#ggGo').onclick=async()=>{const name=d.querySelector('#ggName').value.trim().slice(0,20);if(!name)return err('Écris ton pseudo 🙂');
        const b=d.querySelector('#ggGo');b.disabled=true;b.textContent='…';
        try{const code='GMB-'+rnd(6),data={pid:rnd(14),code,name,col:null,created:Date.now(),at:Date.now()};
          await fs.doc('players/'+code).set(data);d.remove();showCode(code,name,true);resolve({code,data});}
        catch(e){b.disabled=false;b.textContent="C'est parti !";err('Pas de connexion… réessaie.');}};
      d.querySelector('#ggHave').onclick=()=>{d.remove();askCode(resolve,true);};
    });}
  function askCode(resolve,first){
    const d=pop(`<div class="emo">🔑</div><h3>Mon code</h3><p>Tape le code de sauvegarde que le jeu t'a donné.</p>
      <input class="ainput" id="ggCode" maxlength="12" placeholder="GMB-XXXXXX" autocomplete="off" autocapitalize="characters">
      <div class="ggerr" id="ggErr"></div>
      <button class="btn" id="ggOk">Récupérer ma partie</button>
      <button class="gglink" id="ggBack">${first?'Je n\'ai pas de code':'Annuler'}</button>`);
    const err=m=>{d.querySelector('#ggErr').textContent=m;};
    d.querySelector('#ggOk').onclick=async()=>{const code=normCode(d.querySelector('#ggCode').value);if(code.length<10)return err('Le code ressemble à GMB-XXXXXX');
      try{const data=await loadPlayer(code);if(!data)return err('Code inconnu 🤔 Vérifie les lettres.');
        d.remove();if(first)resolve({code,data});else{LS.set('gg-code',code);location.reload();}}
      catch(e){err('Pas de connexion… réessaie.');}};
    d.querySelector('#ggBack').onclick=()=>{d.remove();if(first)askPlayer().then(resolve);};
  }
  function showCode(code,name,isNew){
    const d=pop(`<div class="emo">${isNew?'🎉':'🔑'}</div><h3>${isNew?'Garde ce code !':'Ma sauvegarde'}</h3>
      <p>${isNew?'C\'est ton code de sauvegarde. Il te permet de retrouver ta partie sur un autre téléphone.':`Joueur : <b>${esc(name)}</b><br>Ton code de sauvegarde :`}</p>
      <div class="ggcode">${code}</div>
      <button class="btn" id="ggCopy">📋 Copier le code</button>
      ${isNew?'':`<button class="btn alt" id="ggOther">Utiliser un autre code</button>`}
      <button class="btn alt" id="ggClose">${isNew?'C\'est noté !':'Fermer'}</button>
      ${isNew||!window.GGinstall?'':`<button class="btn alt" id="ggInst">📲 Ajouter à l'écran d'accueil</button>`}
      ${isNew?'':`<button class="gglink" id="ggAdmin">${GG.admin?'Admin connecté ✅ · Se déconnecter':'Connexion admin'}</button>`}`);
    d.querySelector('#ggCopy').onclick=e=>{try{navigator.clipboard.writeText(code);e.target.textContent='Copié ✅';}catch(_){}};
    d.querySelector('#ggClose').onclick=()=>d.remove();
    const gi=d.querySelector('#ggInst');if(gi)gi.onclick=()=>{d.remove();GGinstall(true);};
    const o=d.querySelector('#ggOther');if(o)o.onclick=()=>{d.remove();askCode(null,false);};
    const a=d.querySelector('#ggAdmin');if(a)a.onclick=async()=>{
      if(GG.admin){await auth.signOut();location.reload();return;}
      const p=new firebase.auth.GoogleAuthProvider();
      try{await auth.signInWithPopup(p);location.reload();}
      catch(e){if(e&&e.code==='auth/popup-blocked')auth.signInWithRedirect(p);else a.textContent='Connexion impossible : '+(e&&e.code||'erreur');}};
  }

  const READY=(async()=>{try{
    const u=await waitAuth;if(!u)return false;
    GG.admin=!!(u.email&&u.email.toLowerCase()===ADMIN_EMAIL&&u.emailVerified);
    // Remise à zéro décidée par l'admin : on nettoie aussi la copie gardée sur ce téléphone
    try{const ss=await fs.doc('gifts/season').get();const se=ss.exists?ss.data():null;const mine=LS.get('gg-season');
      if(se&&String(se.n)!==mine){LS.set('gg-season',String(se.n));
        if(LS.get('gambetta-col')){
          if(se.mode==='all'){['gambetta-col','gambetta-wins','gg-code'].forEach(k=>{try{localStorage.removeItem(k);}catch(_){}});}
          else{try{const c=JSON.parse(LS.get('gambetta-col'));c.best={};c.wins_n={};LS.set('gambetta-col',JSON.stringify(c));}catch(_){}}
          location.reload();return false;}}}catch(_){}
    let code=LS.get('gg-code'),data=null;
    if(code){try{data=await loadPlayer(code);}catch(_){return false;}}
    if(!data){const r=await askPlayer();code=r.code;data=r.data;}
    LS.set('gg-code',code);GG.code=code;GG.pid=data.pid;GG.name=data.name;NAMES[data.pid]=data.name;
    await fs.doc('owners/'+data.pid).set({uid:auth.currentUser.uid,code});
    return true;}catch(e){console.warn('Firebase',e);return false;}})();

  // Même interface que la sauvegarde Claude, pour que le jeu n'ait rien à changer
  const wrapSnap=s=>({exists:s.exists,data:()=>s.data()});
  const DB={
    doc(path){
      if(/^data\/users\/[^/]+\/collection$/.test(path))return{
        get:async()=>{const s=await fs.doc('players/'+GG.code).get();const d=s.exists?s.data():{};return{exists:!!d.col,data:()=>d.col};},
        set:o=>fs.doc('players/'+GG.code).set({pid:GG.pid,code:GG.code,name:GG.name,col:o,at:Date.now()})};
      const r=fs.doc(path);
      return{get:async()=>wrapSnap(await r.get()),set:o=>r.set(path.startsWith('board/')?Object.assign({},o,{name:GG.name}):o)};},
    collection(name){return{onSnapshot(cb,err){return fs.collection(name).onSnapshot(q=>{const docs=q.docs.map(d=>{const v=d.data();if(name==='board'&&v&&v.name)NAMES[d.id]=v.name;return{id:d.id,data:()=>v};});cb({docs});},err||(()=>{}));}};}
  };
  const USER={id:async()=>GG.pid,isOwner:async()=>GG.admin,profiles:async ids=>{const o={};ids.forEach(i=>o[i]={name:NAMES[i]||''});return o;}};
  window.claude={use:async n=>{const ok=await READY;if(!ok)return null;return n==='db'?DB:n==='user'?USER:null;}};

  // Échanges de cartes entre joueurs
  GG.trades={
    listen(cb){let inc=[],out=[];const fire=()=>cb(inc,out);const map=q=>q.docs.map(d=>Object.assign({id:d.id},d.data()));
      fs.collection('trades').where('to','==',GG.pid).onSnapshot(q=>{inc=map(q);fire();},()=>{});
      fs.collection('trades').where('from','==',GG.pid).onSnapshot(q=>{out=map(q);fire();},()=>{});},
    create(o){return fs.collection('trades').add(Object.assign({from:GG.pid,fromName:GG.name,st:'wait',done:false,at:Date.now()},o));},
    set(id,patch){return fs.doc('trades/'+id).update(patch);}
  };
  // Outils admin : codes de tout le monde et sauvegarde complète
  GG.codes=async()=>{if(!GG.admin)return{};const q=await fs.collection('owners').get();const o={};q.docs.forEach(d=>o[d.id]=d.data().code);return o;};
  GG.backup=async()=>{if(!GG.admin)return;const out={date:new Date().toISOString()};
    for(const c of ['players','board','gifts','owners','trades']){const q=await fs.collection(c).get();out[c]={};q.docs.forEach(d=>out[c][d.id]=d.data());}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
    a.download='gambetta-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();};

  // Remise à zéro (admin) : 3 confirmations avant d'effacer
  async function wipe(col){const q=await fs.collection(col).get();let batch=fs.batch(),n=0;
    for(const d of q.docs){if(col==='gifts'&&d.id==='season')continue;batch.delete(d.ref);if(++n%400===0){await batch.commit();batch=fs.batch();}}await batch.commit();}
  GG.resetFlow=()=>{if(!GG.admin)return;let mode=null;
    const d=pop(`<div class="emo">⚠️</div><h3>Réinitialiser</h3><p>Que veux-tu effacer ?</p>
      <button class="btn alt" data-m="ranks">🏆 Les classements seulement<br><small style="font-weight:500">Les joueurs gardent leurs cartes</small></button>
      <button class="btn alt" data-m="all" style="margin-top:8px">🗑️ Tout effacer<br><small style="font-weight:500">Joueurs, cartes, classements, cadeaux</small></button>
      <button class="gglink" id="ggNo">Annuler</button>`);
    d.querySelector('#ggNo').onclick=()=>d.remove();
    d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;step1();});
    const what=()=>mode==='all'?'TOUTES les données (joueurs, codes, cartes, classements, cadeaux)':'tous les classements';
    function step1(){d.querySelector('.ggcard').innerHTML=`<div class="emo">🤔</div><h3>Tu es sûr ?</h3>
      <p>Tu vas effacer <b>${what()}</b>. Ce sera définitif.</p><p>Conseil : télécharge d'abord une sauvegarde.</p>
      <button class="btn alt" id="ggBk">💾 Télécharger une sauvegarde</button>
      <button class="btn" id="ggNext" style="margin-top:8px">Oui, continuer</button><button class="gglink" id="ggNo">Annuler</button>`;
      d.querySelector('#ggNo').onclick=()=>d.remove();
      d.querySelector('#ggBk').onclick=async e=>{e.target.textContent='Préparation…';try{await GG.backup();e.target.textContent='Sauvegarde téléchargée ✅';}catch(_){e.target.textContent='Échec, réessaie';}};
      d.querySelector('#ggNext').onclick=step2;}
    function step2(){d.querySelector('.ggcard').innerHTML=`<div class="emo">✍️</div><h3>Confirmation</h3>
      <p>Pour confirmer, tape <b>EFFACER</b> en majuscules.</p><input class="ainput" id="ggTyped" autocomplete="off" autocapitalize="characters">
      <button class="btn" id="ggNext" disabled>Continuer</button><button class="gglink" id="ggNo">Annuler</button>`;
      const i=d.querySelector('#ggTyped'),n=d.querySelector('#ggNext');i.oninput=()=>{n.disabled=i.value.trim()!=='EFFACER';};
      d.querySelector('#ggNo').onclick=()=>d.remove();n.onclick=step3;}
    function step3(){let s=5;d.querySelector('.ggcard').innerHTML=`<div class="emo">🛑</div><h3>Dernière chance</h3>
      <p>Effacer <b>${what()}</b> ?<br>Impossible de revenir en arrière.</p>
      <button class="btn" id="ggGo" disabled style="background:var(--red);color:#fff">Effacer définitivement (5)</button><button class="gglink" id="ggNo">Non, annuler</button>`;
      const g=d.querySelector('#ggGo');d.querySelector('#ggNo').onclick=()=>{clearInterval(tm);d.remove();};
      const tm=setInterval(()=>{s--;if(s>0)g.textContent=`Effacer définitivement (${s})`;else{clearInterval(tm);g.textContent='Effacer définitivement';g.disabled=false;}},1000);
      g.onclick=async()=>{g.disabled=true;g.textContent='Effacement…';
        try{await wipe('board');if(mode==='all'){await wipe('players');await wipe('owners');await wipe('gifts');await wipe('trades');}
          const ss=await fs.doc('gifts/season').get();const n=((ss.exists&&ss.data().n)||0)+1;
          await fs.doc('gifts/season').set({n,mode,at:Date.now()});
          ['gambetta-col','gambetta-wins','gg-code'].forEach(k=>{if(mode==='all')try{localStorage.removeItem(k);}catch(_){}});LS.set('gg-season',String(n));
          if(mode!=='all'){try{const c=JSON.parse(LS.get('gambetta-col'));c.best={};c.wins_n={};LS.set('gambetta-col',JSON.stringify(c));}catch(_){}}
          d.querySelector('.ggcard').innerHTML=`<div class="emo">✅</div><h3>C'est fait</h3><p>${mode==='all'?'Tout a été effacé. Chaque joueur repartira de zéro à sa prochaine visite.':'Les classements sont remis à zéro.'}</p><button class="btn" id="ggOk">OK</button>`;
          d.querySelector('#ggOk').onclick=()=>location.reload();}
        catch(e){g.disabled=false;g.textContent='Échec, réessaie';}};}
  };

  // Bouton « Ma sauvegarde » sur l'écran des persos
  domReady().then(async()=>{const box=document.querySelector('.selbtns');if(!box)return;
    const b=document.createElement('button');b.className='colbtn save';b.textContent='🔑 Ma sauvegarde';b.hidden=true;box.appendChild(b);
    b.onclick=()=>showCode(GG.code,GG.name,false);if(await READY)b.hidden=false;});
})();
</script>

function drawHall(ctx,x,y,w,h){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  const cH=h*0.34,wallY=y+cH,trimY=y+h*0.72,winY=y+h*0.52;
  ctx.fillStyle='#efe9df';ctx.fillRect(x,y,w,cH);
  for(let r=0;r<2;r++)for(let c=-1;c<6;c++){const px=x+c*w/5+(r?w/10:0),py=y+cH*(0.15+r*0.45);ctx.fillStyle='#fff';ctx.strokeStyle='rgba(27,42,58,.22)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+w*0.16,py-cH*0.06);ctx.lineTo(px+w*0.16,py+cH*0.16);ctx.lineTo(px,py+cH*0.22);ctx.closePath();ctx.fill();ctx.stroke();}
  ctx.strokeStyle='#8a5a35';ctx.lineWidth=Math.max(4,h*0.03);for(let k=-2;k<8;k++){ctx.beginPath();ctx.moveTo(x+k*w/5,y);ctx.lineTo(x+k*w/5+w*0.25,y+cH);ctx.stroke();}
  ctx.fillStyle='#7a4e2e';ctx.fillRect(x,y+cH-4,w,6);
  ctx.fillStyle='#f6f7f8';ctx.fillRect(x,wallY,w,h-cH);
  const ts=Math.max(8,w/32);ctx.strokeStyle='rgba(120,140,160,.18)';ctx.lineWidth=1;
  for(let xx=x;xx<x+w;xx+=ts){ctx.beginPath();ctx.moveTo(xx,wallY);ctx.lineTo(xx,winY);ctx.stroke();}
  for(let yy=wallY;yy<winY;yy+=ts){ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke();}
  const by=wallY+(winY-wallY)*0.3;for(let xx=x,n=0;xx<x+w;xx+=ts,n++){if(n%3===1)continue;ctx.fillStyle=['#7f9fc4','#c9d2dc','#5f86b6','#e3e8ee'][(n*7)%4];ctx.fillRect(xx,by+(n%2?ts*0.8:0),ts,ts*0.8);}
  ctx.fillStyle='#d5ecd0';ctx.fillRect(x,winY,w,trimY-winY);ctx.fillStyle='#9fd08f';
  for(let xx=x;xx<x+w;xx+=w/7){ctx.beginPath();ctx.ellipse(xx+w/14,trimY,w/15,(trimY-winY)*0.55,0,Math.PI,0);ctx.fill();}
  ctx.strokeStyle='#8a5a35';ctx.lineWidth=3;for(let xx=x;xx<=x+w+1;xx+=w/7){ctx.beginPath();ctx.moveTo(xx,winY);ctx.lineTo(xx,trimY);ctx.stroke();}
  const th=Math.max(5,h*0.05);ctx.fillStyle='#8a5a35';ctx.fillRect(x,trimY,w,th);ctx.fillStyle='#f2f0eb';ctx.fillRect(x,trimY+th,w,h);
  ctx.restore();
}
function svgImg(svg){const i=new Image();i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);return i;}
function drawImg(ctx,img,x,y,w,h){if(img.complete&&img.naturalWidth)ctx.drawImage(img,x,y,w,h);}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function bubbleText(ctx,x,y,txt,size){
  size=size||13;ctx.font=`700 ${size}px Fredoka, sans-serif`;
  const w=ctx.measureText(txt).width+16,h=size+12;
  x=Math.max(w/2+4,Math.min(ctx.canvas.width/(ctx.getTransform().a||1)-w/2-4,x));

}
function floatText(ctx,f){
  ctx.save();ctx.globalAlpha=Math.max(0,1-f.t/1.2);ctx.font='22px "Lilita One", Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';

}
function makeCanvas(stage){
  const c=document.createElement('canvas');stage.appendChild(c);
  const ctx=c.getContext('2d');const o={c,ctx,W:300,H:300};
  o.fit=()=>{const r=stage.getBoundingClientRect();const d=Math.min(window.devicePixelRatio||1,2);
    o.W=Math.max(1,r.width);o.H=Math.max(1,r.height);c.width=Math.round(o.W*d);c.height=Math.round(o.H*d);
    c.style.width=o.W+'px';c.style.height=o.H+'px';ctx.setTransform(d,0,0,d,0,0);};
  o.fit();window.addEventListener('resize',o.fit);
  o.destroy=()=>window.removeEventListener('resize',o.fit);
  o.pt=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  return o;
}

    drawImg(ctx,s.img,x-r,y-r,r*2,r*2);
    
    if(!carried&&Math.sin(s.ph*0.35)>0.55)bubbleText(ctx,x,y-r-16,"À l'aide !");
  }
  function drawBuoy(x,y,r){
    ctx.lineWidth=r*0.62;
    for(let k=0;k<4;k++){ctx.strokeStyle=k%2?'#fff':'#ff4d4d';ctx.beginPath();ctx.arc(x,y,r,k*Math.PI/2,(k+1)*Math.PI/2);ctx.stroke();}
    ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(x,y,r*1.31,0,7);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*0.69,0,7);ctx.stroke();
  }
  return{
    update(dt){
      if(over)return;t+=dt;time-=dt;
      const g=geo(),scale=Math.max(.8,cv.W/400),boost=1+saved*0.07;
      for(const s of sw){s.ph+=dt*5;if(s.st==='swim'){s.x+=s.v*scale*boost*dt;if(s.x>cv.W+50){s.x=-50;s.lane=(s.lane+1+Math.floor(Math.random()*3))%4;}}}
      if(sw.filter(s=>s.st!=='saved').length<3&&spawned<TOTAL){spawnT-=dt;if(spawnT<=0){spawn();spawnT=1.2;}}
      if(buoy.st==='idle')buoy.y=g.oy;
      else if(buoy.st==='down'){
        buoy.y+=cv.H*1.05*dt;
        for(const s of sw){if(s.st!=='swim')continue;const sy=laneY(s.lane);
          if(Math.abs(s.x-g.bx)<36&&Math.abs(sy-buoy.y)<26){s.st='carried';buoy.carry=s;buoy.st='up';fx.push({x:g.bx,y:sy-40,txt:'Attrapé !',t:0});break;}}
        if(buoy.y>cv.H-8)buoy.st='up';
      }else if(buoy.st==='up'){
        buoy.y-=cv.H*(buoy.carry?0.75:1.1)*dt;
        if(buoy.carry)buoy.carry.x+=(g.bx-buoy.carry.x)*Math.min(1,dt*10);
        if(buoy.y<=g.oy){
          buoy.y=g.oy;
          if(buoy.carry){buoy.carry.st='saved';saved++;fx.push({x:g.bx,y:g.oy-30,txt:'+1 sauvé !',t:0,c:'#7dffa8'});
            if(saved>=TOTAL){over=true;hud();api.end(true,'Bravo !',`Roland a sauvé tout le monde en ${Math.round(DUR-time)} secondes. Napoléon serait fier !`);}}
          buoy.carry=null;buoy.st='idle';
        }
      }
      for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>1.2)fx.splice(i,1);}
      if(!over&&time<=0){time=0;over=true;api.end(false,'Trop tard !',`Roland en a sauvé ${saved} sur ${TOTAL}. Il faut tous les ramener avant la fin du chrono !`);}
      hud();
    },
    draw(){
      const W=cv.W,H=cv.H,g=geo();ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#ece8df';ctx.fillRect(0,0,W,g.dy);
      ctx.strokeStyle='rgba(160,120,70,.25)';ctx.lineWidth=2;
      for(let x=0;x<W;x+=34){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,g.dy);ctx.stroke();}
      for(let y=0;y<g.dy;y+=34){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      drawHall(ctx,0,0,W,g.dy*0.6);const gr=ctx.createLinearGradient(0,g.dy,0,H);gr.addColorStop(0,'#4fd0d3');gr.addColorStop(1,'#1b9fb2');ctx.fillStyle=gr;ctx.fillRect(0,g.dy,W,H-g.dy);
      ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=3;
      for(let k=0;k<7;k++){const yy=g.dy+(H-g.dy)*(k+0.5)/7;ctx.beginPath();for(let x=0;x<=W;x+=12){const y=yy+Math.sin(x*0.04+t*2+k)*4;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
      for(let i=0;i<3;i++){const y=(laneY(i)+laneY(i+1))/2;for(let x=8,n=0;x<W;x+=18,n++){ctx.fillStyle=n%2?'#ff5d5d':'#ffd21f';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();}}
      ctx.fillStyle='#fff';ctx.fillRect(0,g.dy-6,W,10);for(let k=0;k<5;k++){const bx=W*(0.1+k*0.2)-14;if(Math.abs(bx+14-geo().bx)<40)continue;rr(ctx,bx,g.dy-16,28,12,3);ctx.fillStyle='#2f6fd0';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();ctx.fillStyle='#fff';ctx.font='700 9px Fredoka, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(k+1),bx+14,g.dy-10);}ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,g.dy+4);ctx.lineTo(W,g.dy+4);ctx.stroke();
      if(buoy.st==='idle'){ctx.save();ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(g.bx,g.oy+20);ctx.lineTo(g.bx,H);ctx.stroke();ctx.restore();}
      for(const s of sw){if(s.st==='saved'||s.st==='carried')continue;drawSwimmer(s,s.x,laneY(s.lane)+Math.sin(s.ph)*3,false);}
      drawImg(ctx,roland,g.bx-g.rw-2,g.dy-g.rh+8,g.rw,g.rh);
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(g.bx-g.rw*0.2,g.dy-g.rh*0.22);ctx.lineTo(g.bx,buoy.y);ctx.stroke();
      if(buoy.carry)drawSwimmer(buoy.carry,buoy.carry.x,buoy.y+8,true);
      drawBuoy(g.bx,buoy.y,15);
      for(const f of fx)floatText(ctx,f);
      if(t<4)bubbleText(ctx,W/2,H-30,'Touche l\'écran pour lancer la bouée !',15);
    },
    destroy(){cv.c.removeEventListener('pointerdown',onDown);cv.destroy();}
  };
}

/* ================= MINI-JEU 2 : CHRISTIAN ================= */
function gameChristian(stage,api){
  const list=makePeople(8).map(p=>Object.assign({},p,{cap:pick(CAPS)}));
  const n=list.length;let i=0,score=0,lock=true,over=false,pc,dots;
  const hud=()=>api.hud(`👤 ${Math.min(i+1,n)}/${n}  ⭐ ${score}`);
  function memo(){
    api.hud('🧠 Mémorise');
    stage.innerHTML=`<div class="cardgame"><div class="memo-title">Retiens qui a des cheveux !</div>
      <div class="memo-grid">${list.map(p=>`<div class="mini">${avatar(p.look)}<div class="mini-nm">${p.name}</div></div>`).join('')}</div>
      <button class="btn" id="ready">C'est bon, j'ai retenu !</button></div>`;
    stage.querySelector('#ready').onclick=play;
  }
  function play(){
    stage.innerHTML=`<div class="cardgame"><div class="dots">${list.map(()=>'<span></span>').join('')}</div>
      <div class="cardwrap"><div class="pcard" id="pc"></div></div>
      <div class="hint">Glisse la carte ou touche un bouton</div>
      <div class="choices"><button class="choice left" id="bl">⬅ Pas de<br>cheveux</button><button class="choice right" id="br">Des<br>cheveux ➡</button></div></div>`;
    pc=stage.querySelector('#pc');dots=stage.querySelectorAll('.dots span');
    stage.querySelector('#bl').onclick=()=>answer(false);stage.querySelector('#br').onclick=()=>answer(true);
    bindSwipe(pc,()=>lock||over,answer);show();
  }
  function show(){
    const p=list[i];
    pc.innerHTML=`<div class="avbox">${avatar(Object.assign({},p.look,{cap:p.cap}))}</div><div class="nameplate">${p.name}</div><div class="verdict"></div>`;
    pc.style.transform='';pc.classList.remove('enter');void pc.offsetWidth;pc.classList.add('enter');lock=false;hud();
  }
  function answer(hair){
    if(lock||over)return;lock=true;const p=list[i];const ok=hair===p.hair;if(ok)score++;
    dots[i].classList.add(ok?'ok':'ko');pc.classList.remove('enter');
    pc.style.transform=`translateX(${hair?40:-40}px) rotate(${hair?6:-6}deg)`;
    setTimeout(()=>{
      pc.style.transform='';const box=pc.querySelector('.avbox');box.innerHTML=avatar(p.look);box.classList.add('reveal');
      const v=pc.querySelector('.verdict');v.textContent=(ok?'✅ ':'❌ ')+(p.hair?'Des cheveux !':'Pas un cheveu !');v.className='verdict show '+(ok?'good':'bad');hud();
    },180);
    setTimeout(next,1500);
  }
  function next(){
    i++;
    if(i>=n){over=true;i=n-1;hud();const perfect=score===n;
      api.end(perfect,perfect?'Sans-faute !':'Presque !',`${score} bonnes réponses sur ${n}.`+(perfect?' Christian approuve, bonnet bien vissé !':' Il faut un sans-faute pour gagner.'));return;}
    show();
  }
  memo();
  return{destroy(){over=true;}};
}

/* ================= MINI-JEU 3 : LAETITIA ================= */
function gameLaetitia(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const DUR=40,MAX=3;
  let time=DUR,el=0,over=false,nextT=2,t=0;
  const pool=()=>{const pw=cv.W*0.6,ph=Math.min(cv.H*0.48,cv.W*0.95);return{x:(cv.W-pw)/2,y:cv.H*0.22,w:pw,h:ph};};
  const POSTS=[['t',0.25],['t',0.75],['l',0.5],['r',0.5],['b',0.25],['b',0.75]];
  function postPos(p,P){const m=34;
    if(p[0]==='t')return{x:P.x+P.w*p[1],y:P.y-m,nx:0,ny:-1};
    if(p[0]==='b')return{x:P.x+P.w*p[1],y:P.y+P.h+m,nx:0,ny:1};
    if(p[0]==='l')return{x:P.x-m,y:P.y+P.h*p[1],nx:-1,ny:0};
    return{x:P.x+P.w+m,y:P.y+P.h*p[1],nx:1,ny:0};}
  const staff=POSTS.map(p=>({p,dx:0,dy:0,st:'post',ux:0,uy:0,ph:Math.random()*6,say:'',
    img:svgImg(avatar(randLook({shirt:PINK,logo:true,whistle:true,beard:false,mustache:false,hair:pick(['short','long','curly','bun','pigtails'])})))}));
  const kids=[0,1,2,3].map(i=>{const l=randLook({hair:pick(['short','pigtails','curly']),beard:false,mustache:false,glasses:false,freckles:true});
    return{lane:i,f:Math.random(),d:Math.random()<.5?1:-1,v:0.15+Math.random()*0.12,ph:Math.random()*6,skin:l.skin,img:svgImg(avatar(l,{viewBox:'30 20 140 140'}))};});
  const laet=svgImg(avatar(CHARS.laetitia.look));const fx=[];
  const away=()=>staff.filter(s=>s.st==='leave').length;
  const hud=()=>api.hud(`⏱ ${Math.ceil(time)}s  🚨 ${away()}/${MAX}`);hud();
  function depart(){
    const c=staff.filter(s=>s.st==='post');if(!c.length)return;const s=pick(c);const pp=postPos(s.p,pool());
    const ang=(Math.random()<.5?-1:1)*(0.9+Math.random()*0.5);
    s.ux=pp.nx*Math.cos(ang)-pp.ny*Math.sin(ang);s.uy=pp.nx*Math.sin(ang)+pp.ny*Math.cos(ang);
    s.st='leave';s.say=pick(['Pause !','Je reviens !','Café ?','2 minutes !','Toilettes !','Snap !']);
  }
  const onDown=e=>{
    e.preventDefault();if(over)return;const q=cv.pt(e),P=pool();let best=null,bd=48;
    for(const s of staff){if(s.st!=='leave')continue;const pp=postPos(s.p,P);const d=Math.hypot(pp.x+s.dx-q.x,pp.y+s.dy-5-q.y);if(d<bd){bd=d;best=s;}}
    if(best){best.st='back';const pp=postPos(best.p,P);fx.push({x:pp.x+best.dx,y:pp.y+best.dy-40,txt:'Au boulot !',t:0});hud();}
  };
  cv.c.addEventListener('pointerdown',onDown);
  return{
    update(dt){
      if(over)return;t+=dt;el+=dt;time-=dt;
      const spd=(22+el*1.6)*Math.max(.8,cv.W/400);
      nextT-=dt;if(nextT<=0){depart();nextT=Math.max(0.5,2.3-el*0.045)*(0.7+Math.random()*0.6);}
      const P=pool();
      for(const s of staff){
        s.ph+=dt*6;const pp=postPos(s.p,P);
        if(s.st==='leave'){
          s.dx+=s.ux*spd*dt;s.dy+=s.uy*spd*dt;let x=pp.x+s.dx,y=pp.y+s.dy;
          if(x<20||x>cv.W-20){s.ux*=-1;s.dx=Math.max(20,Math.min(cv.W-20,x))-pp.x;}
          if(y<34||y>cv.H-20){s.uy*=-1;s.dy=Math.max(34,Math.min(cv.H-20,y))-pp.y;}
          x=pp.x+s.dx;y=pp.y+s.dy;
          if(x>P.x-10&&x<P.x+P.w+10&&y>P.y-10&&y<P.y+P.h+10){s.dx-=s.ux*spd*dt*2;s.dy-=s.uy*spd*dt*2;s.ux*=-1;s.uy*=-1;}
        }else if(s.st==='back'){
          const d=Math.hypot(s.dx,s.dy),step=320*dt;
          if(d<=step){s.dx=0;s.dy=0;s.st='post';}else{s.dx-=s.dx/d*step;s.dy-=s.dy/d*step;}
        }
      }
      for(const k of kids){k.f+=k.d*k.v*dt;if(k.f>1){k.f=1;k.d=-1;}if(k.f<0){k.f=0;k.d=1;}k.ph+=dt*6;}
      for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>1.2)fx.splice(i,1);}
      if(away()>=MAX){over=true;hud();api.end(false,'Panique au bassin !','Trop de postes vides : les enfants ne sont plus surveillés. Laetitia va devoir se lever…');return;}
      if(time<=0){time=0;over=true;hud();api.end(true,'Bravo !',"Les enfants ont été surveillés jusqu'au bout, et Laetitia n'a pas levé le petit doigt !");return;}
      hud();
    },
    draw(){
      const W=cv.W,H=cv.H,P=pool();ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#e6f3f8';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(60,140,180,.18)';ctx.lineWidth=2;
      for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      rr(ctx,P.x-8,P.y-8,P.w+16,P.h+16,22);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
      const gr=ctx.createLinearGradient(0,P.y,0,P.y+P.h);gr.addColorStop(0,'#55d4d6');gr.addColorStop(1,'#1e9db1');
      rr(ctx,P.x,P.y,P.w,P.h,16);ctx.fillStyle=gr;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
      ctx.save();rr(ctx,P.x,P.y,P.w,P.h,16);ctx.clip();
      ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=3;
      for(let k=0;k<5;k++){const yy=P.y+P.h*(k+0.5)/5;ctx.beginPath();for(let x=P.x;x<=P.x+P.w;x+=10){const y=yy+Math.sin(x*0.05+t*2+k)*3;x===P.x?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();}
      const r=Math.min(18,P.h/9);
      for(const k of kids){
        const x=P.x+r+12+k.f*(P.w-2*r-24),y=P.y+P.h*(k.lane+0.5)/4+Math.sin(k.ph)*2;
        ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(x,y+r*0.8,r*1.5,r*0.4,0,0,7);ctx.fill();
        [-1,1].forEach(sd=>{const ax=x+sd*r*1.15,ay=y+r*0.35+Math.sin(k.ph*1.5+sd)*3;
          ctx.fillStyle='#ff8a3d';ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(ax,ay,r*0.42,r*0.32,0,0,7);ctx.fill();ctx.stroke();});
        drawImg(ctx,k.img,x-r,y-r,r*2,r*2);
        
      }
      ctx.restore();
      const sw=44,sh=sw*1.15;
      for(const s of staff){
        const pp=postPos(s.p,P);
        rr(ctx,pp.x-15,pp.y+10,30,9,4);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();
        if(s.st!=='post'){ctx.save();ctx.setLineDash([5,5]);ctx.strokeStyle='#ff4d4d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(pp.x,pp.y,20,0,7);ctx.stroke();ctx.restore();}
      }
      for(const s of staff){
        const pp=postPos(s.p,P),x=pp.x+s.dx,y=pp.y+s.dy;
        ctx.save();ctx.translate(x,y+20);if(s.st==='leave')ctx.rotate(Math.sin(s.ph*1.5)*0.12);
        drawImg(ctx,s.img,-sw/2,-sh,sw,sh);ctx.restore();
        if(s.st==='leave'){bubbleText(ctx,x,y-38,s.say,12);
          ctx.font='20px "Lilita One", Impact, sans-serif';ctx.fillStyle='#ff4d4d';ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.textAlign='center';ctx.strokeText('!',x+22,y-14);ctx.fillText('!',x+22,y-14);}
      }
      const lw=Math.min(74,W*0.18),lh=lw*1.15;
      rr(ctx,6,H-lh*0.45-6,lw+8,lh*0.45,8);ctx.fillStyle='#ffcf33';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
      drawImg(ctx,laet,10,H-lh-10,lw,lh);
      if(away()===MAX-1){ctx.strokeStyle=`rgba(255,60,60,${0.45+0.3*Math.sin(t*10)})`;ctx.lineWidth=10;ctx.strokeRect(5,5,W-10,H-10);}
      for(const f of fx)floatText(ctx,f);
      if(t<4)bubbleText(ctx,W/2,P.y-80>16?P.y-80:16,'Touche les jeunes qui quittent leur poste !',14);
    },
    destroy(){cv.c.removeEventListener('pointerdown',onDown);cv.destroy();}
  };
}

/* ================= MINI-JEU 4 : MARCEL ================= */
/* lvl de 0 (début, signes évidents) à 1 (fin, un seul petit signe) */
function makeClient(tp,lvl){
  const b=randLook({sunglasses:false});
  const decoy=()=>{const r=Math.random();if(r<.25)b.sunglasses=true;else if(r<.5)b.hat=pick(SHIRTS);else if(r<.6)b.earrings=true;};
  const nSigns=lvl<.34?3:lvl<.67?2:1;
  if(tp==='kid'){
    Object.assign(b,{kid:true,kidScale:lvl<.5?.7:.8,hair:pick(['short','pigtails','curly']),beard:false,mustache:false,glasses:false});
    const extra=shuffle(['freckles','star','lollipop']).slice(0,Math.max(0,nSigns-1));extra.forEach(k=>b[k]=true);
    if(lvl>.5)decoy();
  }else if(tp==='swimmer'){
    const signs=shuffle(['cap','goggles','towel']).slice(0,nSigns);
    signs.forEach(k=>b[k]=k==='cap'?pick(CAPS):true);
    if(!b.cap&&Math.random()<.4)decoy();
  }else if(tp==='drunk'){
    b.glasses=false;shuffle(['sleepy','flush','redNose','hic','wob']).slice(0,nSigns).forEach(k=>b[k]=true);
    if(Math.random()<.4)decoy();
  }else if(tp==='marcel'){
    return Object.assign({},CHARS.marcel.look);
  }else{
    decoy();if(Math.random()<.3)decoy();
  }
  return b;
}
function gameMarcel(stage,api){
  const types=shuffle(['adult','adult','adult','adult','adult','kid','kid','kid','swimmer','swimmer','swimmer','drunk','drunk','drunk','marcel']);
  const N=types.length;
  const clients=types.map((tp,i)=>({tp,look:makeClient(tp,i/(N-1))}));
  let i=0,lock=true,over=false,tl=0,tmax=3;
  const REASON={kid:"C'était un enfant ! Pas de bière pour les petits.",swimmer:"Il allait nager ! Bonnet, lunettes ou serviette : il fallait de l'eau.",
    drunk:"Il avait déjà trop bu ! De l'eau, et vite.",adult:"Cet adulte avait droit à sa bière… Marcel n'est pas content.",
    marcel:"C'était Marcel ! Il voulait SA bière."};
  stage.innerHTML=`<div class="cardgame bar"><div class="dots">${clients.map(()=>'<span></span>').join('')}</div>
    <div class="timer"><div class="fill" id="fill"></div></div>
    <div class="cardwrap"><div class="pcard barcard" id="pc"></div></div>
    <div class="hint">Eau : enfant, nageur ou trop bu. Bière : les autres. Attention aux détails !</div>
    <div class="choices"><button class="choice water" id="bw"><span class="e">💧</span><br>Eau</button><button class="choice beer" id="bb"><span class="e">🍺</span><br>Bière</button></div></div>`;
  const pc=stage.querySelector('#pc'),fill=stage.querySelector('#fill'),dots=stage.querySelectorAll('.dots span');
  stage.querySelector('#bw').onclick=()=>answer(false);stage.querySelector('#bb').onclick=()=>answer(true);
  bindSwipe(pc,()=>lock||over,answer);
  const hud=()=>api.hud(`🍺 ${i}/${N}`);
  function show(){
    const p=clients[i];
    pc.innerHTML=`<div class="avbox ${p.look.wob?'drunkwob':''}">${avatar(p.look)}</div><div class="counter"><div class="glass"></div></div>`;
    pc.style.transform='';pc.classList.remove('enter');void pc.offsetWidth;pc.classList.add('enter');
    tmax=Math.max(1.4,3-i*0.12);tl=tmax;lock=false;hud();
  }
  function answer(beer){
    if(lock||over)return;lock=true;const p=clients[i];const ok=(p.tp==='adult'||p.tp==='marcel')===beer;
    const g=pc.querySelector('.glass');g.textContent=beer?'🍺':'💧';g.classList.add('serve');
    dots[i].classList.add(ok?'ok':'ko');
    if(ok){i++;hud();
      if(i>=N){over=true;setTimeout(()=>api.end(true,'Service parfait !',`${N} clients servis sans erreur. Et il reste de la bière pour Marcel !`),500);}
      else setTimeout(show,450);
    }else{over=true;setTimeout(()=>api.end(false,'Raté !',REASON[p.tp]),550);}
  }
  show();
  return{
    update(dt){
      if(lock||over)return;tl-=dt;const r=Math.max(0,tl/tmax);fill.style.width=(r*100)+'%';
      fill.style.background=r>.5?'#2fb36d':r>.25?'#ffcf33':'#ff6b5b';
      if(tl<=0){over=true;lock=true;dots[i].classList.add('ko');api.end(false,'Trop lent !','Le client est reparti à sec. Il faut décider plus vite !');}
    },
    destroy(){over=true;}
  };
}

/* ================= MINI-JEU 5 : CHRISTOPHE ================= */
function gameChristophe(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;
  const ROUNDS=[{n:25,t:25},{n:45,t:30},{n:70,t:35}];
  const C=CHARS.christophe.look;
  let r=0,time=ROUNDS[0].t,over=false,started=false,t=0,people=[],target=null,fx=[],found=false,reveal=false,roundT=0;
  const isLike=l=>l.hair==='short'&&l.hairColor===C.hairColor&&l.beard&&l.mustache;
  function crowdLook(level){
    let l;
    do{
      l=randLook({sunglasses:Math.random()<.1});if(Math.random()<.35){l.shirt=PINK;l.logo=true;}
      if(Math.random()<0.2+0.15*level){
        shuffle(['hair','color','glasses','mustache']).slice(0,1+level).forEach(k=>{
          if(k==='hair')l.hair='short';if(k==='color')l.hairColor=C.hairColor;if(k==='glasses'){l.beard='short';l.beardColor=C.beardColor;}
          if(k==='mustache'){l.mustache=true;l.mustacheColor=C.mustacheColor;}});
      }
    }while(isLike(l));
    return l;
  }
  const portrait=svgImg(avatar(C,{viewBox:'30 20 140 140'}));
  function build(){
    const W=cv.W,H=cv.H,dk=H*0.34,n=ROUNDS[r].n,gap=r<2?26:21;const pts=[];
    for(let i=0;i<=n;i++){
      let p=null;
      for(let k=0;k<80;k++){
        const inPool=Math.random()<0.6;
        const c=inPool?{x:16+Math.random()*(W-32),y:dk+22+Math.random()*(H-dk-40),head:true}:{x:20+Math.random()*(W-40),y:H*0.12+Math.random()*(dk-H*0.12-4),head:false};
        if(!c.head&&c.x<W*0.2)continue;
        if(c.head&&c.x<W*0.36&&c.y<dk+H*0.12)continue;
        if(pts.every(q=>Math.hypot(q.x-c.x,q.y-c.y)>gap)){p=c;break;}
      }
      if(p)pts.push(p);
    }
    const ti=Math.floor(Math.random()*pts.length);
    people=pts.map((q,i)=>{const me=i===ti;const look=me?C:crowdLook(r);
      return{fx:q.x/W,fy:q.y/H,head:q.head,me,ph:Math.random()*6,
        img:svgImg(q.head?avatar(look,{viewBox:'30 20 140 140'}):avatar(look))};});
    people.sort((a,b)=>a.fy-b.fy);target=people.find(q=>q.me);
    found=false;time=ROUNDS[r].t;roundT=0;
  }
  const pos=q=>{const x=q.fx*cv.W,y=q.fy*cv.H;return q.head?{x,y,cx:x,cy:y}:{x,y,cx:x,cy:y-24};};
  const hud=()=>api.hud(`🔎 ${r+1}/${ROUNDS.length}  ⏱ ${Math.ceil(Math.max(0,time))}s`);
  build();hud();
  const ov=document.createElement('div');ov.className='findme';
  ov.innerHTML=`<div class="fm-card">${avatar(C)}<h3>Voici Christophe</h3><p>Cheveux courts bruns, moustache et petite barbe grisonnante. Retrouve-le dans la foule, 3 fois de suite !</p><button class="btn">Chercher !</button></div>`;
  stage.appendChild(ov);
  ov.querySelector('button').onclick=e=>{e.stopPropagation();ov.remove();started=true;t=0;};
  const onDown=e=>{
    e.preventDefault();if(!started||over||found)return;const q=cv.pt(e);const tp=pos(target);
    if(Math.hypot(tp.cx-q.x,tp.cy-q.y)<22){
      found=true;fx.push({x:tp.cx,y:tp.cy-30,txt:'Trouvé !',t:0,c:'#7dffa8'});
      setTimeout(()=>{if(over)return;r++;
        if(r>=ROUNDS.length){over=true;api.end(true,'Bien joué !','Christophe a été démasqué 3 fois. Il va devoir retourner voir Christian…');}
        else{build();hud();}},1300);
      return;
    }
    if(people.some(p=>{const pp=pos(p);return Math.hypot(pp.cx-q.x,pp.cy-q.y)<20;})){time-=2;fx.push({x:q.x,y:q.y-20,txt:'Pas lui ! -2s',t:0,c:'#ff6b5b'});}
  };
  cv.c.addEventListener('pointerdown',onDown);
  function drawSlide(W,H,dk){
    const tx=W*0.03,tw=W*0.11;
    ctx.fillStyle='#d8dde3';ctx.strokeStyle=INK;ctx.lineWidth=3;
    ctx.fillRect(tx,H*0.05,tw,dk-H*0.05);ctx.strokeRect(tx,H*0.05,tw,dk-H*0.05);
    for(let y=H*0.09;y<dk;y+=12){ctx.beginPath();ctx.moveTo(tx+4,y);ctx.lineTo(tx+tw-4,y);ctx.stroke();}
    const path=()=>{ctx.beginPath();ctx.moveTo(tx+tw*0.6,H*0.06);ctx.bezierCurveTo(W*0.42,H*0.08,W*0.4,H*0.24,W*0.2,H*0.26);ctx.bezierCurveTo(W*0.08,H*0.28,W*0.12,dk+H*0.04,W*0.26,dk+H*0.07);};
    ctx.lineCap='round';
    path();ctx.strokeStyle=INK;ctx.lineWidth=26;ctx.stroke();
    path();ctx.strokeStyle='#ff8a1f';ctx.lineWidth=19;ctx.stroke();path();ctx.strokeStyle='#2f6fd0';ctx.lineWidth=3;ctx.stroke();
    path();ctx.strokeStyle='#ffc27a';ctx.lineWidth=5;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(W*0.27,dk+H*0.08,26,8,0,0,7);ctx.fill();
  }
  return{
    update(dt){
      if(over)return;t+=dt;roundT+=dt;
      for(const p of people)p.ph+=dt*3;
      for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>1.2)fx.splice(i,1);}
      if(started&&!found){time-=dt;
        if(time<=0){time=0;over=true;reveal=true;hud();api.end(false,'Il est trop fort !','Christophe est resté caché… Il était dans le cercle rouge.');return;}}
      hud();
    },
    draw(){
      const W=cv.W,H=cv.H,dk=H*0.34;ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#ece8df';ctx.fillRect(0,0,W,dk);ctx.strokeStyle='rgba(160,120,70,.22)';ctx.lineWidth=2;
      for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,dk);ctx.stroke();}
      for(let y=0;y<dk;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      drawHall(ctx,0,0,W,dk*0.42);const gr=ctx.createLinearGradient(0,dk,0,H);gr.addColorStop(0,'#4fd0d3');gr.addColorStop(1,'#1b9fb2');ctx.fillStyle=gr;ctx.fillRect(0,dk,W,H-dk);
      ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=3;
      for(let k=0;k<8;k++){const yy=dk+(H-dk)*(k+0.5)/8;ctx.beginPath();for(let x=0;x<=W;x+=12){const y=yy+Math.sin(x*0.04+t*2+k)*3;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}
      ctx.fillStyle='#fff';ctx.fillRect(0,dk-5,W,9);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,dk+4);ctx.lineTo(W,dk+4);ctx.stroke();
      drawSlide(W,H,dk);
      for(const p of people){
        const q=pos(p);
        if(p.head){const rr_=15,y=q.y+Math.sin(p.ph)*1.5;
          ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(q.x,y+rr_*0.8,rr_*1.4,rr_*0.4,0,0,7);ctx.fill();
          drawImg(ctx,p.img,q.x-rr_,y-rr_,rr_*2,rr_*2);
          
        }else{const w=32,h=37,y=q.y+Math.abs(Math.sin(p.ph))*-1.5;drawImg(ctx,p.img,q.x-w/2,y-h,w,h);}
      }
      if(target&&(found||reveal)){const q=pos(target);ctx.strokeStyle=found?'#2fb36d':'#ff3b3b';ctx.lineWidth=5;ctx.beginPath();ctx.arc(q.cx,q.cy,24+Math.sin(t*8)*3,0,7);ctx.stroke();}
      ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.arc(W-30,30,24,0,7);ctx.fill();ctx.stroke();
      drawImg(ctx,portrait,W-50,10,40,40);
      for(const f of fx)floatText(ctx,f);
      if(started&&roundT<1.6&&!found)bubbleText(ctx,W/2,24,`Manche ${r+1} : trouve Christophe !`,15);
    },
    destroy(){cv.c.removeEventListener('pointerdown',onDown);cv.destroy();}
  };
}

/* ================= MINI-JEU 6 : AGNÈS – le service de l'apéro ================= */
function miniQuiche(ctx,x,y,R,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ctx.fillStyle='#e6b56e';ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.beginPath();
  for(let k=0;k<=20;k++){const a=k/20*Math.PI*2,r=R*(k%2?0.9:1);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#f2b33d';ctx.beginPath();ctx.arc(0,0,R*0.68,0,7);ctx.fill();
  ctx.fillStyle='#ff8fa3';ctx.fillRect(-R*0.3,-R*0.2,R*0.25,R*0.18);ctx.fillRect(R*0.1,R*0.1,R*0.25,R*0.18);
  ctx.fillStyle='#2fb36d';ctx.beginPath();ctx.arc(R*0.15,-R*0.25,R*0.1,0,7);ctx.fill();ctx.restore();
}
function gameAgnes(stage,api){
  const cv=makeCanvas(stage),ctx=cv.ctx;const GOAL=15,MAXMISS=5,DUR=60;

  let time=DUR,el=0,t=0,over=false,served=0,missed=0,cd=0,nextS=0.4,aim=null;
  const sw=[],qs=[],fx=[];const mc={x:-60,dir:1,active:false,next:5,ph:0};
  const geo=()=>{const W=cv.W,H=cv.H;return{W,H,edge:H*0.5,tx:W/2,ty:H*0.84,my:H*0.68};};
  const hud=()=>api.hud(`🥧 ${served}/${GOAL}  😩 ${missed}/${MAXMISS}`);hud();
  function spawn(){const g=geo();
    for(let k=0;k<20;k++){const x=30+Math.random()*(g.W-60),y=g.H*0.1+Math.random()*(g.edge-g.H*0.16);
      if(sw.every(o=>Math.hypot(o.x*g.W-x,o.y*g.H-y)>70)){sw.push({x:x/g.W,y:y/g.H,age:0,life:Math.max(1.9,3.4-el*0.03),img:pick(heads),ph:Math.random()*6});return;}}}
  const down=e=>{e.preventDefault();if(over)return;aim=cv.pt(e);};
  const moveP=e=>{if(aim)aim=cv.pt(e);};
  const up=e=>{e.preventDefault();if(!aim||over){aim=null;return;}const p=cv.pt(e),g=geo();aim=null;if(cd>0)return;
    let dx=p.x-g.tx,dy=p.y-(g.ty-24);if(dy>-10)dy=-10;const l=Math.hypot(dx,dy),v=720*Math.max(.8,g.W/400);
    qs.push({x:g.tx,y:g.ty-24,vx:dx/l*v,vy:dy/l*v,rot:0});cd=0.28;};
  cv.c.addEventListener('pointerdown',down);cv.c.addEventListener('pointermove',moveP);cv.c.addEventListener('pointerup',up);
  return{
    update(dt){
      if(over)return;t+=dt;el+=dt;time-=dt;cd=Math.max(0,cd-dt);const g=geo();
      const maxSw=1+Math.min(3,Math.floor(el/12));nextS-=dt;if(nextS<=0&&sw.length<maxSw){spawn();nextS=Math.max(0.4,1.1-el*0.012);}
      for(let k=sw.length-1;k>=0;k--){const o=sw[k];o.age+=dt;o.ph+=dt*4;
        if(o.age>o.life){missed++;fx.push({x:o.x*g.W,y:o.y*g.H-20,txt:'Il a faim…',t:0,c:'#ff6b5b'});sw.splice(k,1);hud();}}
      if(!mc.active){mc.next-=dt;if(mc.next<=0){mc.active=true;mc.x=mc.dir>0?-40:g.W+40;}}
      else{mc.ph+=dt*8;mc.x+=mc.dir*(70+el*2.2)*Math.max(.8,g.W/400)*dt;
        if((mc.dir>0&&mc.x>g.W+50)||(mc.dir<0&&mc.x<-50)){mc.active=false;mc.dir*=-1;mc.next=Math.max(1,3.5+Math.random()*3-el*0.04);}}
      for(let k=qs.length-1;k>=0;k--){const q=qs[k];q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=dt*10;

        let hit=-1;for(let m=0;m<sw.length;m++){if(Math.hypot(q.x-sw[m].x*g.W,q.y-sw[m].y*g.H)<28){hit=m;break;}}
        if(hit>=0){const o=sw[hit];served++;fx.push({x:o.x*g.W,y:o.y*g.H-24,txt:'Merci !',t:0,c:'#7dffa8'});sw.splice(hit,1);qs.splice(k,1);hud();continue;}
        if(q.y<-20||q.x<-20||q.x>g.W+20)qs.splice(k,1);}
      for(let k=fx.length-1;k>=0;k--){fx[k].t+=dt;if(fx[k].t>1.2)fx.splice(k,1);}
      if(served>=GOAL){over=true;api.end(true,"L'apéro est servi !",`${GOAL} nageurs régalés de mini-quiches en ${Math.round(DUR-time)} secondes. Agnès est fière de toi !`);return;}
      if(missed>=MAXMISS){over=true;api.end(false,'Ils ont trop faim !',`${MAXMISS} nageurs sont repartis le ventre vide. Les mini-quiches d'Agnès méritaient mieux !`);return;}

      for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,g.edge);ctx.lineTo(x,H);ctx.stroke();}

        ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(x,y+r*0.8,r*1.5,r*0.4,0,0,7);ctx.fill();

        ctx.strokeStyle=k>.5?'#2fb36d':k>.25?'#ffcf33':'#ff3b3b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,r+6,-Math.PI/2,-Math.PI/2+k*Math.PI*2);ctx.stroke();
        ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+r+8,y-r-6,11,0,7);ctx.fill();ctx.stroke();miniQuiche(ctx,x+r+8,y-r-6,7,0);}
      if(mc.active){const mw=56,mh=mw*1.15;ctx.save();ctx.translate(mc.x,g.my);ctx.rotate(Math.sin(mc.ph)*0.06);drawImg(ctx,marcelImg,-mw/2,-mh,mw,mh);ctx.restore();
        bubbleText(ctx,mc.x,g.my-mh-12,'Une petite ?',12);}
      if(aim){ctx.save();ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(27,42,58,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(g.tx,g.ty-24);ctx.lineTo(aim.x,Math.min(aim.y,g.ty-34));ctx.stroke();ctx.restore();}
      const aw=Math.min(84,W*0.22),ah=aw*1.15;drawImg(ctx,agnes,g.tx-aw/2,g.ty-ah*0.62,aw,ah);
      ctx.fillStyle='#d6dde4';ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(g.tx,g.ty-22,aw*0.7,11,0,0,7);ctx.fill();ctx.stroke();
      if(cd<=0.05)[-1,0,1].forEach(k=>miniQuiche(ctx,g.tx+k*aw*0.35,g.ty-30,9,0));
      for(const q of qs)miniQuiche(ctx,q.x,q.y,10,q.rot);
      for(const f of fx)floatText(ctx,f);
      if(t<4)bubbleText(ctx,W/2,g.edge+24,'Touche un nageur affamé pour lui lancer une quiche !',13);
    },
    destroy(){cv.c.removeEventListener('pointerdown',down);cv.c.removeEventListener('pointermove',moveP);cv.c.removeEventListener('pointerup',up);cv.destroy();}
  };
}

/* ================= MINI-JEU 7 : JACKY – les 7 différences ================= */
const KNOBS=[[103,172],[196,135],[110,128]];

  ctx.save();ctx.translate(193,92);ctx.rotate(ha*Math.PI/180);tube(0,0,24,-14,8,F);tube(24,-14,52,-20,8,F);tube(42,-18,56,-21,9,'#2b2b2b');ctx.restore();

    update(dt){

      if(gos>=100){over=true;hud();api.end(true,'Tous les potins y sont passés !','Vous avez tout raconté sans vous faire prendre, et les enfants savent nager. Bravo !');return;}

const MOVES=['Bras en croix','Jumping jack','Genou levé'];
function drawMove(ctx,i,x,y,r){

  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(x,y-r*0.58,r*0.16,0,7);ctx.fill();
  L([[0,-0.4],[0,0.15]]);
  if(i===0){L([[-0.7,-0.28],[0.7,-0.28]]);L([[-0.18,0.65],[0,0.15],[0.18,0.65]]);}
  else if(i===1){L([[-0.5,-0.8],[0,-0.32],[0.5,-0.8]]);L([[-0.45,0.62],[0,0.15],[0.45,0.62]]);}
  else{L([[-0.42,-0.05],[-0.2,-0.3],[0,-0.32]]);L([[0,-0.32],[0.2,-0.3],[0.42,-0.05]]);L([[0,0.15],[-0.08,0.65]]);L([[0,0.15],[0.38,0.1],[0.36,0.48]]);}
  ctx.restore();
}
function gameChristine(stage,api){

  const cp=JSON.parse(JSON.stringify(POSES.idle));
  const notes=[];
  for(let b=4;b<=68;b++){
    if(Math.random()<(b<36?0.7:0.85))notes.push({t:b*BEAT,lane:Math.floor(Math.random()*3)});
    if(b>=36&&Math.random()<0.3)notes.push({t:(b+0.5)*BEAT,lane:Math.floor(Math.random()*3)});
  }
  notes.forEach(n=>{n.hit=false;n.miss=false;});
  let ac=null;try{ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(_){ac=null;}
  const clock=()=>ac?ac.currentTime:performance.now()/1000;const t0=clock()+2;const now=()=>clock()-t0;
  if(ac){
    const nb=ac.createBuffer(1,Math.floor(ac.sampleRate*0.05),ac.sampleRate);const dd=nb.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
    const master=ac.createGain();master.gain.value=0.6;master.connect(ac.destination);
    const tone=(at,fr,d,vol,type)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'triangle';o.frequency.value=fr;
      g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+0.01);g.gain.exponentialRampToValueAtTime(0.0001,at+d);o.connect(g).connect(master);o.start(at);o.stop(at+d+0.02);};
    const BASS=[130.8,110,87.3,98];
    for(let b=0;b<=END_B;b++){const at=t0+b*BEAT;
      const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,at);o.frequency.exponentialRampToValueAtTime(45,at+0.15);
      g.gain.setValueAtTime(0.8,at);g.gain.exponentialRampToValueAtTime(0.001,at+0.2);o.connect(g).connect(master);o.start(at);o.stop(at+0.22);
      const sN=ac.createBufferSource();sN.buffer=nb;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const gh=ac.createGain();
      gh.gain.setValueAtTime(0.25,at+BEAT/2);gh.gain.exponentialRampToValueAtTime(0.001,at+BEAT/2+0.05);sN.connect(f).connect(gh).connect(master);sN.start(at+BEAT/2);
      tone(at,BASS[Math.floor(b/4)%4],BEAT*0.9,0.18,'sine');}
    notes.forEach(n=>tone(t0+n.t,[523.3,659.3,784][n.lane],0.15,0.08));
  }
  let hits=0,misses=0,combo=0,pose=1,poseT=0,over=false;const fx=[],flash=[0,0,0];
  const hud=()=>api.hud(`🎵 ${hits} ✅  ${misses} ❌`);hud();
  const geo=()=>{const W=cv.W,H=cv.H,lw=Math.min(W/3.2,120);return{W,H,lw,top:H*0.33,hy:H*0.84,cx:i=>W/2+(i-1)*lw};};
  const onDown=e=>{e.preventDefault();if(over)return;const q=cv.pt(e),g=geo();
    const lane=Math.max(0,Math.min(2,Math.round((q.x-g.W/2)/g.lw)+1));flash[lane]=0.15;const tn=now();
    let best=null,bd=WIN;for(const n of notes){if(n.hit||n.miss||n.lane!==lane)continue;const d=Math.abs(n.t-tn);if(d<bd){bd=d;best=n;}}
    if(best){best.hit=true;hits++;combo++;pose=lane;poseT=0.35;fx.push({x:g.cx(lane),y:g.hy-40,txt:bd<0.07?'Parfait !':'Bien !',t:0,c:bd<0.07?'#7dffa8':'#ffcf33'});}
    else{combo=0;fx.push({x:g.cx(lane),y:g.hy-40,txt:'Hors tempo',t:0,c:'#ff8a3d'});}

  cv.c.addEventListener('pointerdown',onDown);
  return{
    update(dt){

      for(let i=0;i<2;i++){cp.a[i]+=(tg.a[i]-cp.a[i])*kk;for(let j=0;j<2;j++)cp.l[i][j]+=(tg.l[i][j]-cp.l[i][j])*kk;}cp.j+=(tg.j-cp.j)*kk;
      if(over)return;const tn=now();poseT=Math.max(0,poseT-dt);for(let i=0;i<3;i++)flash[i]=Math.max(0,flash[i]-dt);
      for(const n of notes)if(!n.hit&&!n.miss&&tn-n.t>WIN){n.miss=true;misses++;combo=0;hud();}
      for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>1.2)fx.splice(i,1);}

    },
    draw(){

      const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#7fd8f7');gr.addColorStop(1,'#1b9fb2');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ece8df';ctx.fillRect(0,0,W,H*0.26);drawHall(ctx,0,0,W,H*0.16);ctx.fillStyle='#fff';ctx.fillRect(0,H*0.26-4,W,8);
      { /* Christine dessinée en entier, avec des membres articulés */
        const u=Math.min(H*0.022,W*0.05),bob=Math.abs(Math.sin(tn*Math.PI/BEAT))*u*0.25;
        const feetY=H*0.26-2-cp.j*u*0.8-bob,cxp=W/2;
        const hipY=feetY-4*u,shY=hipY-3*u,tw=2.5*u,lw=u*0.62;
        const V=(x,y,sd,a,l)=>[x+sd*Math.sin(a)*l,y+Math.cos(a)*l];
        const limbs=[];
        [-1,1].forEach((sd,i)=>{const sx=cxp+sd*tw*0.42,sy=shY+u*0.35,e=V(sx,sy,sd,cp.a[0],1.6*u),h=V(e[0],e[1],sd,cp.a[1],1.5*u);limbs.push({pts:[[sx,sy],e,h],w:lw,arm:1});
          const hx=cxp+sd*tw*0.26,k=V(hx,hipY,sd,cp.l[i][0],2*u),f=V(k[0],k[1],sd,cp.l[i][1],2*u);limbs.push({pts:[[hx,hipY],k,f],w:lw*1.15,arm:0});});

        const torso=(g,c)=>{ctx.fillStyle=c;rr(ctx,cxp-tw/2-g,shY-g,tw+g*2,3*u+g*2,u*0.8+g);ctx.fill();
          [-1,1].forEach(sd=>{ctx.beginPath();ctx.ellipse(cxp+sd*tw*0.45,shY+u*0.45,u*0.62+g,u*0.52+g,sd*0.5,0,7);ctx.fill();});};
        limbs.filter(L=>!L.arm).forEach(L=>stroke(L,L.w+7,INK));limbs.filter(L=>!L.arm).forEach(L=>stroke(L,L.w,CL.skin));
        ctx.fillStyle=INK;rr(ctx,cxp-tw*0.48-3.5,hipY-u*0.9-3.5,tw*0.96+7,u*1.3+7,u*0.4);ctx.fill();ctx.fillStyle='#2b3a55';rr(ctx,cxp-tw*0.48,hipY-u*0.9,tw*0.96,u*1.3,u*0.4);ctx.fill();
        torso(3.5,INK);limbs.filter(L=>L.arm).forEach(L=>stroke(L,L.w+7,INK));
        torso(0,PINK);limbs.filter(L=>L.arm).forEach(L=>stroke(L,L.w,CL.skin));

        limbs.forEach(L=>{const e=L.pts[2];ctx.fillStyle=INK;ctx.beginPath();ctx.arc(e[0],e[1],L.w*0.62+3,0,7);ctx.fill();ctx.fillStyle=CL.skin;ctx.beginPath();ctx.arc(e[0],e[1],L.w*0.62,0,7);ctx.fill();});

      for(let i=0;i<3;i++){const x=g.cx(i);rr(ctx,x-g.lw*0.42,g.top,g.lw*0.84,H-g.top-10,16);ctx.fillStyle=`rgba(255,255,255,${0.12+flash[i]*2})`;ctx.fill();

/* ================= ETHAN : Musclor ou Dodu ================= */
function gameEthan(stage,api){

    update(dt){

        else api.end(false,'Ni l\'un ni l\'autre',`${reps} soulevés : ni Musclor, ni Dodu. Il faut taper encore plus vite !`);}

    draw(){

      ctx.fillStyle=L.skin;ctx.strokeStyle=INK;ctx.lineWidth=4;
      const at=17*sc;
      /* Silhouette d'un seul tenant : on trace d'abord le contour (encre), puis le remplissage par-dessus */
      const armGeo=sd=>{const sx=cx+sd*tw*0.42,sy=top+20*sc,ex=cx+sd*(half+30*sc+m*14*sc),ey=top+th*0.6;
        const hx=ex+sd*(lift>0.5?-8:3)*sc,hy=lift>0.5?top+6*sc:top+th*1.0;

        if(m>0.02){ctx.beginPath();ctx.ellipse(g.bx,g.by,g.len*0.3+grow,g.br+grow,g.ang,0,7);ctx.fill();}
        ctx.beginPath();ctx.arc(g.hx,g.hy,at*0.62+grow,0,7);ctx.fill();};
      const dumbbell=g=>{ctx.fillStyle='#555';ctx.strokeStyle=INK;ctx.lineWidth=3;rr(ctx,g.hx-22*sc,g.hy-4*sc,44*sc,8*sc,3);ctx.fill();ctx.stroke();

        ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(g.bx,g.by-g.br*0.45,g.len*0.14,g.br*0.18,g.ang,0,7);ctx.fill();});
      A.forEach(dumbbell);
      const bellyR=f>0.02?{x:cx,y:top+th*0.74,rx:bRx,ry:th*0.28+f*34*sc}:null;

          ctx.fillStyle=INK;ctx.beginPath();ctx.arc(cx,bellyR.y+bellyR.ry*0.82,3*sc,0,7);ctx.fill();ctx.restore();}
        ctx.strokeStyle='rgba(120,10,60,.3)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(bellyR.x,bellyR.y,bellyR.rx*0.85,bellyR.ry*0.85,0,Math.PI*0.2,Math.PI*0.8);ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(bellyR.x-bellyR.rx*0.35,bellyR.y-bellyR.ry*0.35,bellyR.rx*0.25,bellyR.ry*0.15,-0.4,0,7);ctx.fill();}

      const bw=Math.min(300,W*0.84),bx=(W-bw)/2,by=H*0.9;rr(ctx,bx,by,bw,16,8);
      const gg=ctx.createLinearGradient(bx,0,bx+bw,0);gg.addColorStop(0,'#ffcf33');gg.addColorStop(.5,'#fff');gg.addColorStop(1,'#ff7eb6');ctx.fillStyle=gg;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
      const mx=bx+bw*(b+1)/2;ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(mx,by-4);ctx.lineTo(mx-8,by-16);ctx.lineTo(mx+8,by-16);ctx.closePath();ctx.fill();
      ctx.font='700 13px Fredoka, sans-serif';ctx.textBaseline='top';ctx.fillStyle=INK;ctx.textAlign='left';ctx.fillText('🍔 Dodu',bx,by+20);ctx.textAlign='right';ctx.fillText('Musclor 💪',bx+bw,by+20);
      for(const fl of fx)floatText(ctx,fl);
      if(!started)bubbleText(ctx,W/2,H*0.12,'Tape le plus vite possible pour soulever !',14);

  const segHit=(ax,ay,bx,by,o)=>{const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;let k=((o.x-ax)*dx+(o.y-ay)*dy)/l2;k=Math.max(0,Math.min(1,k));return Math.hypot(ax+dx*k-o.x,ay+dy*k-o.y)<o.r;};
